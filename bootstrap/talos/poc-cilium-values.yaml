# Proof copy of infra/cilium/values.yaml for Talos. Cilium owns CNI + kube-proxy replacement. Public ingress is the cloudflared tunnel
# (outbound-only) and teleport's svc externalIPs (eBPF): no Envoy edge, no Gateway API,
# no host :80/:443 listeners.
kubeProxyReplacement: true

# KubePrism: every node proxies the apiservers on localhost:7445
k8sServiceHost: localhost
k8sServicePort: 7445

ipam:
  operator:
    # k3s default podCIDR
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16

# no L7 policies / no Gateway -> the dedicated Envoy DaemonSet is idle weight
envoy:
  enabled: false

hubble:
  export:
    static:
      enabled: true
      filePath: /var/run/cilium/hubble/evidence.log
      fileMaxSizeMb: 10
      fileMaxBackups: 10
      allowList:
        - '{"source_pod":["services/"],"destination_port":["443"]}'
      fieldMask:
        - time
        - verdict
        - IP
        - l4
        - source.namespace
        - source.pod_name
        - source.identity
        - destination.namespace
        - destination.pod_name
        - destination.identity
        - node_name
        - traffic_direction
        - drop_reason_desc
  # relay kept for cluster-wide `hubble observe` (CLI). UI removed 2026-07-23: rarely opened,
  # flows are reachable via `kubectl -n kube-system exec ds/cilium -c cilium-agent -- hubble observe`.
  relay:
    enabled: true
  ui:
    enabled: false

operator:
  replicas: 1
  prometheus:
    enabled: true

# agent + operator metrics for the CiliumAgentMissing / network alerts. serviceMonitor stays
# off: it needs the Prometheus CRDs at Cilium install time, which do not exist on a DR
# rebuild (Cilium comes up before ArgoCD). A PodMonitor in monitoring/extras covers it.
prometheus:
  enabled: true

# a restart must touch ONE node at a time: eBPF programs live in the kernel and keep
# forwarding while an agent is down (bpffs is mounted), but pod creation and policy updates
# stall on that node meanwhile. Default maxUnavailable=2 would take 2 of 3 at once.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

# Talos: cgroup v2 is mounted by the OS, and the agent gets exactly the capabilities the
# Talos Cilium guide lists instead of the chart default.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
