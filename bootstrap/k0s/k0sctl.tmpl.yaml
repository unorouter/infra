# k0sctl cluster definition, host list generated by gen-k0sctl.sh (node IPs stay out of git).
# One file replaces cloud-init templates plus live HelmChart CRs: `k0sctl apply` installs,
# upgrades (bump spec.k0s.version) and repairs. Charts here are bootstrap only; everything
# else arrives through ArgoCD from apps/.
apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: unorouter
spec:
  hosts: []   # filled by gen-k0sctl.sh
  k0s:
    version: v1.36.4+k0s.0
    dynamicConfig: false
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: unorouter
      spec:
        api:
          sans: []   # filled by gen-k0sctl.sh: Tailscale IPs and hostnames
        telemetry:
          enabled: false
        storage:
          type: etcd
        network:
          provider: custom          # Cilium below; kube-router stays off
          kubeProxy:
            disabled: true          # Cilium kubeProxyReplacement
          podCIDR: 10.42.0.0/16     # unchanged from k3s so TRUSTED_NETWORKS and policies still match
          serviceCIDR: 10.43.0.0/16
          nodeLocalLoadBalancing:
            enabled: true           # workers keep an apiserver path when one controller is down, no external LB
            type: EnvoyProxy
        extensions:
          helm:
            repositories:
              - name: cilium
                url: https://helm.cilium.io/
              - name: argo
                url: https://argoproj.github.io/argo-helm
            charts:
              - name: cilium
                chartname: cilium/cilium
                version: "1.20.1"
                namespace: kube-system
                order: 1
                values: |
                  kubeProxyReplacement: true
                  k8sServiceHost: 127.0.0.1
                  k8sServicePort: 6443
                  ipam:
                    operator:
                      clusterPoolIPv4PodCIDRList:
                        - 10.42.0.0/16
                  envoy:
                    enabled: false
                  hubble:
                    relay:
                      enabled: true
                    ui:
                      enabled: false
                  operator:
                    replicas: 1
                    prometheus:
                      enabled: true
                  prometheus:
                    enabled: true
                  updateStrategy:
                    rollingUpdate:
                      maxUnavailable: 1
              - name: argo-cd
                chartname: argo/argo-cd
                version: "10.7.1"
                namespace: argocd
                order: 2
                values: |
                  crds:
                    install: true
                    keep: true
                  configs:
                    cm:
                      url: https://argocd.unorouter.com
                      admin.enabled: "false"
                      oidc.config: |
                        name: GitHub
                        issuer: https://dex.unorouter.com
                        clientID: argocd
                        clientSecret: $argocd-dex-sso:argocdClientSecret
                        requestedScopes: [openid, profile, email, groups]
                    rbac:
                      policy.csv: |
                        g, unorouter:admins, role:admin
                      scopes: "[groups, email]"
