# Cluster level settings shared by every node. Pod and service CIDRs stay the k3s values so
# TRUSTED_NETWORKS and every network policy keep matching. kube-proxy off: Cilium replaces it.
# CoreDNS off: git's infra/coredns owns kube-dns (10.43.0.10) with the rewrites for
# s3.unorouter.com and teleport.unorouter.com.
cluster:
  network:
    podSubnets: [10.42.0.0/16]
    serviceSubnets: [10.43.0.0/16]
  proxy:
    disabled: true
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
      # the default; changing any etcd arg restarts etcd without a reboot, the only way to make it
      # load a new CA (the Talos API cannot restart etcd)
      log-level: info
    # peer and client traffic pinned to the WireGuard mesh (talconfig networkInterfaces); without this etcd
    # advertises the first address it finds (node13 came up on its public IP on 2026-09-10)
    advertisedSubnets: [10.200.0.0/24]
    listenSubnets: [10.200.0.0/24]
  apiServer:
    # the pprof endpoint is only for debugging; off also restarts the apiserver on apply,
    # which reloads its etcd client certificate after an etcd CA change
    extraArgs:
      profiling: "false"
    # Talos enforces Pod Security `baseline` cluster wide (k3s enforced nothing). The
    # namespaces with hostPath or root pods are exempted here rather than labelled in git,
    # so the manifests stay valid on any cluster: Vector and node-exporter (monitoring),
    # local-path, Velero's node agent. kube-system is exempt by Talos default and must not
    # be listed: a duplicate entry makes every apiserver refuse to start (2026-09-13).
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1alpha1
          kind: PodSecurityConfiguration
          defaults:
            enforce: baseline
            enforce-version: latest
            audit: restricted
            audit-version: latest
            warn: restricted
            warn-version: latest
          exemptions:
            usernames: []
            runtimeClasses: []
            namespaces: [monitoring, local-path-storage, velero]
    # Every request, reads included, at Metadata: who, from where, which verb on which object.
    # The request URI names the object and the exec command; bodies stay out because they
    # would carry secret values. The one exception is a system:masters client creating or
    # changing a workload: its body is the pod spec (command, hostPID, privileged, mounts).
    # Controllers never hold system:masters, so their env literals never reach the log.
    # About 15 requests/s. Log: /var/log/audit/kube.
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      omitStages: [RequestReceived]
      rules:
        - level: Request
          userGroups: ["system:masters"]
          verbs: [create, update, patch]
          resources:
            - group: ""
              resources: [pods, pods/ephemeralcontainers, replicationcontrollers]
            - group: apps
              resources: [deployments, daemonsets, statefulsets, replicasets]
            - group: batch
              resources: [jobs, cronjobs]
        - level: Metadata
