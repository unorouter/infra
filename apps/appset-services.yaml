# Repo-based service discovery: any repo in the unorouter org with a k8s/ directory becomes an
# ArgoCD Application. Adding a service = new repo + k8s/ dir + push. No commit in this repo.
#
# THIS IS A DEPLOY GATE. Write access to a matching repo is write access to the cluster, bounded
# by the `apps` AppProject (see appproject-apps.yaml). Two controls make that acceptable:
#   - project is HARDCODED to `apps`; templating it would let a repo pick an unrestricted project
#   - allBranches stays false (the default), so only each repo's default branch can deploy
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - scmProvider:
        github:
          organization: unorouter
          tokenRef:
            secretName: argocd-scm
            key: token
        # one filter block = AND of its conditions; separate blocks would OR
        filters:
          - pathsExist: [k8s]
        # 15min: pathsExist costs an API call per repo, so do not poll aggressively
        requeueAfterSeconds: 900
  template:
    metadata:
      name: '{{.repository}}'
    spec:
      project: apps
      source:
        # NOT {{.url}} -- the SCM generator returns the SSH clone URL, which ArgoCD has no
        # key for and the project's sourceRepos does not allow. Build the HTTPS URL instead.
        repoURL: 'https://github.com/{{.organization}}/{{.repository}}.git'
        targetRevision: '{{.branch}}'
        path: k8s
      destination:
        server: https://kubernetes.default.svc
        # A destination namespace is required even though every manifest sets its own; an
        # empty one matches no allowed destination in the project. Manifests targeting
        # databases/ still work -- their own metadata.namespace wins.
        namespace: services
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry:
          limit: 5
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
        # MUST match the databases app's apply mode. Adopting a CNPG Cluster under a different
        # mode changes field ownership, and ArgoCD applies SSA with --force-conflicts, so it
        # would stomp operator-managed spec fields and roll Postgres pods.
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          managedFieldsManagers: [external-secrets]
