# Safety net for vercel/next.js#92287. Both leak families are fixed in-app (fetch-clone
# release patch + abort-reason stack materialization in instrumentation.ts); remaining
# growth is the bounded use-cache LRU, measured plateauing ~300MiB at 30min+ against the
# 3Gi limit. Kept at 6h as insurance against a regression reintroducing the leak (a Next
# bump dropping the bundle patch, or upstream changing the abort-reason path). DELETE
# once upstream ships real fixes and a patched-free build holds a flat curve.
#
# RBAC lives here and not in the app repo on purpose: the apps AppProject must not let a
# public repo grant itself API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unorouter-restarter
  namespace: services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unorouter-restarter
  namespace: services
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [unorouter]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unorouter-restarter
  namespace: services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unorouter-restarter
subjects:
  - kind: ServiceAccount
    name: unorouter-restarter
    namespace: services
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restart-unorouter
  namespace: services
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: unorouter-restarter
          restartPolicy: Never
          containers:
            - name: restart
              # NOT bitnami/kubectl: Broadcom pulled the free bitnami tags, the image no
              # longer pulls
              image: rancher/kubectl:v1.36.2
              command:
                - kubectl
                - -n
                - services
                - rollout
                - restart
                - deployment/unorouter
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
