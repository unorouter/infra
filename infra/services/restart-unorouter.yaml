# CONTAINMENT for vercel/next.js#92287, not just insurance. Two leak families are fixed
# in-app (fetch-clone release patch + abort-reason stack materialization in
# instrumentation.ts, heap-snapshot verified), but a THIRD source remains: working set
# climbs a steady ~600MiB/h under daytime traffic with no plateau (measured 2026-08-13
# 19:00-20:45 UTC on both pods via container_memory_working_set_bytes). From a ~650MiB
# baseline that reaches the 3Gi limit in ~4h, so the restart MUST stay under that.
# DELETE only once a build holds a flat working-set curve for a full day.
#
# RBAC lives here and not in the app repo on purpose: the apps AppProject must not let a
# public repo grant itself API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unorouter-restarter
  namespace: services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unorouter-restarter
  namespace: services
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [unorouter]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unorouter-restarter
  namespace: services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unorouter-restarter
subjects:
  - kind: ServiceAccount
    name: unorouter-restarter
    namespace: services
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restart-unorouter
  namespace: services
spec:
  # 2h. Daytime rate measured 2026-08-14 08:30 UTC is 600-818MiB/h (higher than the
  # evening 600), which puts the 3Gi limit ~1.1h after a pod crosses 2Gi -- 3h left only
  # ~30min of margin on the fast pod. Raising the limit instead is NOT an option: nodes
  # are already committed at 62-106% of allocatable, so a bigger ceiling trades a clean
  # container restart for node-level memory pressure and evictions.
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: unorouter-restarter
          restartPolicy: Never
          containers:
            - name: restart
              # NOT bitnami/kubectl: Broadcom pulled the free bitnami tags, the image no
              # longer pulls
              image: rancher/kubectl:v1.36.2
              command:
                - kubectl
                - -n
                - services
                - rollout
                - restart
                - deployment/unorouter
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
