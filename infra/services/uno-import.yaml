# uno-import lives in its own namespace because its gluetun sidecar needs NET_ADMIN, which
# the cluster-wide PodSecurity baseline (bootstrap/talos/patches/cluster.yaml) forbids. The
# labels override the cluster default for this namespace only; nothing else may run here.
apiVersion: v1
kind: Namespace
metadata:
  name: uno-import
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: uno-import
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Card importer behind a gluetun sidecar. In from the tunnel (cards.unorouter.com). Out: only
# the PIA OpenVPN tunnel and PIA's API; every card site is fetched inside the tunnel.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: uno-import
  namespace: uno-import
spec:
  endpointSelector:
    matchLabels: { app: uno-import }
  ingress:
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: cloudflared, app: cloudflared }
      toPorts:
        - ports: [{ port: "4000", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "4000", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "1197", protocol: UDP }
            - { port: "1198", protocol: UDP }
            - { port: "443", protocol: TCP }
