apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zz-block-warmup-exfil
  namespace: services
spec:
  description: Keep bot-labelled Jobs off the network.
  endpointSelector:
    matchLabels:
      app: unorouter-bot
    matchExpressions:
      - key: job-name
        operator: Exists
  egressDeny:
    - toEntities:
        - all
