# Egress tunnel for upstreams whose CDN challenges this cluster's IP.
#
# bytecatcode sits behind Cloudflare bot protection and answers a request from
# the Hetzner egress IP with a JavaScript "Just a moment..." challenge, which no
# API client can solve, so every bcc1 relay call 403'd and $2k of credit sat
# unspendable. The same key returns 200 through a PIA exit.
#
# ONE tunnel, not a DaemonSet per node: all three new-api pods relay (IsMasterNode
# gates only background tasks), but bcc1 is one provider of many, so a single
# stable exit is easier to keep un-flagged than three, and if it dies only bcc1
# stops rather than a third of every provider.
#
# Reached per CHANNEL, never cluster-wide: new-api's channel `proxy` setting sends
# only the channels that need it through here (service/http_client.go), so every
# other provider keeps normal egress.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-env
  namespace: services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gluetun-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gluetun-env
---
apiVersion: v1
kind: Service
metadata:
  name: gluetun
  namespace: services
spec:
  selector:
    app: gluetun
  ports:
    - name: http-proxy
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun
  namespace: services
spec:
  replicas: 1
  # The tunnel is the identity: two pods would hold two exit IPs and callers
  # would silently alternate between them, so never run this alongside itself.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gluetun
  template:
    metadata:
      labels:
        app: gluetun
    spec:
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.40.0
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: private internet access
            - name: VPN_TYPE
              value: openvpn
            # Empty = any server, the widest pool for in-place IP rotation.
            - name: SERVER_REGIONS
              value: ""
            - name: HTTPPROXY
              value: "on"
            - name: HTTPPROXY_LISTENING_ADDRESS
              value: :8888
            # Authenticated on purpose: an unauthenticated listener on a
            # ClusterIP lets anything in the cluster egress through the VPN.
            - name: HTTPPROXY_USER
              valueFrom:
                secretKeyRef: { name: gluetun-env, key: HTTPPROXY_USER }
            - name: HTTPPROXY_PASSWORD
              valueFrom:
                secretKeyRef: { name: gluetun-env, key: HTTPPROXY_PASSWORD }
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef: { name: gluetun-env, key: OPENVPN_USER }
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef: { name: gluetun-env, key: OPENVPN_PASSWORD }
            # Control server, localhost-only: the rotator sidecar shares this
            # pod's netns and rerolls the exit in place rather than restarting.
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: :8001
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: gluetun-auth
              mountPath: /gluetun/auth/config.toml
              subPath: config.toml
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
        # Rolls the exit until one gets past the upstream's CDN, then STOPS.
        # Unlike the glm-proxy rotator there is no captcha to keep alive and no
        # WAF signal file: a working exit stays until it stops working.
        - name: rotator
          image: curlimages/curl:8.11.1
          # curl ships in the image. Installing it at startup races the tunnel
          # routes coming up, and a failed install leaves the loop reporting
          # "not found" forever while every healthcheck still looks green.
          command:
            - sh
            - -c
            - |
              PROBE_URL=https://www.bytecatcode.org/v1/models
              INTERVAL=120
              MAX_ROLLS=25
              BACKOFF=300

              exit_ip() {
                curl -s -m 10 http://127.0.0.1:8001/v1/publicip/ip |
                  sed 's/.*"public_ip":"\([^"]*\)".*/\1/'
              }

              # 403 is the Cloudflare challenge, which is the whole reason this
              # tunnel exists. 401 means the tunnel reached the upstream and only
              # the (absent) API key was rejected, so the exit is usable.
              probe() {
                code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$PROBE_URL")
                [ "$code" != "403" ] && [ "$code" != "000" ]
              }

              reroll() {
                curl -s -X PUT -d '{"status":"stopped"}' http://127.0.0.1:8001/v1/vpn/status >/dev/null
                sleep 3
                curl -s -X PUT -d '{"status":"running"}' http://127.0.0.1:8001/v1/vpn/status >/dev/null
                i=0
                while [ $i -lt 12 ]; do
                  sleep 5
                  probe && return 0
                  i=$((i+1))
                done
              }

              find_good() {
                n=0
                while [ $n -lt "$MAX_ROLLS" ]; do
                  if probe; then
                    echo "[rotator] usable exit $(exit_ip) after $n roll(s)"
                    return 0
                  fi
                  n=$((n+1))
                  echo "[rotator] exit $(exit_ip) challenged, rerolling ($n/$MAX_ROLLS)"
                  reroll
                done
                # Exhausting the rolls usually means the tunnel is down rather
                # than every exit being blocked, so back off instead of spinning.
                echo "[rotator] no usable exit after $MAX_ROLLS rolls, backing off"
                sleep "$BACKOFF"
                return 1
              }

              until find_good; do echo "[rotator] retrying"; done
              while true; do
                sleep "$INTERVAL"
                probe || { echo "[rotator] exit went bad, rerolling"; until find_good; do :; done; }
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
        - name: gluetun-auth
          configMap: { name: gluetun-auth }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-auth
  namespace: services
data:
  # Unauthenticated access to the IP and vpn-status routes only, so the rotator
  # (which shares this pod's netns, hence localhost) can change the exit in
  # place. The control server binds inside the pod and is not in the Service.
  config.toml: |
    [[roles]]
    name = "rotator"
    routes = ["GET /v1/publicip/ip", "GET /v1/vpn/status", "PUT /v1/vpn/status"]
    auth = "none"
