# DB admin role for the admins team: connects as the cert-only superuser `dbadmin`
# (new-api/k8s/pg.yaml managed role, hba `hostssl all dbadmin all cert`). Every session
# and query is in Teleport's audit under the GitHub identity; this is the prod write path,
# `kubectl exec ... psql -U postgres` is break-glass. Applied via tctl create -f.
kind: role
version: v7
metadata:
  name: newapi-db-admin
spec:
  allow:
    db_labels:
      env: prod
    db_names: ["*"]
    db_users: ["dbadmin"]
