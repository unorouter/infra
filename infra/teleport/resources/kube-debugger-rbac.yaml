# Exec tier for the debuggers GitHub team: shell + port-forward into pods in the
# services namespace ONLY. databases/openbao/monitoring stay unreachable. Read
# access comes from the view ClusterRole via the readonly tier; this Role adds
# just the interactive verbs. Applied via kubectl, recorded here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-debuggers
  namespace: services
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-debuggers
  namespace: services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teleport-debuggers
subjects:
  - kind: Group
    name: teleport-debuggers
    apiGroup: rbac.authorization.k8s.io
