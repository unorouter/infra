# Password and server CA of databases/teleport-pg for the auth pods, mirrored by the External
# Secrets kubernetes provider (Role in infra/databases/postgres/teleport-pg.yaml). Follows
# CNPG's CA rotation on its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-teleport-pg-reader
  namespace: teleport
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: k8s-databases
  namespace: teleport
spec:
  provider:
    kubernetes:
      remoteNamespace: databases
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-teleport-pg-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teleport-pg
  namespace: teleport
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: k8s-databases
    kind: SecretStore
  target:
    name: teleport-pg
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: teleport-pg-app, property: password }
    - secretKey: ca.crt
      remoteRef: { key: teleport-pg-ca, property: ca.crt }
