# Cluster-admin for the group the kube-admin Teleport role injects. A named binding instead of
# system:masters: it can be revoked by deleting this object, and audit lines show the group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: teleport-admins
    apiGroup: rbac.authorization.k8s.io
