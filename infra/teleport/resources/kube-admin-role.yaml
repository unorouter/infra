# Kubectl access role. Maps the Teleport user into the k8s group `teleport-admins`, bound to
# cluster-admin in kube-admin-rbac.yaml. kubernetes_labels '*: *' = every registered kube
# cluster (we have one). Reconciled by the Teleport operator from this file.
apiVersion: resources.teleport.dev/v1
kind: TeleportRoleV7
metadata:
  namespace: teleport
  name: kube-admin
spec:
  allow:
    kubernetes_labels:
      "*": "*"
    kubernetes_groups: ["teleport-admins"]
    kubernetes_resources:
      - kind: "*"
        name: "*"
        namespace: "*"
        verbs: ["*"]
