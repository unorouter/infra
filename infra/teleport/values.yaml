# teleport-cluster Helm chart (CE, self-hosted). Access plane: kubectl + Postgres behind
# GitHub SSO, short-lived certs, session recording + audit.
#
# Cluster state and audit events live in the dedicated CNPG cluster databases/teleport-pg (not
# newapi-pg, so Teleport never waits on a newapi-pg restore), which lets two auth pods run on
# different nodes. Losing teleport-pg entirely means a fresh CA and everyone runs `tsh login`
# again. Session recordings survive in S3.
chartMode: standalone
clusterName: teleport.unorouter.com

# The proxy is reached through the Cloudflare tunnel, so no public port 443 exists on any
# node and an ACME http/tls challenge can never complete. Cloudflare terminates the real
# TLS; this in-cluster hop uses a long-lived self-signed cert that cloudflared accepts with
# noTLSVerify (see infra/cloudflared, originServerName teleport.unorouter.com).
acme: false
tls:
  existingSecretName: teleport-origin-tls

# ALPN multiplexing on one port. tsh rides Teleport's WebSocket connection upgrade through
# the tunnel, which is what makes a layer-7 proxy in front of it work at all.
proxyListenerMode: multiplex
# requests only (7 day median), no limits; the chart applies this to auth and proxy
resources: { requests: { cpu: 20m, memory: 128Mi } }

# Auth kept SQLite on the PVC teleport (node11) until 2026-11-05. That PVC is not in git and
# holds the state as of the move to teleport-pg (plus backend.premigration-20261105): it is the
# rollback, so the chart must never own it.
persistence:
  enabled: false

auth:
  highAvailability:
    replicaCount: 2
    requireAntiAffinity: true
    podDisruptionBudget: { enabled: true, minAvailable: 1 }
  teleportConfig:
    teleport:
      storage:
        # PGPASSWORD comes from the environment; the change feed needs wal2json and REPLICATION,
        # both set on teleport-pg
        type: postgresql
        conn_string: "postgresql://teleport@teleport-pg-rw.databases.svc.cluster.local:5432/teleport_backend?sslmode=verify-full&sslrootcert=/etc/teleport-pg/ca.crt"
        # Hetzner Object Storage through the in-cluster s3-gateway (s3.unorouter.com, resolved
        # by CoreDNS, Let's Encrypt certificate), which encrypts client side (rclone crypt) on
        # the way to the Object Locked logs bucket. disablesse stays: Teleport would otherwise ask for SSE-KMS, which Hetzner
        # answers with 400 (every recording after the 2026-09-05 rebuild was lost that way).
        # Interactive `tsh play <session>` does NOT work here and never worked on R2 either: Teleport
        # reads the OLDEST object version as an anti-tamper step and neither R2 nor the gateway
        # serve ListObjectVersions (501). Recordings are evidence, not a replay feature: download
        # the tar through the crypt drill and run `tsh play --format=json <file>` (docs/dr.md).
        audit_sessions_uri: "s3://unorouter-logs/teleport-recordings?endpoint=s3.unorouter.com&region=fsn1&disablesse=true"
        # The first entry is what the web UI queries (events before 2026-11-05 stay in the file
        # log on the old PVC). The stdout mirror lets the audit watcher in monitoring post failed
        # logins, with the GitHub username and source address, to Discord within five minutes.
        audit_events_uri:
          - "postgresql://teleport@teleport-pg-rw.databases.svc.cluster.local:5432/teleport_audit?sslmode=verify-full&sslrootcert=/etc/teleport-pg/ca.crt"
          - "stdout://"
      # A refused GitHub login (an account in none of the org's teams) carries no user in its
      # audit event; the only record of the account is the debug line "Retrieved teams for
      # GitHub user" (github_user), logged before the team check. Vector drops every other
      # teleport debug line before Loki (infra/loki/values-vector.yaml, pods_labels).
      log:
        severity: DEBUG
    auth_service:
      # GitHub SSO only: hide local username/password/passkey from the login UI. Everyone
      # signs in via the org-gated GitHub connector. Break-glass = tctl on the auth pod
      # (kubectl exec), which bypasses UI auth entirely, so no local user is needed.
      authentication:
        type: github
        connector_name: github
        local_auth: false
  # S3 creds for session-recording uploads (ESO secret teleport-s3); teleport-pg password and
  # server CA (ESO secret teleport-pg, infra/teleport/resources/teleport-pg-secret.yaml)
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom: { secretKeyRef: { name: teleport-s3, key: AWS_ACCESS_KEY_ID } }
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom: { secretKeyRef: { name: teleport-s3, key: AWS_SECRET_ACCESS_KEY } }
    - name: PGPASSWORD
      valueFrom: { secretKeyRef: { name: teleport-pg, key: password } }
  extraVolumes:
    - name: teleport-pg-ca
      secret: { secretName: teleport-pg, items: [{ key: ca.crt, path: ca.crt }] }
  extraVolumeMounts:
    - { name: teleport-pg-ca, mountPath: /etc/teleport-pg, readOnly: true }

# expose the proxy on the host network (needs the public IP for ACME + ALPN passthrough)
service:
  type: ClusterIP
  spec:
    # Empty on purpose: the proxy is reached through the Cloudflare tunnel (see
    # infra/cloudflared), so no node IP is published anywhere. If a direct entry is ever
    # needed again it must be a node without DB primaries or OpenBao, and the DNS record
    # and this list must stay in sync (Cilium only answers an externalIP on its owner).
    externalIPs: []
proxy:
  # Two proxies on different nodes: on 2026-11-04 both sat on node11 and its OOM took all
  # tsh and kubectl access with it. A rollout surges one pod, so it needs one free node.
  highAvailability:
    replicaCount: 2
    requireAntiAffinity: true
    podDisruptionBudget: { enabled: true, minAvailable: 1 }
  annotations: {}
  # trust_x_forwarded_for was tried on 2026-09-06 to get real client addresses into the audit
  # log (behind the tunnel every login shows a cloudflared pod IP). It breaks tsh for IPv6
  # clients: the proxy rejects the ALPN WebSocket upgrade with "client source and destination
  # addresses should be valid same TCP version" because the forwarded v6 address is paired with
  # the v4 pod address. Client addresses come from the Cloudflare request log instead.

# The GitHub SSO connector and every role are TeleportGithubConnector / TeleportRoleV7
# objects in infra/teleport/resources, reconciled by the chart's operator (a sidecar of the
# auth pod) so a fresh cluster gets SSO from git with no tctl step. The client secret is read
# from the ESO Secret teleport-github-connector by the operator's secret:// lookup.
# Client ID (not secret): Ov23li6rNPrZg3tJr1v5
operator:
  enabled: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
