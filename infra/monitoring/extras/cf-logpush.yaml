# Cloudflare Logpush receiver for zone unorouter.com. Origin only sees what the edge let through
# (47 of about 330k bot requests in the 2026-11-05 17:35 UTC wave), so the edge's own record of
# every blocked and challenged request, plus a 1% sample of the rest, is pushed here over the ops
# tunnel (logpush.unorouter.com). Not a plaintext bucket: the records carry visitor addresses and
# Hetzner has no at-rest encryption, so the raw batch goes through the s3-gateway (rclone crypt)
# into the locked unorouter-logs bucket (90 day lifecycle), and each record to Loki as one line.
# Jobs, filters and fields: docs/monitoring.md "Cloudflare Logpush".
#
# A batch is answered 200 once the archive holds it; a Loki refusal (rate limit during a wave)
# only drops the Loki copy and is counted, since a 5xx would make Logpush resend and the archive
# would hold the batch twice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-logpush
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-platform, kind: ClusterSecretStore }
  target:
    name: cf-logpush
    creationPolicy: Owner
    template:
      data:
        LOGPUSH_SECRET: "{{ .secret }}"
        ARCHIVE_ENDPOINT: https://s3.unorouter.com
        ARCHIVE_BUCKET: unorouter-logs
        ARCHIVE_ACCESS_KEY: "{{ .ak }}"
        ARCHIVE_SECRET_KEY: "{{ .sk }}"
  data:
    - secretKey: secret
      remoteRef: { key: cloudflare-edge, property: logpush_secret }
    - secretKey: ak
      remoteRef: { key: s3gw, property: ACCESS_KEY_ID }
    - secretKey: sk
      remoteRef: { key: s3gw, property: ACCESS_SECRET_KEY }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cf-logpush
  namespace: monitoring
data:
  server.ts: |
    import { createHash, createHmac, timingSafeEqual } from "node:crypto";

    const PATH = "/ingest/http_requests";
    const expected = Buffer.from(`Bearer ${process.env.LOGPUSH_SECRET}`);
    const lokiUrl = process.env.LOKI_URL ?? "http://loki.monitoring.svc.cluster.local:3100";
    // Any name under the *.unorouter.com wildcard reaches the edge, so only these become a label.
    const known = new Set((process.env.KNOWN_HOSTS ?? "").split(",").map((h) => h.trim()).filter(Boolean));
    const security = new Set((process.env.SECURITY_ACTIONS ?? "").split(",").map((h) => h.trim()).filter(Boolean));

    const endpoint = process.env.ARCHIVE_ENDPOINT!.replace(/\/$/, "");
    const s3host = new URL(endpoint).host;
    const hmac = (key: Buffer | string, msg: string) => createHmac("sha256", key).update(msg).digest();
    async function put(key: string, body: Uint8Array): Promise<Response> {
      const path = `/${process.env.ARCHIVE_BUCKET}/${key}`;
      const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
      const day = stamp.slice(0, 8);
      const digest = createHash("sha256").update(body).digest("hex");
      const headers: Record<string, string> = { host: s3host, "x-amz-content-sha256": digest, "x-amz-date": stamp };
      const names = Object.keys(headers).sort();
      const canonical = ["PUT", path, "", ...names.map((n) => `${n}:${headers[n]}`), "", names.join(";"), digest].join("\n");
      const scope = `${day}/auto/s3/aws4_request`;
      const toSign = ["AWS4-HMAC-SHA256", stamp, scope, createHash("sha256").update(canonical).digest("hex")].join("\n");
      let k: Buffer = hmac(`AWS4${process.env.ARCHIVE_SECRET_KEY}`, day);
      for (const part of ["auto", "s3", "aws4_request"]) k = hmac(k, part);
      const signature = createHmac("sha256", k).update(toSign).digest("hex");
      headers.Authorization = `AWS4-HMAC-SHA256 Credential=${process.env.ARCHIVE_ACCESS_KEY}/${scope}, SignedHeaders=${names.join(";")}, Signature=${signature}`;
      headers["content-type"] = "application/gzip";
      const { host: _h, ...send } = headers;
      return fetch(endpoint + path, { method: "PUT", headers: send, body, signal: AbortSignal.timeout(30e3) });
    }

    const m = { batches: 0, records: 0, bytes: 0, tests: 0, unauthorized: 0, archiveFailures: 0, lokiDropped: 0, last: 0 };

    function kind(r: any): string {
      if (security.has(r.SecurityAction)) return "security";
      return r.EdgeResponseStatus >= 400 ? "error" : "sample";
    }

    type Stream = { stream: Record<string, string>; values: [string, string][] };
    async function toLoki(lines: string[]) {
      const streams = new Map<string, Stream>();
      for (const line of lines) {
        let r: any;
        try { r = JSON.parse(line); } catch { continue; }
        const host = known.has(r.ClientRequestHost) ? r.ClientRequestHost : "other";
        const k = kind(r);
        const id = `${host}|${k}`;
        let s = streams.get(id);
        if (!s) streams.set(id, (s = { stream: { app: "cf-logpush", host, kind: k }, values: [] }));
        const t = Date.parse(r.EdgeStartTimestamp);
        s.values.push([String(BigInt(Number.isNaN(t) ? Date.now() : t) * 1000000n), line]);
      }
      // Under Loki's 3MB per stream limit per push even when one host carries the whole wave.
      const chunks: Stream[][] = [[]];
      let size = 0;
      for (const s of streams.values()) {
        for (let i = 0; i < s.values.length; ) {
          const part: Stream = { stream: s.stream, values: [] };
          while (i < s.values.length && size < 2e6) { part.values.push(s.values[i]); size += s.values[i][1].length + 40; i++; }
          chunks[chunks.length - 1].push(part);
          if (size >= 2e6) { chunks.push([]); size = 0; }
        }
      }
      for (const c of chunks) {
        const n = c.reduce((a, s) => a + s.values.length, 0);
        if (!n) continue;
        let ok = false;
        for (let attempt = 0; attempt < 4 && !ok; attempt++) {
          if (attempt) await Bun.sleep(1000 * 2 ** (attempt - 1));
          try {
            const r = await fetch(`${lokiUrl}/loki/api/v1/push`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ streams: c }),
              signal: AbortSignal.timeout(15e3),
            });
            ok = r.ok;
            if (!ok && r.status < 429) { console.log(JSON.stringify({ event: "loki_refused", status: r.status, body: (await r.text()).slice(0, 300) })); break; }
          } catch {}
        }
        if (!ok) m.lokiDropped += n;
      }
    }

    function metrics(): string {
      return [
        `cf_logpush_batches_total ${m.batches}`,
        `cf_logpush_records_total ${m.records}`,
        `cf_logpush_bytes_total ${m.bytes}`,
        `cf_logpush_test_batches_total ${m.tests}`,
        `cf_logpush_unauthorized_total ${m.unauthorized}`,
        `cf_logpush_archive_failures_total ${m.archiveFailures}`,
        `cf_logpush_loki_dropped_total ${m.lokiDropped}`,
        `cf_logpush_last_batch_timestamp_seconds ${m.last}`,
        "",
      ].join("\n");
    }

    Bun.serve({
      port: 8080,
      maxRequestBodySize: 256 * 1024 * 1024,
      async fetch(req) {
        const url = new URL(req.url);
        if (req.method === "GET" && url.pathname === "/healthz") return new Response("ok");
        if (req.method === "GET" && url.pathname === "/metrics") return new Response(metrics());
        if (req.method !== "POST" || url.pathname !== PATH) return new Response(null, { status: 404 });
        const auth = Buffer.from(req.headers.get("authorization") ?? "");
        if (auth.length !== expected.length || !timingSafeEqual(auth, expected)) {
          m.unauthorized++;
          return new Response(null, { status: 401 });
        }
        const body = new Uint8Array(await req.arrayBuffer());
        const gz = body[0] === 0x1f && body[1] === 0x8b ? body : Bun.gzipSync(body);
        const text = new TextDecoder().decode(gz === body ? Bun.gunzipSync(body) : body);
        const lines = text.split("\n").filter((l) => l.length > 0);
        // Logpush validates a new destination with one {"content":"tests"} line.
        if (lines.length === 1 && lines[0].includes('"content":"tests"')) {
          m.tests++;
          console.log(JSON.stringify({ event: "test_batch" }));
          return new Response("ok");
        }
        const now = new Date();
        const day = now.toISOString().slice(0, 10).replace(/-/g, "/");
        const hash = createHash("sha256").update(gz).digest("hex").slice(0, 24);
        const key = `logpush/http_requests/${day}/${now.toISOString().slice(11, 19).replace(/:/g, "")}-${hash}.ndjson.gz`;
        try {
          const r = await put(key, gz);
          if (!r.ok) throw new Error(`archive PUT ${r.status}`);
        } catch (e: any) {
          m.archiveFailures++;
          console.log(JSON.stringify({ event: "archive_failed", key, error: String(e?.message ?? e) }));
          return new Response(null, { status: 503 });
        }
        const dropped = m.lokiDropped;
        await toLoki(lines);
        m.batches++; m.records += lines.length; m.bytes += text.length; m.last = Math.floor(Date.now() / 1000);
        console.log(JSON.stringify({ event: "batch", records: lines.length, bytes: text.length, gzip: gz.length, key, lokiDropped: m.lokiDropped - dropped }));
        return new Response("ok");
      },
    });
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cf-logpush
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cf-logpush
  namespace: monitoring
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: cf-logpush }
  template:
    metadata:
      labels: { app: cf-logpush }
      # bun reads server.ts once at start: bump with every ConfigMap change so ArgoCD rolls the pod
      annotations: { config-rev: "1" }
    spec:
      serviceAccountName: cf-logpush
      automountServiceAccountToken: false
      securityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app: cf-logpush } }
      containers:
        - name: collector
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          command: [bun, /app/server.ts]
          envFrom:
            - secretRef: { name: cf-logpush }
          env:
            - name: KNOWN_HOSTS
              value: unorouter.com,www.unorouter.com,api.unorouter.com,bot.unorouter.com,mcp.unorouter.com,teleport.unorouter.com,dex.unorouter.com,cards.unorouter.com,status.unorouter.com,grafana.unorouter.com,argocd.unorouter.com,openbao.unorouter.com,openbao-ci.unorouter.com,import.unorouter.com,logpush.unorouter.com
            # The final actions the security job filters on (docs/monitoring.md), labelled kind=security.
            - name: SECURITY_ACTIONS
              value: block,challenge,jschallenge,managedChallenge,connectionClose,forceConnectionClose,log,challengeSolved,challengeFailed,jschallengeSolved,jschallengeFailed,managedChallengeNonInteractiveSolved,managedChallengeInteractiveSolved
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # A batch is at most 5 MB uncompressed (max_upload_bytes), held three times over while
          # it is split, archived and pushed.
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
      volumes:
        - name: app
          configMap: { name: cf-logpush }
---
apiVersion: v1
kind: Service
metadata:
  name: cf-logpush
  namespace: monitoring
spec:
  selector: { app: cf-logpush }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cf-logpush
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: { app: cf-logpush }
  ingress:
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: cloudflared, app: cloudflared-ops }
        - matchLabels: { app.kubernetes.io/name: prometheus }
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: loki }
      toPorts:
        - ports: [{ port: "3100", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: s3-gateway, app: s3-gateway }
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cf-logpush
  namespace: monitoring
  labels: { release: kps }
spec:
  selector:
    matchLabels: { app: cf-logpush }
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cf-logpush
  namespace: monitoring
  labels: { release: kps }
spec:
  groups:
    - name: cf-logpush
      rules:
        # The 1% sample job alone delivers a batch every few minutes on a quiet night.
        - alert: CfLogpushSilent
          expr: (time() - max(cf_logpush_last_batch_timestamp_seconds)) > 3600 and max(cf_logpush_last_batch_timestamp_seconds) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "No Cloudflare Logpush batch for an hour: the edge's blocked request record is not arriving"
        - alert: CfLogpushArchiveFailing
          expr: sum(increase(cf_logpush_archive_failures_total[15m])) > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "cf-logpush cannot write batches to the s3-gateway, Logpush is retrying"
        - alert: CfLogpushUnauthorized
          expr: sum(increase(cf_logpush_unauthorized_total[15m])) > 20
          labels: { severity: warning }
          annotations:
            summary: "cf-logpush refused over 20 requests without the Logpush secret in 15 minutes"
