# Custom CNPG metrics over the gateway's Postgres tables: top_ups, users, options and
# the PAT change archive.
#
# The security metrics over its logs and audit trail come from
# databases/clickhouse-security-exporter.yaml, because `logs` and `audit_logs` live in
# ClickHouse. They keep the `cnpg_` names, so never define one of them here as well:
# every series would exist twice and each `> 0` alert would page twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-newapi-security
  namespace: databases
  labels:
    cnpg.io/reload: "true"
data:
  queries: |
    newapi_pat_archive:
      query: |
        SELECT count(*)::float8 AS pending,
               coalesce(extract(epoch from now() - min(a.changed_at)), 0)::float8 AS oldest_seconds
        FROM public.pat_change_audit a
        LEFT JOIN public.pat_change_archive_ack ack ON ack.event_id = a.id
        WHERE ack.event_id IS NULL
      primary: true
      target_databases: [newapi]
      metrics:
        - pending:
            usage: GAUGE
            description: "Committed PAT changes awaiting archive acknowledgement"
        - oldest_seconds:
            usage: GAUGE
            description: "Age of the oldest unarchived PAT change"

    # 2026-08-31: $142 across 27 crypto top-ups sat uncredited for 10 days. The money
    # reached NowPayments, the balance never reached the user, and nothing alerted:
    # NowPayments has no merchant email for a received payment (webhook-only by design),
    # and a webhook it delivers successfully is "done" on their side even when our
    # handler declines to credit. Only we can see the gap, so only we can alarm on it.
    #
    # paid_amount is the discriminator: the webhook writes it only from what the
    # provider says it RECEIVED, so a row carrying one that is STILL pending means
    # money moved and quota did not.
    #
    # NOT provider_payment_id, which the first version used and which is wrong: it is
    # recorded on EVERY webhook including "waiting" (controller/topup_nowpayments.go,
    # deliberately, so a stalled order stays reconcilable). Every abandoned checkout
    # gets one when the payment page opens, so that version alerted on 27 orders /
    # $142 owed when the providers' own APIs said 19 of 20 NowPayments invoices had
    # actually_paid = 0, the twentieth was 2% of its invoice, and all 7 DeloPay ones
    # were requires_payment_method / requires_customer_action. Real figure: zero.
    #
    # charged_money is wrong for the same reason: set at order creation, so it is
    # intent, not evidence.
    newapi_topup_stuck:
      query: |
        SELECT count(*)::float8 AS count,
               coalesce(sum(money),0)::float8 AS usd,
               coalesce(max(extract(epoch from now())::bigint - create_time),0)::float8 AS oldest_seconds
        FROM top_ups
        WHERE status = 'pending'
          AND paid_amount > 0
          AND create_time < extract(epoch from now())::bigint - 1800
      primary: true
      target_databases:
        - newapi
      metrics:
        - count:
            usage: "GAUGE"
            description: "Top-ups pending >30m where the provider reported funds received: the customer paid and the balance never arrived."
        - usd:
            usage: "GAUGE"
            description: "Total USD sitting in stuck top-ups."
        - oldest_seconds:
            usage: "GAUGE"
            description: "Age of the oldest stuck top-up. The 2026-08 incident ran 10 days before a customer reported it."

    # Creem's merchant risk line is a 0.50% chargeback rate over 30 days (Risk page); the
    # card networks start at 0.9%. Counted the way Creem counts: card payments that
    # completed (success, refunded, disputed) against those that came back as disputes.
    newapi_creem_risk_30d:
      query: |
        SELECT count(*) FILTER (WHERE status = 'disputed')::float8 AS disputes,
               count(*)::float8 AS payments,
               count(*) FILTER (WHERE status = 'refunded')::float8 AS refunds
        FROM top_ups
        WHERE payment_method = 'creem'
          AND status IN ('success', 'refunded', 'disputed')
          AND create_time > extract(epoch from now())::bigint - 30*86400
      primary: true
      target_databases:
        - newapi
      metrics:
        - disputes:
            usage: "GAUGE"
            description: "Creem card payments of the last 30 days that ended as chargebacks."
        - payments:
            usage: "GAUGE"
            description: "Creem card payments completed in the last 30 days (paid, refunded or disputed)."
        - refunds:
            usage: "GAUGE"
            description: "Creem card payments of the last 30 days that ended as refunds."

    newapi_creem_topup_velocity:
      query: |
        SELECT count(*)::float8 AS flagged_users,
               coalesce(max(usd), 0)::float8 AS max_usd
        FROM (
          SELECT t.user_id, sum(t.money) AS usd
          FROM top_ups t
          JOIN users u ON u.id = t.user_id
          WHERE t.status = 'success'
            AND t.payment_provider IN ('creem', 'stripe')
            AND t.complete_time > extract(epoch from now())::bigint - 86400
          GROUP BY t.user_id, u.created_at
          HAVING count(*) > 2
              OR (sum(t.money) > 200 AND u.created_at > extract(epoch from now())::bigint - 7 * 86400)
        ) x
      primary: true
      target_databases:
        - newapi
      metrics:
        - flagged_users:
            usage: "GAUGE"
            description: "Accounts with more than two card top-ups in 24h, or over $200 in 24h while under a week old."
        - max_usd:
            usage: "GAUGE"
            description: "Largest 24h card total among flagged accounts."

    # Card testing is almost entirely PENDING rows (a checkout per card tried), which the
    # velocity metric above never sees: it counts settled top-ups. 2026-09-09: Creem flagged
    # 31 cards from one identity; our side showed 12 accounts with 5+ checkouts and no
    # success, bursts of 9 checkouts in 86 seconds. A paying customer fighting a broken
    # checkout looks the same for a few minutes (13 retries with varying amounts, then a
    # settled $3) and was disabled on this metric alone: an account with ANY earlier settled
    # top-up is excluded, and the bar is five, not three.
    newapi_card_testing:
      query: |
        SELECT
          (SELECT count(*)::float8 FROM (
             SELECT t.user_id
             FROM top_ups t
             WHERE t.payment_provider IN ('creem', 'stripe')
               AND t.create_time > extract(epoch from now())::bigint - 900
               AND NOT EXISTS (
                 SELECT 1 FROM top_ups p
                 WHERE p.user_id = t.user_id
                   AND p.status = 'success'
                   AND p.complete_time < extract(epoch from now())::bigint - 900)
             GROUP BY t.user_id
             HAVING count(*) >= 5
                AND sum(CASE WHEN t.status = 'success' THEN 1 ELSE 0 END) = 0) b) AS burst_users,
          (SELECT count(*)::float8 FROM top_ups
            WHERE payment_provider IN ('creem', 'stripe')
              AND create_time > extract(epoch from now())::bigint - 3600) AS checkouts_1h,
          (SELECT count(*)::float8 FROM top_ups
            WHERE payment_provider IN ('creem', 'stripe')
              AND status = 'success'
              AND complete_time > extract(epoch from now())::bigint - 3600) AS successes_1h
      primary: true
      target_databases:
        - newapi
      metrics:
        - burst_users:
            usage: "GAUGE"
            description: "Accounts with no earlier settled top-up, five or more card checkouts in 15 minutes and none successful."
        - checkouts_1h:
            usage: "GAUGE"
            description: "Card checkouts created in the last hour."
        - successes_1h:
            usage: "GAUGE"
            description: "Card checkouts settled in the last hour."

    # --- account-farm abuse -------------------------------------------------
    # 2026-09-06: a farm registered 12,293 accounts in a day and ran for five days
    # before anyone noticed, because nothing here measured registrations. Enforcement
    # already existed (service/network_reputation.go); only the alarm was missing.
    #
    # Identity means the same seven columns RegistrationProvenance.HasIdentity checks
    # (model/network_reputation.go:26). A typed email is deliberately NOT identity
    # while EmailVerificationEnabled is false: the farms all set one.
    #
    # These are unlabelled aggregates on purpose. A GROUP BY-labelled series emits
    # nothing while idle, so absent() cannot tell quiet from broken.
    newapi_registrations:
      query: |
        SELECT count(*)::float8 AS total_5m,
               count(*) FILTER (
                 WHERE coalesce(github_id,'') <> '' OR coalesce(discord_id,'') <> ''
                    OR coalesce(oidc_id,'') <> '' OR coalesce(telegram_id,'') <> ''
                    OR coalesce(linux_do_id,'') <> '' OR coalesce(wechat_id,'') <> ''
                    OR coalesce(google_id,'') <> '')::float8 AS with_identity_5m
        FROM users
        WHERE created_at > extract(epoch from now())::bigint - 300
      primary: true
      target_databases:
        - newapi
      metrics:
        - total_5m:
            usage: "GAUGE"
            description: "Accounts registered in the last 5 minutes."
        - with_identity_5m:
            usage: "GAUGE"
            description: "Of those, how many bound a third-party identity (github, discord, oidc, telegram, linuxdo, wechat, google)."

    # Mirrors refreshNetworkReputation (service/network_reputation.go:52) in SQL so the
    # verdict is observable. Thresholds are READ FROM THE OPTIONS TABLE, never hardcoded:
    # a copy would silently diverge the moment anyone changes the setting, and this is
    # the gauge you check before changing it. min_accounts = 0 means the feature is off
    # and every column reports zero, matching the early return in the Go.
    #
    # That read depends on an RLS ALLOWLIST. public.options carries the policy
    # metrics_exporter_catalog_maps, which names every key cnpg_metrics_exporter may
    # see; the three free_abuse_network keys were added to it for this query. A key
    # missing from that list is not an error, it returns NO ROW, so the coalesce below
    # yields 0 and the whole metric reports "feature off" while the feature is on. That
    # is exactly what happened on first deploy. min_accounts is exported as a fourth
    # gauge so the config the numbers were computed at is always visible and that
    # failure can never look like a clean zero again.
    #
    # users is readable here only through a 13-column grant to cnpg_metrics_exporter
    # (no password, access_token, email, setting or username). Adding a column to this
    # query means extending that grant too.
    #
    # Soft-deleted rows are included (no deleted_at filter) because the Go uses
    # Unscoped(): a register/delete/re-register cycle must not launder a network.
    # Rows whose register_ip will not parse are skipped, which is what net.ParseIP
    # does there via the empty registrationNetworkKey.
    #
    # paid_accounts is the FALSE-POSITIVE CANARY. Flagged networks are supposed to hold
    # nothing but disposable accounts; it was 0 across all 153 networks on 2026-09-10.
    # Above zero means a paying customer's network got caught and the threshold is wrong.
    newapi_farm_networks:
      query: |
        WITH cfg AS (
          SELECT coalesce((SELECT value::int FROM options
                            WHERE key = 'quota_setting.free_abuse_network_min_accounts'), 0) AS min_accounts,
                 coalesce((SELECT value::int FROM options
                            WHERE key = 'quota_setting.free_abuse_network_max_identity_pct'), 10) AS max_identity_pct,
                 coalesce((SELECT value::int FROM options
                            WHERE key = 'quota_setting.free_abuse_network_window_days'), 14) AS window_days
        ),
        prov AS (
          SELECT CASE WHEN u.register_ip LIKE '%:%'
                      THEN host(network(set_masklen(u.register_ip::inet, 48))) || '/48'
                      ELSE host(network(set_masklen(u.register_ip::inet, 24))) || '/24' END AS net,
                 (coalesce(u.github_id,'') <> '' OR coalesce(u.discord_id,'') <> ''
                   OR coalesce(u.oidc_id,'') <> '' OR coalesce(u.telegram_id,'') <> ''
                   OR coalesce(u.linux_do_id,'') <> '' OR coalesce(u.wechat_id,'') <> ''
                   OR coalesce(u.google_id,'') <> '') AS has_ident,
                 u.used_quota
          FROM users u, cfg
          WHERE cfg.min_accounts > 0
            AND u.role = 1
            AND u.created_at > extract(epoch from now())::bigint - cfg.window_days * 86400
            AND (u.register_ip ~ '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
              OR (u.register_ip ~ '^[0-9a-fA-F:]+$' AND u.register_ip LIKE '%:%'))
        ),
        nets AS (
          SELECT net, count(*) AS accts, count(*) FILTER (WHERE has_ident) AS idents
          FROM prov GROUP BY net
        ),
        flagged AS (
          SELECT n.net, n.accts
          FROM nets n, cfg
          WHERE n.accts >= cfg.min_accounts
            AND n.idents * 100 < n.accts * cfg.max_identity_pct
        )
        SELECT (SELECT count(*)::float8 FROM flagged) AS networks,
               (SELECT coalesce(sum(accts), 0)::float8 FROM flagged) AS accounts,
               (SELECT count(*)::float8 FROM prov p JOIN flagged f ON f.net = p.net
                 WHERE p.used_quota > 0) AS paid_accounts,
               (SELECT min_accounts::float8 FROM cfg) AS min_accounts
      primary: true
      target_databases:
        - newapi
      metrics:
        - networks:
            usage: "GAUGE"
            description: "Networks (IPv4 /24, IPv6 /48) currently flagged as account farms at the live setting."
        - accounts:
            usage: "GAUGE"
            description: "Accounts registered on those networks inside the reputation window."
        - paid_accounts:
            usage: "GAUGE"
            description: "Of those, how many ever spent quota. Expected a low floor (Tor exits); a climbing count means the threshold is too tight."
        - min_accounts:
            usage: "GAUGE"
            description: "The live free_abuse_network_min_accounts the three gauges above were computed at. Zero means the feature is off."
