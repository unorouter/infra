# etcd metrics. k3s binds :2381 to the node PRIVATE IP once --etcd-expose-metrics=true is on
# the server flags (set on all 3 nodes 2026-07-25). A ScrapeConfig with static targets is used
# rather than a Service/Endpoints pair: there is no selectable Service for a host process, and
# ArgoCD excludes the Endpoints kind by default so a hand-written one never syncs.
# UPDATE THE TARGET LIST WHEN A NODE IS SWAPPED.
#
# WHY THIS EXISTS: the 2026-07-24 incident was memory pressure -> etcd fsync stall -> lease
# renewal timeout -> NodeNotReady flaps -> pod evictions that looked like app crashes. 1000+
# slow-apply warnings in 2h were invisible. These metrics make that cascade alertable (group B).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: etcd
  namespace: monitoring
spec:
  jobName: etcd
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - 10.100.1.1:2381
        - 10.100.1.2:2381
        - 10.100.1.4:2381
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: instance
