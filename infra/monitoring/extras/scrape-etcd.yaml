# etcd metrics. k3s binds :2381 to the node PRIVATE IP (and localhost) once
# --etcd-expose-metrics=true is on the server flags -- set on all 3 nodes 2026-07-25.
# A hand-maintained Endpoints is used because there is no Service/selector for a
# host-process port; update the addresses when a node is swapped.
#
# WHY THIS EXISTS: the 2026-07-24 incident was memory pressure -> etcd fsync stall ->
# lease renewal timeout -> NodeNotReady flaps -> pod evictions that looked like app
# crashes. 1000+ slow-apply warnings in 2h were invisible. These metrics make that
# cascade alertable (see rules group B).
apiVersion: v1
kind: Service
metadata:
  name: etcd-metrics
  namespace: kube-system
  labels:
    app: etcd-metrics
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 2381
      targetPort: 2381
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: etcd-metrics
  namespace: kube-system
  labels:
    app: etcd-metrics
subsets:
  - addresses:
      - ip: 10.100.1.1
        nodeName: unorouter-node1
      - ip: 10.100.1.2
        nodeName: unorouter-node6
      - ip: 10.100.1.4
        nodeName: unorouter-node7
    ports:
      - name: metrics
        port: 2381
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: etcd
  namespace: monitoring
  labels:
    app: etcd-metrics
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      app: etcd-metrics
  endpoints:
    - port: metrics
      interval: 30s
      scheme: http
