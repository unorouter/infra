# Pulls the security-relevant part of netcup's journal off the box, so the record survives
# whatever happens to the box. netcup serves its journal read-only through
# systemd-journal-gatewayd on its tailnet address (100.114.228.25:19531); the Tailscale ACL
# lets node11..13 reach that port and nothing else, and netcup holds no credential for the
# cluster. The lines go to stdout, where Vector ships them to Loki and into the locked
# archive (pods_archive family "netcup"). docker-events and traefik-admin are systemd units
# on netcup that write Docker lifecycle events and the Portainer and Komodo access lines
# into the journal; komodo-updates (a timer) writes every Komodo action; auditd reports
# file watches on keys, sudoers, accounts and persistence paths as audisp-syslog, and every
# program a login session runs (key session_exec: Tailscale SSH has ssh-behavior-v2 in the
# tailnet policy, so each command runs through su -l, whose PAM stack sets the login uid;
# cron sets none).
# netcup's own journal keeps about two days.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netcup-journal
  namespace: monitoring
data:
  pull.py: |
    import json, os, re, time, urllib.request

    BASE = os.environ.get("GATEWAY", "http://100.114.228.25:19531") + "/entries"
    IDENTS = {"sshd", "sshd-session", "sudo", "su", "systemd-logind", "useradd", "usermod", "userdel",
              "groupadd", "passwd", "chpasswd", "chsh", "crontab", "docker-events", "traefik-admin",
              "komodo-updates", "audisp-syslog", "cluster-secret-scan"}
    TAILSCALED = re.compile(r"ssh-session|SSH|tka|Tailnet Lock|NeedsLogin|logout|authkey", re.I)

    def keep(e):
        ident = e.get("SYSLOG_IDENTIFIER", "")
        if ident in IDENTS:
            return True
        return e.get("_SYSTEMD_UNIT") == "tailscaled.service" and bool(TAILSCALED.search(str(e.get("MESSAGE", ""))))

    def text(v):
        # journald hands non-UTF-8 messages over as a byte array
        return bytes(v).decode("utf-8", "replace") if isinstance(v, list) else str(v)

    # auditd hex encodes any argument with a space or quote, so a token inside `bash -c "..."`
    # would pass the redaction below unseen: decode first, then redact (same patterns as the
    # Vector app family). Only EXECVE: SYSCALL a0..a3 are lowercase pointers. PROCTITLE is
    # dropped, it repeats EXECVE cut at 128 bytes, and a cut token is too short to match.
    HEXARG = re.compile(r"\b(a\d+(?:\[\d+\])?)=([0-9A-F]{2,})(?=\s|$)")
    SECRETS = [
        (re.compile(r"(?i)(bearer\s+)[A-Za-z0-9._~+/=-]{8,}"), r"\1*****"),
        (re.compile(r"(?i)((?:api[_-]?key|access[_-]?token|token|secret|password|passwd|authorization|key)\"?\s*[=:]\s*\"?)[^\s\"&,}]{6,}"), r"\1*****"),
        (re.compile(r"sk-[A-Za-z0-9_-]{16,}"), "sk-*****"),
        (re.compile(r"[A-Za-z0-9+/_-]{48,}={0,2}"), "*****"),
    ]

    def unhex(m):
        try:
            s = bytes.fromhex(m.group(2)).decode("utf-8", "replace").replace("\0", " ")
        except ValueError:
            return m.group(0)
        return m.group(1) + '="' + s.replace('"', "'") + '"'

    def redact(msg):
        for rx, sub in SECRETS:
            msg = rx.sub(sub, msg)
        return msg

    def audit_text(msg):
        if "type=PROCTITLE" in msg:
            return None
        # arguments are the only free text; other records keep their own key="..." field intact
        if "type=EXECVE" in msg:
            msg = redact(HEXARG.sub(unhex, msg))
        return msg

    cursor, last_beat, last_ts = None, 0.0, None
    while True:
        # a count ends the stream even with follow, so the backlog is one bounded read and the
        # follow always starts from a cursor
        url, rng = (BASE + "?follow", f"entries={cursor}") if cursor else (BASE, "entries=:-2000:2000")
        req = urllib.request.Request(url, headers={"Accept": "application/json", "Range": rng})
        try:
            with urllib.request.urlopen(req, timeout=120) as r:
                for raw in r:
                    raw = raw.strip()
                    if not raw:
                        continue
                    e = json.loads(raw)
                    if e.get("__CURSOR") == cursor:
                        continue
                    cursor = e.get("__CURSOR")
                    last_ts = e.get("__REALTIME_TIMESTAMP")
                    if keep(e):
                        msg = text(e.get("MESSAGE", ""))
                        if e.get("SYSLOG_IDENTIFIER") == "audisp-syslog":
                            msg = audit_text(msg)
                        elif e.get("_SYSTEMD_UNIT") == "tailscaled.service":
                            # tailscaled logs each SSH command line in full (--cmd=...)
                            msg = redact(msg)
                        if msg is not None:
                            print(json.dumps({"src": "netcup", "ts": int(last_ts or 0) // 1000,
                                            "ident": e.get("SYSLOG_IDENTIFIER"), "unit": e.get("_SYSTEMD_UNIT"),
                                            "pid": e.get("_PID"), "uid": e.get("_UID"), "comm": e.get("_COMM"),
                                            "msg": msg[:4000]}, separators=(",", ":")), flush=True)
                    if time.time() - last_beat > 60:
                        last_beat = time.time()
                        print(json.dumps({"src": "netcup-puller", "heartbeat": int(last_beat),
                                          "netcup_ts": int(last_ts or 0) // 1000}, separators=(",", ":")), flush=True)
        except Exception as ex:
            print(json.dumps({"src": "netcup-puller", "error": str(ex)[:300]}, separators=(",", ":")), flush=True)
            time.sleep(10)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcup-journal
  namespace: monitoring
  labels: { app: netcup-journal }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: netcup-journal }
  template:
    metadata:
      labels: { app: netcup-journal }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pull
          image: python:3.14-alpine@sha256:2e740b2c28a426e74f11396c05e38afb3191acced75045b8d62df573c1dc8ce8
          command: ["python3", "-u", "/app/pull.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes:
        - name: app
          configMap: { name: netcup-journal }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netcup-journal
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: { app: netcup-journal }
  egress:
    - toCIDR: [100.114.228.25/32]
      toPorts:
        - ports: [{ port: "19531", protocol: TCP }]
