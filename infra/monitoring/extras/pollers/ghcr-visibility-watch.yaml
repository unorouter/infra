# Every 15 minutes: list every container package of the GitHub org and try an ANONYMOUS
# pull token against ghcr.io for each. A package outside ALLOW_PUBLIC that answers an
# anonymous tags/list pages. The API visibility field is only the
# cross-check; the anonymous probe is what an outsider sees. Images must never be public
# while they carry anything from the build environment.
# GitHub makes a package of a public repo PUBLIC by default when Actions publishes it,
# so a new image workflow can reopen this without anyone touching settings. New packages
# are covered automatically: anything not in the allowlist that answers anonymously fires.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-visibility-watch
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-platform
    kind: ClusterSecretStore
  target:
    name: ghcr-visibility-watch
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: ghcr-pull, property: token }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcr-visibility-watch
  namespace: monitoring
data:
  watch.py: |
    import json, os, time, urllib.request, urllib.error
    import notify

    ORG = os.environ.get("GITHUB_ORG", "unorouter")
    ALLOW = set(x for x in os.environ.get("ALLOW_PUBLIC", "").split(",") if x)
    GH = os.environ["GITHUB_TOKEN"]
    UA = {"user-agent": "ghcr-visibility-watch/1"}

    def get(url, headers=None):
        req = urllib.request.Request(url, headers={**UA, **(headers or {})})
        # GitHub's API answers a stray 502/503 a few times a week; only a persistent one is news
        for attempt in range(4):
            try:
                with urllib.request.urlopen(req, timeout=30) as r:
                    return r.status, r.read().decode()
            except urllib.error.HTTPError as e:
                status = e.code
            except (urllib.error.URLError, TimeoutError):
                status = 0
            if status and status < 500:
                return status, ""
            if attempt < 3:
                time.sleep(15 * (attempt + 1))
        return status, ""

    status, body = get(f"https://api.github.com/orgs/{ORG}/packages?package_type=container&per_page=100",
                       {"authorization": "Bearer " + GH, "accept": "application/vnd.github+json"})
    if status != 200:
        cause = ("the GITHUB_TOKEN in secret/ghcr-pull may be dead" if status in (401, 403)
                 else "GitHub API still failing after 4 tries over 90s, not the token")
        notify.alert("PublicPackageExposed", f"ghcr visibility watch is BLIND: cannot list packages (HTTP {status}); {cause}")
        raise SystemExit(1)
    packages = json.loads(body)
    # The org listing silently omits packages the token's user only reaches through
    # repository-inherited access (unorouter-bot on 2026-09-07), so every name in
    # EXPECT_PACKAGES is fetched directly and merged in; a name the API cannot find at
    # all is reported too, so a renamed or deleted package does not fall out of view.
    seen = {p["name"] for p in packages}
    missing = []
    for name in [x for x in os.environ.get("EXPECT_PACKAGES", "").split(",") if x and x not in seen]:
        st, b = get(f"https://api.github.com/orgs/{ORG}/packages/container/{name}",
                    {"authorization": "Bearer " + GH, "accept": "application/vnd.github+json"})
        if st == 200:
            packages.append(json.loads(b))
        else:
            missing.append(f"{name} (HTTP {st})")

    findings = []
    for p in packages:
        name = p["name"]
        st, tok = get(f"https://ghcr.io/token?scope=repository:{ORG}/{name}:pull")
        anon = "?"
        if st == 200:
            t = json.loads(tok).get("token", "")
            st2, _ = get(f"https://ghcr.io/v2/{ORG}/{name}/tags/list", {"authorization": "Bearer " + t})
            anon = st2 == 200
        api_public = p.get("visibility") == "public"
        if (anon is True or api_public) and name not in ALLOW:
            findings.append(f"`{ORG}/{name}`: anonymous pull {'WORKS' if anon is True else 'blocked'}, API says {p.get('visibility')}, updated {p.get('updated_at', '')[:10]}")
        elif anon is False and api_public:
            findings.append(f"`{ORG}/{name}`: API says public but anonymous pull is blocked (inconsistent, check)")

    if missing:
        findings.append("expected packages the API cannot find: " + ", ".join(missing) + " (deleted or renamed? update EXPECT_PACKAGES)")
    if findings:
        notify.alert("PublicPackageExposed", "\n".join(["a container package that must be private is PUBLIC"] + findings
                     + ["Fix: github.com/orgs/" + ORG + "/packages/container/<name>/settings, Danger Zone, change visibility. Then rotate whatever the image carried."]))
    print(f"packages={len(packages)} allowed_public={sorted(ALLOW)} findings={len(findings)}", flush=True)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ghcr-visibility-watch
  namespace: monitoring
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: poller
          automountServiceAccountToken: false
          containers:
            - name: watch
              image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
              command: ["python3", "-u", "/app/watch.py"]
              env:
                - name: WATCH_NAME
                  value: ghcr-visibility-watch
                - name: PYTHONPATH
                  value: /app/lib
                - name: ALERTMANAGER_URL
                  value: http://kps-alertmanager.monitoring.svc:9093
                - name: GITHUB_ORG
                  value: unorouter
                # images proven secret-free by image-secret-scan (every layer, live values
                # included); private packages count against the org's 500 MB / 1 GB per
                # month GitHub Packages quota and pulls are BLOCKED once it is used up
                - name: ALLOW_PUBLIC
                  value: unorouter,unorouter-bot,new-api,new-api-sync,uno-import,uno-cards
                # every package that must exist; merged with the API listing, which drops
                # packages reachable only through repository-inherited access
                - name: EXPECT_PACKAGES
                  value: unorouter,unorouter-bot,new-api,new-api-sync,uno-cards,uno-import
              envFrom: [{ secretRef: { name: ghcr-visibility-watch } }]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts: [{ name: app, mountPath: /app }, { name: lib, mountPath: /app/lib }]
          volumes:
            - name: app
              configMap: { name: ghcr-visibility-watch }
            - name: lib
              configMap: { name: watch-lib }
