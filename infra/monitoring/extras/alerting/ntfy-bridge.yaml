# Alertmanager -> ntfy.sh (phone) and Discord bridge. Alertmanager has no native ntfy
# receiver, and its own Discord notifier hardcodes the embed colour (red firing, green
# resolved) with no severity option, so both go through this small node server: /alert
# reformats for ntfy, /discord builds an embed coloured by severity (red critical, orange
# warning, blue info, green resolved) with the summaries in a code block. The ntfy topic URL
# and the Discord webhook are the credentials -- OpenBao, never git.
#
# Why paging exists at all: the 2026-08-12 API outage started 06:00 UTC (15:00 KST, the
# biggest customer's afternoon peak) and Discord alerts sat unread until ~08:00. The
# cluster's whole night is Korea's business day; critical alerts must make the phone ring.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-bridge
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ntfy-bridge
    creationPolicy: Owner
  data:
    - secretKey: NTFY_URL
      remoteRef: { key: ntfy, property: topicUrl }
    - secretKey: DISCORD_WEBHOOK
      remoteRef: { key: alertmanager, property: discordWebhook }
    - secretKey: HEALTHCHECKS_URL
      remoteRef: { key: alertmanager, property: healthchecksPing }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-bridge
  namespace: monitoring
data:
  server.mjs: |
    import http from "node:http";

    const ntfyUrl = process.env.NTFY_URL;
    const discordUrl = process.env.DISCORD_WEBHOOK;
    const healthchecksUrl = process.env.HEALTHCHECKS_URL;

    // The dead-man switch runs through here (Alertmanager posts Watchdog to /heartbeat), so the
    // external ping proves Prometheus, Alertmanager, this bridge and ntfy at once. It is withheld
    // while ntfy is unreachable or the last page in the past 30 minutes failed to send, and any
    // active silence turns it into a fail ping: Watchdog keeps firing under a silence, so
    // without this one broad silence would mute every page behind a green heartbeat.
    const alertmanagerUrl = process.env.ALERTMANAGER_URL ?? "http://kps-alertmanager.monitoring.svc:9093";
    const ntfyState = { lastOk: 0, lastFail: 0 };
    async function heartbeat() {
      if (!healthchecksUrl) return { ok: false, why: "no HEALTHCHECKS_URL" };
      const now = Date.now();
      if (ntfyState.lastFail > ntfyState.lastOk && now - ntfyState.lastFail < 1800e3)
        return { ok: false, why: "last page failed to send" };
      const probe = await fetch(`${ntfyUrl}/json?poll=1&since=1s`, { signal: AbortSignal.timeout(10e3) });
      if (!probe.ok) return { ok: false, why: `ntfy answered ${probe.status}` };
      const sil = await fetch(`${alertmanagerUrl}/api/v2/silences`, { signal: AbortSignal.timeout(10e3) });
      if (!sil.ok) return { ok: false, why: `alertmanager silences answered ${sil.status}` };
      const active = (await sil.json()).filter((x) => x.status?.state === "active");
      if (active.length) {
        const text = active.map((x) => `${x.matchers.map((m) => `${m.name}${m.isEqual === false ? "!" : ""}${m.isRegex ? "=~" : "="}${m.value}`).join(",")} by ${x.createdBy} until ${x.endsAt}: ${x.comment}`).join("\n");
        await fetch(`${healthchecksUrl}/fail`, { method: "POST", body: `active silences:\n${text}`.slice(0, 9000), signal: AbortSignal.timeout(10e3) });
        return { ok: false, why: `${active.length} active silence(s)` };
      }
      const ping = await fetch(healthchecksUrl, { method: "POST", signal: AbortSignal.timeout(10e3) });
      return { ok: ping.ok, why: `healthchecks answered ${ping.status}` };
    }
    const lokiUrl = process.env.LOKI_URL ?? "http://loki.monitoring.svc.cluster.local:3100";

    const COLOR = { critical: 0xe74c3c, warning: 0xf39c12, info: 0x3498db, resolved: 0x2ecc71 };
    const EMOJI = { critical: "🔴", warning: "🟠", info: "🔵", resolved: "✅" };

    // Alertmanager re-sends a whole group every group_interval while members keep arriving,
    // so one busy digest group posts the same lines many times. Post each alert once per
    // status AND per path: a critical alert reaches /discord and /alert as two deliveries of
    // the same fingerprint, and a key without the path silenced every phone page.
    // Keys are marked only after a successful send: marking first turned Alertmanager's retry
    // of a failed page into a duplicate that was dropped with a 200.
    const seen = new Map();
    function fresh(p, path) {
      const now = Date.now();
      for (const [k, t] of seen) if (now - t > 3600e3) seen.delete(k);
      return (p.alerts ?? [])
        .map((a) => ({ a, k: `${path}:${a.fingerprint ?? a.labels?.alertname}:${a.status}` }))
        .filter((x) => !seen.has(x.k));
    }
    function mark(items) {
      const now = Date.now();
      for (const x of items) seen.set(x.k, now);
    }

    async function lokiLines(query, limit) {
      const params = new URLSearchParams({ query, limit: String(limit), direction: "backward", start: String((Date.now() - 12 * 3600e3) * 1e6) });
      try {
        const r = await fetch(`${lokiUrl}/loki/api/v1/query_range?${params}`, { signal: AbortSignal.timeout(5000) });
        if (!r.ok) return [];
        const j = await r.json();
        return (j.data?.result ?? []).flatMap((s) => s.values ?? []).sort((a, b) => (a[0] < b[0] ? 1 : -1)).map((v) => v[1]);
      } catch {
        return [];
      }
    }

    // "healed 94 entries kept at last value: a, b, c, ..." keeps three names and a count
    function shorten(line) {
      const text = line.replace(/\x1b\[[0-9;]*m/g, "").replace(/^\s*(ERROR|WARN|ℹ|✔)\s+/, "").trim();
      const at = text.lastIndexOf(": ");
      const names = at < 0 ? [] : text.slice(at + 2).split(", ");
      const kept = names.length > 4 ? `${text.slice(0, at + 2)}${names.slice(0, 3).join(", ")} (+${names.length - 3} more)` : text;
      return kept.slice(0, 220);
    }

    // A failed sync Job names only itself, and the why is in its own log: quote its newest
    // ERROR lines, or when a deadline killed it mid-run, the last thing it printed.
    async function syncJobDetail(job) {
      if (!/^[a-z0-9-]+$/.test(job)) return [];
      const pod = `{namespace="services", pod=~"${job}-.+"}`;
      let lines = (await lokiLines(`${pod} |= "ERROR "`, 40)).filter((l) => !l.includes("Completed with errors"));
      const out = [];
      if (lines.length === 0) {
        lines = await lokiLines(pod, 3);
        if (lines.length > 0) out.push("last lines before it stopped:");
      }
      for (const l of lines) {
        const s = shorten(l);
        if (s && !out.includes(s)) out.push(s);
        if (out.length === 5) break;
      }
      return out;
    }

    async function summaries(alerts) {
      const out = [];
      for (const a of alerts) {
        const s = a.annotations?.summary || a.labels?.alertname;
        if (s) out.push(s);
        if (a.status === "firing" && a.labels?.alertname === "NewApiSyncJobFailed" && a.labels?.job_name)
          for (const d of await syncJobDetail(a.labels.job_name)) out.push("  " + d);
      }
      return out;
    }

    async function describe(p, alerts, status) {
      const firing = status === "firing";
      const sev = firing ? (p.commonLabels?.severity ?? "info") : "resolved";
      const name = p.commonLabels?.alertname ?? "alert";
      const title = firing ? `${EMOJI[sev] ?? "🔵"} [${sev.toUpperCase()}] ${name}` : `${EMOJI.resolved} [RESOLVED] ${name}`;
      // HTTP header values are Latin-1: the emoji goes to Discord only, ntfy gets the tag
      const plain = firing ? `[${sev.toUpperCase()}] ${name}` : `[RESOLVED] ${name}`;
      return { firing, sev, name, title, plain, count: alerts.length, lines: await summaries(alerts) };
    }

    // A group stays "firing" while any member fires, so a member that just resolved rides in a
    // firing payload: split by each alert's own status or it posts under the warning title.
    function byStatus(alerts) {
      return ["firing", "resolved"]
        .map((status) => [status, alerts.filter((a) => (a.status ?? "firing") === status)])
        .filter(([, list]) => list.length > 0);
    }

    // ok only when every post succeeded, so a failed firing page is not hidden by a resolved one.
    async function toNtfy(p, alerts) {
      let failed = 0;
      for (const [status, list] of byStatus(alerts)) {
        const d = await describe(p, list, status);
        const r = await fetch(ntfyUrl, {
          method: "POST",
          headers: {
            Title: d.plain,
            // urgent = ntfy max priority: repeated alarm sound, overrides DND in the app
            Priority: d.firing ? "urgent" : "default",
            Tags: d.firing ? "rotating_light" : "white_check_mark",
          },
          body: d.lines.join("\n") || d.name,
        });
        if (!r.ok) failed = r.status;
      }
      if (failed) ntfyState.lastFail = Date.now(); else ntfyState.lastOk = Date.now();
      return { ok: failed === 0, status: failed || 200 };
    }

    async function toDiscord(p, alerts) {
      const labels = p.commonLabels ?? {};
      const footer = [labels.source, labels.node, labels.namespace].filter(Boolean).join(" · ");
      const embeds = [];
      for (const [status, list] of byStatus(alerts)) {
        const d = await describe(p, list, status);
        const body = d.lines.join("\n").slice(0, 3800);
        embeds.push({
          title: d.title.slice(0, 256),
          description: body ? "```\n" + body + "\n```" : undefined,
          color: COLOR[d.sev] ?? COLOR.info,
          footer: footer ? { text: footer + (d.count > 1 ? ` · ${d.count} alerts` : "") } : undefined,
          timestamp: new Date().toISOString(),
        });
      }
      return fetch(discordUrl, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ embeds, allowed_mentions: { parse: [] } }),
      });
    }

    http.createServer((req, res) => {
      if (req.method !== "POST") { res.writeHead(200); res.end("ok"); return; }
      let body = "";
      req.on("data", (c) => {
        body += c;
        if (body.length > 4e6) req.destroy();
      });
      req.on("end", async () => {
        let p;
        try {
          p = JSON.parse(body);
        } catch (e) {
          console.log("bad request: " + (e?.message ?? e));
          res.writeHead(400);
          res.end();
          return;
        }
        if (req.url.startsWith("/heartbeat")) {
          try {
            const h = await heartbeat();
            if (!h.ok) console.log(`heartbeat withheld: ${h.why}`);
            res.writeHead(h.ok ? 200 : 503);
          } catch (e) {
            console.log(`heartbeat withheld: ${e?.message ?? e}`);
            res.writeHead(503);
          }
          res.end();
          return;
        }
        const discord = req.url.startsWith("/discord");
        const sink = discord ? "discord" : "ntfy";
        try {
          if (discord && !discordUrl) { res.writeHead(500); res.end("no DISCORD_WEBHOOK"); return; }
          const items = fresh(p, discord ? "discord" : "alert");
          if (items.length === 0) { res.writeHead(200); res.end(); return; }
          const alerts = items.map((x) => x.a);
          const r = await (discord ? toDiscord(p, alerts) : toNtfy(p, alerts));
          if (r.ok) mark(items);
          // the one line of logging: which sink, which alert, and what it answered
          console.log(`${sink} ${p.status} ${p.commonLabels?.severity ?? "-"} ${p.commonLabels?.alertname ?? "-"} -> ${r.status}`);
          res.writeHead(r.ok ? 200 : 502);
          res.end();
        } catch (e) {
          // a network error is retryable: 5xx makes Alertmanager send again, 4xx would not
          console.log(`${sink} ${p.status} ${p.commonLabels?.alertname ?? "-"} -> send failed: ${e?.message ?? e}`);
          res.writeHead(502);
          res.end();
        }
      });
    }).listen(8080);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-bridge
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: ntfy-bridge }
  template:
    metadata:
      labels: { app: ntfy-bridge }
      # node reads server.mjs once at start: bump with every ConfigMap change so ArgoCD rolls the pod
      annotations: { config-rev: "4" }
    spec:
      containers:
        - name: bridge
          image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          command: [node, /app/server.mjs]
          envFrom:
            - secretRef: { name: ntfy-bridge }
          # node's baseline RSS alone is ~50-60Mi; 64Mi sat >90% and paged on day one
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 160Mi }
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: app
          configMap: { name: ntfy-bridge }
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-bridge
  namespace: monitoring
spec:
  selector: { app: ntfy-bridge }
  ports:
    - port: 8080
      targetPort: 8080
