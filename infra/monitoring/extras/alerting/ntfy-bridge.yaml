# Alertmanager -> ntfy.sh (phone) and Discord bridge. Alertmanager has no native ntfy
# receiver, and its own Discord notifier hardcodes the embed colour (red firing, green
# resolved) with no severity option, so both go through this small node server: /alert
# reformats for ntfy, /discord builds an embed coloured by severity (red critical, orange
# warning, blue info, green resolved) with the summaries in a code block. The ntfy topic URL
# and the Discord webhook are the credentials -- OpenBao, never git.
#
# Why paging exists at all: the 2026-08-12 API outage started 06:00 UTC (15:00 KST, the
# biggest customer's afternoon peak) and Discord alerts sat unread until ~08:00. The
# cluster's whole night is Korea's business day; critical alerts must make the phone ring.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-bridge
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ntfy-bridge
    creationPolicy: Owner
  data:
    - secretKey: NTFY_URL
      remoteRef: { key: ntfy, property: topicUrl }
    - secretKey: DISCORD_WEBHOOK
      remoteRef: { key: alertmanager, property: discordWebhook }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-bridge
  namespace: monitoring
data:
  server.mjs: |
    import http from "node:http";

    const ntfyUrl = process.env.NTFY_URL;
    const discordUrl = process.env.DISCORD_WEBHOOK;

    const COLOR = { critical: 0xe74c3c, warning: 0xf39c12, info: 0x3498db, resolved: 0x2ecc71 };
    const EMOJI = { critical: "🔴", warning: "🟠", info: "🔵", resolved: "✅" };

    // Alertmanager re-sends a whole group every group_interval while members keep arriving,
    // so one busy digest group posts the same lines many times. Post each alert once per
    // status AND per path: a critical alert reaches /discord and /alert as two deliveries of
    // the same fingerprint, and a key without the path silenced every phone page.
    const seen = new Map();
    function fresh(p, path) {
      const now = Date.now();
      for (const [k, t] of seen) if (now - t > 3600e3) seen.delete(k);
      return (p.alerts ?? []).filter((a) => {
        const k = `${path}:${a.fingerprint ?? a.labels?.alertname}:${a.status}`;
        if (seen.has(k)) return false;
        seen.set(k, now);
        return true;
      });
    }

    function summaries(alerts) {
      return alerts.map((a) => a.annotations?.summary || a.labels?.alertname).filter(Boolean);
    }

    function describe(p, alerts) {
      const firing = p.status === "firing";
      const sev = firing ? (p.commonLabels?.severity ?? "info") : "resolved";
      const name = p.commonLabels?.alertname ?? "alert";
      const title = firing ? `${EMOJI[sev] ?? "🔵"} [${sev.toUpperCase()}] ${name}` : `${EMOJI.resolved} [RESOLVED] ${name}`;
      // HTTP header values are Latin-1: the emoji goes to Discord only, ntfy gets the tag
      const plain = firing ? `[${sev.toUpperCase()}] ${name}` : `[RESOLVED] ${name}`;
      return { firing, sev, name, title, plain, lines: summaries(alerts) };
    }

    async function toNtfy(p, alerts) {
      const d = describe(p, alerts);
      return fetch(ntfyUrl, {
        method: "POST",
        headers: {
          Title: d.plain,
          // urgent = ntfy max priority: repeated alarm sound, overrides DND in the app
          Priority: d.firing ? "urgent" : "default",
          Tags: d.firing ? "rotating_light" : "white_check_mark",
        },
        body: d.lines.join("\n") || d.name,
      });
    }

    async function toDiscord(p, alerts) {
      const d = describe(p, alerts);
      const labels = p.commonLabels ?? {};
      const footer = [labels.source, labels.node, labels.namespace].filter(Boolean).join(" · ");
      const body = d.lines.join("\n").slice(0, 3800);
      const embed = {
        title: d.title.slice(0, 256),
        description: body ? "```\n" + body + "\n```" : undefined,
        color: COLOR[d.sev] ?? COLOR.info,
        footer: footer ? { text: footer + (d.lines.length > 1 ? ` · ${d.lines.length} alerts` : "") } : undefined,
        timestamp: new Date().toISOString(),
      };
      return fetch(discordUrl, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ embeds: [embed], allowed_mentions: { parse: [] } }),
      });
    }

    http.createServer((req, res) => {
      if (req.method !== "POST") { res.writeHead(200); res.end("ok"); return; }
      let body = "";
      req.on("data", (c) => (body += c));
      req.on("end", async () => {
        try {
          const p = JSON.parse(body);
          const discord = req.url.startsWith("/discord");
          if (discord && !discordUrl) { res.writeHead(500); res.end("no DISCORD_WEBHOOK"); return; }
          const alerts = fresh(p, discord ? "discord" : "alert");
          if (alerts.length === 0) { res.writeHead(200); res.end(); return; }
          const r = await (discord ? toDiscord(p, alerts) : toNtfy(p, alerts));
          // the one line of logging: which sink, which alert, and what it answered
          console.log(`${discord ? "discord" : "ntfy"} ${p.status} ${p.commonLabels?.severity ?? "-"} ${p.commonLabels?.alertname ?? "-"} -> ${r.status}`);
          res.writeHead(r.ok ? 200 : 502);
          res.end();
        } catch (e) {
          console.log("bad request: " + (e?.message ?? e));
          res.writeHead(400);
          res.end();
        }
      });
    }).listen(8080);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-bridge
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: ntfy-bridge }
  template:
    metadata:
      labels: { app: ntfy-bridge }
    spec:
      containers:
        - name: bridge
          image: node:22-alpine
          command: [node, /app/server.mjs]
          envFrom:
            - secretRef: { name: ntfy-bridge }
          # node's baseline RSS alone is ~50-60Mi; 64Mi sat >90% and paged on day one
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 160Mi }
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: app
          configMap: { name: ntfy-bridge }
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-bridge
  namespace: monitoring
spec:
  selector: { app: ntfy-bridge }
  ports:
    - port: 8080
      targetPort: 8080
