# Bot cluster detection by TLS fingerprint. Every minute it reads the edge fingerprint lines the
# gateway (`| fp `), the site (`[fp]`) and the site's admission gate (`[fp-shed]`, sampled, each
# line weighted by its `w`) write to Loki, keeps a 10 minute window grouped by (ciphers hash,
# extensions hash, hello length, HTTP version, user agent family), and flags a group no logged in
# request ever carried once it passes one tier: strong (one ciphers and extensions pair on two
# addresses AND a hello too short for the claimed browser), fixed (that pair on FP_FIXED_IPS
# addresses: real Chrome permutes its extensions per connection), short (Chrome 131+ or Firefox
# 132+ hello under 1000 bytes), or base (any of those at FP_MIN_REQUESTS from FP_MIN_IPS). Until
# the 7 day baseline of logged in fingerprints is full, one of those signals is required.
# Thresholds come from `scripts/fp-replay.py` over the 2026-11-04 and 2026-11-05 waves.
#
# Archive (docs/monitoring.md): every run as JSONL in s3-gateway `unorouter-sync/fp-autoban/runs/`,
# and the raw lines of every wave window in `fp-autoban/waves/`, addresses replaced by a keyed hash
# whose key never leaves memory.
#
# DRY RUN by default: candidates go to Discord through Alertmanager with the Cloudflare expression
# it would add, and nothing calls Cloudflare. FP_LIVE=1 edits exactly one custom rule, found by
# description prefix "autoban:fp" (created disabled on first use, after the logged in skip), never
# the ruleset as a whole, so edge-mode and apply.sh keep their rules. Going live also needs the zone
# token in the fp-autoban ExternalSecret (cloudflare-edge token and zone_id) and world 443 egress in
# fp-autoban-egress. Kill switch: FP_KILL=1, or `kill: "1"` in ConfigMap fp-autoban-state, which
# disables the rule on the next run without a rollout.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fp-autoban
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-platform
    kind: ClusterSecretStore
  target:
    name: fp-autoban
    creationPolicy: Owner
  data:
    - secretKey: OWN_SOURCES
      remoteRef: { key: cloudflare-edge, property: own_sources }
    - secretKey: ARCHIVE_ACCESS_KEY
      remoteRef: { key: s3gw, property: ACCESS_KEY_ID }
    - secretKey: ARCHIVE_SECRET_KEY
      remoteRef: { key: s3gw, property: ACCESS_SECRET_KEY }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fp-autoban
  namespace: monitoring
---
# create cannot be scoped to a name; get and patch are, to the one state ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fp-autoban
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [fp-autoban-state]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fp-autoban
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fp-autoban
subjects:
  - kind: ServiceAccount
    name: fp-autoban
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fp-autoban
  namespace: monitoring
data:
  autoban.py: |
    import gzip, hashlib, hmac, json, os, re, secrets, signal, ssl, sys, time, urllib.error, urllib.parse, urllib.request
    from collections import Counter, defaultdict
    import notify

    LOKI = os.environ.get("LOKI_URL", "http://loki.monitoring.svc.cluster.local:3100")
    SOURCES = {"api": '{namespace="services",app="new-api"} |= " | fp "',
               "site": r'{namespace="services",app="unorouter"} |~ `\[fp(-shed)?\] `'}
    WINDOW = int(os.environ.get("FP_WINDOW_MINUTES", "10"))
    LAG = int(os.environ.get("FP_LAG_SECONDS", "30"))
    MAX_PAGES = int(os.environ.get("FP_MAX_PAGES", "10"))
    MIN_REQ = int(os.environ.get("FP_MIN_REQUESTS", "120"))
    MIN_IPS = int(os.environ.get("FP_MIN_IPS", "5"))
    # Chrome permutes its extensions on every connection, so one ciphers and extensions pair on this
    # many addresses is one fixed TLS stack wearing a Chrome user agent.
    FIXED_IPS = int(os.environ.get("FP_FIXED_IPS", "5"))
    FIXED_MIN_REQ = int(os.environ.get("FP_FIXED_MIN_REQUESTS", "40"))
    STRONG_MIN_REQ = int(os.environ.get("FP_STRONG_MIN_REQUESTS", "30"))
    SHORT_MIN_REQ = int(os.environ.get("FP_SHORT_MIN_REQUESTS", "60"))
    SHORT_MIN_IPS = int(os.environ.get("FP_SHORT_MIN_IPS", "3"))
    WAVE_ANON_PER_MINUTE = int(os.environ.get("FP_WAVE_ANON_PER_MINUTE", "300"))
    WAVE_SHED_PER_MINUTE = int(os.environ.get("FP_WAVE_SHED_PER_MINUTE", "200"))
    ARCHIVE = os.environ.get("ARCHIVE_ENDPOINT", "").rstrip("/")
    ARCHIVE_BUCKET = os.environ.get("ARCHIVE_BUCKET", "")
    ARCHIVE_PREFIX = os.environ.get("ARCHIVE_PREFIX", "fp-autoban")
    ARCHIVE_FLUSH_RUNS = int(os.environ.get("FP_ARCHIVE_FLUSH_RUNS", "10"))
    THRESHOLDS = {k: v for k, v in globals().items() if k in ("WINDOW", "MIN_REQ", "MIN_IPS", "FIXED_IPS", "FIXED_MIN_REQ",
                  "STRONG_MIN_REQ", "SHORT_MIN_REQ", "SHORT_MIN_IPS", "WAVE_ANON_PER_MINUTE", "WAVE_SHED_PER_MINUTE")}
    POSTS_PER_HOUR = int(os.environ.get("FP_POSTS_PER_HOUR", "3"))
    REPOST_HOURS = int(os.environ.get("FP_REPOST_HOURS", "12"))
    BASELINE_DAYS = 7
    BASELINE_MAX = 15000
    OWN = [x.strip() for x in os.environ.get("OWN_SOURCES", "").split(",") if x.strip()]
    STATE_FILE = os.environ.get("FP_STATE_FILE", "")
    STATE_CM = "fp-autoban-state"
    NS = "monitoring"

    LIVE = os.environ.get("FP_LIVE", "") == "1"
    PREFIX = "autoban:fp"
    MAX_ENTRIES = int(os.environ.get("FP_MAX_ENTRIES", "8"))
    MAX_NEW_PER_HOUR = int(os.environ.get("FP_MAX_NEW_PER_HOUR", "2"))
    CHALLENGE_TTL = int(os.environ.get("FP_CHALLENGE_TTL_HOURS", "6")) * 3600
    BLOCK_TTL = int(os.environ.get("FP_BLOCK_TTL_HOURS", "24")) * 3600
    # a fingerprint still reaching origin this long after its challenge went in is getting through it
    PROMOTE_AFTER = 900
    PLACEHOLDER = '(http.host eq "autoban.invalid")'
    SESSION_SKIP = "logged-in browsers"

    API_LINE = re.compile(r'\| (\d{3}) \|[^|]*\|\s*(\S+) \|\s*(\S+) (\S*) \| fp c=(\S*) l=(\d*) e=(\S*) h=(\S*) asn=(\d*) u=(\d+) ua=(".*")\s*$')
    SITE_LINE = re.compile(r'\[fp\] (\d{3}) (\S+) c=(\S*) l=(\d*) e=(\S*) h=(\S*) asn=(\d*)(?: ip=(\S*))? ua=(".*")\s*$')
    SHED_LINE = re.compile(r'\[fp-shed\] (\d{3}) (\S+) w=(\d+) c=(\S*) l=(\d*) e=(\S*) h=(\S*) asn=(\d*) ip=(\S*) ua=(".*")\s*$')
    CRAWLER = re.compile(r"bot\b|crawl|spider|slurp|Googlebot|bingbot|facebookexternalhit|Discordbot|Twitterbot|compatible;", re.I)
    CHROME_V = re.compile(r"Chrome/(\d+)")
    FIREFOX_V = re.compile(r"Firefox/(\d+)")

    def log(**kv): print(json.dumps({"kind": "fp-autoban", **kv}, separators=(",", ":")), flush=True)

    # the replay tool sets this to the minute it is scoring
    def clock(): return time.time()

    def family(ua):
        if not ua: return "empty"
        if CRAWLER.search(ua): return "crawler"
        if "Chrome/" in ua: return "chrome"
        if "Firefox/" in ua: return "firefox"
        if "Safari/" in ua and "Mozilla/" in ua: return "safari"
        low = ua.lower()
        for name in ("python", "node", "go-http", "curl", "okhttp", "java", "axios", "undici", "openai", "aiohttp", "httpx"):
            if name in low: return name
        return "other"

    # Expression clause for the user agent part; browser families by token, anything else by its exact top value.
    def ua_clause(fam, top_ua):
        if fam == "chrome": return 'http.user_agent contains "Chrome/"'
        if fam == "firefox": return 'http.user_agent contains "Firefox/"'
        if fam == "safari": return 'http.user_agent contains "Safari/" and not http.user_agent contains "Chrome/"'
        if fam == "empty": return 'http.user_agent eq ""'
        return "http.user_agent eq " + json.dumps(top_ua[:200])

    def ua_matches(fam, clause_fam):
        if clause_fam == "chrome": return fam in ("chrome", "crawler")
        return fam == clause_fam

    def own(ip):
        return any(ip == o or (o.endswith("::") and ip.startswith(o[:-1])) for o in OWN)

    def unquote(s):
        try: return json.loads(s)
        except ValueError: return s.strip('"')

    def fpkey(c, l, e): return hashlib.sha1(f"{c}|{l}|{e}".encode()).hexdigest()[:12]

    class Agg:
        __slots__ = ("n", "authed", "shed", "lines", "ips", "paths", "asn", "ua", "src", "minutes", "bl")
        def __init__(self):
            self.n = 0; self.authed = 0; self.shed = 0; self.lines = 0; self.ips = Counter(); self.paths = set()
            self.asn = Counter(); self.ua = Counter(); self.src = Counter(); self.minutes = set(); self.bl = False
        def merge(self, o):
            self.n += o.n; self.authed += o.authed; self.shed += o.shed; self.lines += o.lines; self.bl = self.bl or o.bl
            self.ips.update(o.ips); self.asn.update(o.asn); self.src.update(o.src)
            self.minutes |= o.minutes
            if len(self.paths) < 500: self.paths |= o.paths
            for k, v in o.ua.items():
                if k in self.ua or len(self.ua) < 20: self.ua[k] += v

    def loki_lines(query, start, end):
        out, cursor = [], start
        for _ in range(MAX_PAGES):
            q = urllib.parse.urlencode({"query": query, "start": cursor, "end": end, "limit": 5000, "direction": "forward"})
            with urllib.request.urlopen(LOKI + "/loki/api/v1/query_range?" + q, timeout=60) as r:
                d = json.load(r)
            got = [(int(ts), line) for s in d["data"]["result"] for ts, line in s["values"]]
            out += got
            if len(got) < 5000: return out, False
            cursor = max(ts for ts, _ in got) + 1
        return out, True

    def parse(src, line):
        if src == "api":
            m = API_LINE.search(line)
            if not m: return None
            status, ip, method, path, c, l, e, h, asn, u, ua = m.groups()
            return path, c, l, e, h, asn, ip, int(u), ua, 1, False
        m = SHED_LINE.search(line)
        if m:
            status, path, w, c, l, e, h, asn, ip, ua = m.groups()
            return path, c, l, e, h, asn, ip, 0, ua, max(1, int(w)), True
        m = SITE_LINE.search(line)
        if not m: return None
        status, path, c, l, e, h, asn, ip, ua = m.groups()
        return path, c, l, e, h, asn, ip or "", 0, ua, 1, False

    # lines are (ts_ns, src, line); a shed line stands for w requests, so it counts w times everywhere
    def minute_from_lines(t_end, lines, truncated=()):
        groups, pending_authed, parsed, skipped, raw = defaultdict(Agg), defaultdict(set), 0, 0, []
        for ts, src, line in lines:
            p = parse(src, line)
            if not p: skipped += 1; continue
            path, c, l, e, h, asn, ip, u, ua, w, shed = p
            # Workers subrequests arrive with no handshake to fingerprint
            if not c or l in ("", "0") or own(ip): continue
            parsed += 1
            raw.append((ts, src, line))
            # site lines before 2026-11-05 carry no address; a distinct ASN is at least a distinct address
            ip = ip or "asn:" + asn
            ua = unquote(ua)
            fam = family(ua)
            g = groups[(c, int(l), e, h, fam)]
            g.n += w; g.lines += 1; g.ips[ip] += w; g.asn[asn] += w; g.src[src] += w; g.minutes.add(t_end)
            if shed: g.shed += w
            if len(g.paths) < 500: g.paths.add(path.split("?", 1)[0][:80])
            if ua in g.ua or len(g.ua) < 20: g.ua[ua[:200]] += w
            if u:
                g.authed += 1
                pending_authed[fpkey(c, l, e)].add(ip)
        return {"t": t_end, "groups": groups, "authed": pending_authed, "truncated": list(truncated), "parsed": parsed,
                "skipped": skipped, "raw": raw}

    def bucket_minute(t_end):
        start, end, lines, truncated = (t_end - 60) * 10**9, t_end * 10**9, [], []
        for src, query in SOURCES.items():
            got, cut = loki_lines(query, start, end)
            if cut: truncated.append(src)
            lines += [(ts, src, line) for ts, line in got]
        return minute_from_lines(t_end, lines, truncated)

    def k8s(method, path, body=None, ctype="application/json"):
        host = os.environ["KUBERNETES_SERVICE_HOST"]; port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
        sa = "/var/run/secrets/kubernetes.io/serviceaccount/"
        ctx = ssl.create_default_context(cafile=sa + "ca.crt")
        req = urllib.request.Request(f"https://{host}:{port}{path}", method=method,
                                     data=json.dumps(body).encode() if body is not None else None,
                                     # Python's default user agent trips the K8sScriptingClient tripwire; a stock client on this token still does.
                                     headers={"Authorization": "Bearer " + open(sa + "token").read().strip(), "Content-Type": ctype,
                                              "User-Agent": "fp-autoban/1"})
        with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
            return json.load(r)

    def load_state():
        data = {}
        if STATE_FILE:
            try: data = json.load(open(STATE_FILE))
            except (OSError, ValueError): pass
        else:
            try: data = k8s("GET", f"/api/v1/namespaces/{NS}/configmaps/{STATE_CM}").get("data") or {}
            except urllib.error.HTTPError as e:
                if e.code != 404: raise
                k8s("POST", f"/api/v1/namespaces/{NS}/configmaps", {"metadata": {"name": STATE_CM, "namespace": NS}, "data": {}})
        st = {"baseline": {"since": time.time(), "k": {}}, "posted": {}, "post_times": [], "adds": [], "kill": "0"}
        for k in ("baseline", "posted", "post_times", "adds"):
            if k in data:
                try: st[k] = json.loads(data[k])
                except ValueError: pass
        st["kill"] = data.get("kill", "0")
        return st

    def save_state(st):
        bl = st["baseline"]["k"]
        if len(bl) > BASELINE_MAX:
            for k, _ in sorted(bl.items(), key=lambda kv: kv[1])[:len(bl) - BASELINE_MAX]: del bl[k]
        data = {k: json.dumps(st[k], separators=(",", ":")) for k in ("baseline", "posted", "post_times", "adds")}
        if STATE_FILE:
            json.dump({**data, "kill": st["kill"]}, open(STATE_FILE, "w")); return
        # kill is left out so a hand set value survives
        k8s("PATCH", f"/api/v1/namespaces/{NS}/configmaps/{STATE_CM}", {"data": data}, "application/merge-patch+json")

    def kill_set(st):
        if os.environ.get("FP_KILL", "") == "1": return True
        if STATE_FILE: return st["kill"] == "1"
        try: return (k8s("GET", f"/api/v1/namespaces/{NS}/configmaps/{STATE_CM}").get("data") or {}).get("kill") == "1"
        except Exception: return True

    def learn_baseline(st, minute):
        bl, day = st["baseline"]["k"], int(clock() // 86400)
        # Browsers get a fresh extensions hash on most connections (Chrome on every one, HTTP/3
        # included), about 800 keys per 10 minutes that no bot can share, so a browser key is kept
        # only once two addresses showed it; a single address is covered by the window itself.
        for (c, l, e, h, fam), g in minute["groups"].items():
            if not g.authed: continue
            k = fpkey(c, l, e)
            if k in bl or fam not in ("chrome", "firefox", "safari") or len(minute["authed"].get(k, ())) >= 2:
                bl[k] = day
        for k in [k for k, d in bl.items() if d < day - BASELINE_DAYS]: del bl[k]

    # fixed: one ciphers and extensions pair on several addresses; short: a hello too small for the claimed browser
    def signals(c, l, e, h, fam, g):
        ua = g.ua.most_common(1)[0][0] if g.ua else ""
        out, ips = {}, len(g.ips)
        if fam == "chrome":
            m = CHROME_V.search(ua); v = int(m.group(1)) if m else 0
            if l < 512: out["short"] = f"Chrome user agent with a {l} byte hello (Chrome pads every hello to at least 512)"
            elif v >= 131 and l < 1000: out["short"] = f"Chrome/{v} user agent with a {l} byte hello (Chrome 131+ sends ML-KEM, about 1700+)"
            if v >= 110 and h in ("HTTP/1.1", "HTTP/2") and ips >= 2:
                out["fixed"] = f"Chrome/{v} user agent with one ciphers and extensions pair on {ips} addresses over {h} (Chrome 110+ permutes per connection)"
        if fam == "firefox":
            m = FIREFOX_V.search(ua); v = int(m.group(1)) if m else 0
            if v >= 132 and l < 1000: out["short"] = f"Firefox/{v} user agent with a {l} byte hello (Firefox 132+ sends ML-KEM)"
        return out

    def tier(g, sig):
        n, ips = g.n, len(g.ips)
        if "fixed" in sig and "short" in sig and n >= STRONG_MIN_REQ: return "strong"
        if "fixed" in sig and ips >= FIXED_IPS and n >= FIXED_MIN_REQ: return "fixed"
        if "short" in sig and ips >= SHORT_MIN_IPS and n >= SHORT_MIN_REQ: return "short"
        if sig and n >= MIN_REQ and ips >= MIN_IPS: return "base"
        return ""

    def expression(c, l, e, h, fam, g):
        parts = [f'cf.tls_client_ciphers_sha1 eq "{c}"', f'cf.tls_client_extensions_sha1 eq "{e}"',
                 f"cf.tls_client_hello_length eq {l}", f'http.request.version eq "{h}"',
                 ua_clause(fam, g.ua.most_common(1)[0][0] if g.ua else ""), "not cf.client.bot"]
        top = [a for a, _ in g.asn.most_common(3) if a]
        if top and sum(g.asn[a] for a in top) >= 0.9 * g.n:
            parts.append("ip.src.asnum in {" + " ".join(top) + "}")
        return "(" + " and ".join(parts) + ")"

    def score(window, st):
        groups, authed_now = defaultdict(Agg), defaultdict(set)
        for m in window:
            for k, g in m["groups"].items(): groups[k].merge(g)
            for k, ips in m["authed"].items(): authed_now[k] |= ips
        bl = st["baseline"]["k"]
        ready = clock() - st["baseline"]["since"] >= BASELINE_DAYS * 86400
        floor = min(MIN_REQ, FIXED_MIN_REQ, STRONG_MIN_REQ, SHORT_MIN_REQ)
        out = []
        for key, g in groups.items():
            c, l, e, h, fam = key
            if g.n < floor or len(g.ips) < 2: continue
            k = fpkey(c, l, e)
            sig = signals(*key, g)
            t = tier(g, sig)
            # Without a full baseline an unknown fingerprint is not enough on its own.
            if not t and ready and g.n >= 5 * MIN_REQ and len(g.ips) >= 4 * MIN_IPS: t = "heavy"
            if not t: continue
            # g.bl is the baseline verdict an archived minute carries into a replay
            excluded = "in the logged in baseline" if k in bl or g.bl else "logged in requests in the window" if (g.authed or k in authed_now) else ""
            # every request in the window with the same handshake and a matching user agent, logged in or not
            same = [x for kk, x in groups.items() if kk[:4] == key[:4] and ua_matches(kk[4], fam)]
            authed_hits = sum(x.authed for x in same)
            why = "; ".join(sig.values()) or f"{g.n} requests from {len(g.ips)} addresses, unknown fingerprint after a full baseline"
            out.append({"id": hashlib.sha1(expression(*key, g).encode()).hexdigest()[:8], "key": key, "fpkey": k, "g": g,
                        "why": why, "tier": t, "signals": sorted(sig), "excluded": excluded, "authed_hits": authed_hits,
                        "expr": expression(*key, g), "ready": ready})
        return groups, sorted(out, key=lambda x: -x["g"].n)

    def evidence(x, st):
        g, (c, l, e, h, fam) = x["g"], x["key"]
        ips = len(g.ips); top_asn = g.asn.most_common(3)
        asn = ", ".join(f"AS{a} {100 * n // g.n}%" for a, n in top_asn)
        ua = g.ua.most_common(1)[0][0][:90] if g.ua else ""
        bl = st["baseline"]
        age = (clock() - bl["since"]) / 86400
        return (f"[{x['id']}] {x['tier']}: {g.n} req ({g.src.get('site', 0)} site, {g.shed} of them shed, {g.src.get('api', 0)} api) from {ips} addresses "
                f"({g.n / ips:.1f} per address, busiest {g.ips.most_common(1)[0][1]}), {len(g.asn)} ASNs ({asn}), "
                f"{len(g.paths)}{'+' if len(g.paths) >= 500 else ''} paths, {h} hello {l}, ua {ua!r}\n"
                f"why: {x['why']}\n"
                f"logged in: {x['authed_hits']} matching requests in the {WINDOW} min window, "
                f"{'in' if x['fpkey'] in bl['k'] else 'not in'} the logged in baseline ({age:.1f} of {BASELINE_DAYS} days, {len(bl['k'])} keys)\n"
                f"expr: {x['expr']}")

    def post_dry(cands, st):
        now = time.time()
        st["post_times"] = [t for t in st["post_times"] if t > now - 3600]
        st["posted"] = {k: t for k, t in st["posted"].items() if t > now - REPOST_HOURS * 3600}
        fresh = [x for x in cands if not x["excluded"] and x["id"] not in st["posted"]]
        if not fresh or len(st["post_times"]) >= POSTS_PER_HOUR: return
        head = (f"fp-autoban DRY RUN, no Cloudflare call made: {len(fresh)} new fingerprint cluster(s) it would "
                f"managed_challenge (block on a second sighting)")
        notify.alert("FingerprintAutobanCandidate", head + "\n" + "\n\n".join(evidence(x, st) for x in fresh[:3]),
                     severity="info", ttl=3600)
        for x in fresh[:3]: st["posted"][x["id"]] = now
        st["post_times"].append(now)

    TOKEN = os.environ.get("CF_API_TOKEN", "") if LIVE else ""
    ZONE = os.environ.get("CF_ZONE_ID", "") if LIVE else ""

    def cf(method, path, body=None):
        if not LIVE: raise RuntimeError("Cloudflare call outside live mode")
        req = urllib.request.Request(f"https://api.cloudflare.com/client/v4/zones/{ZONE}{path}", method=method,
                                     data=json.dumps(body).encode() if body is not None else None,
                                     headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            d = json.load(r)
        if not d.get("success"): raise RuntimeError(f"{method} {path}: {d.get('errors')}")
        return d["result"]

    def b36(n):
        s = ""
        while True:
            n, r = divmod(n, 36); s = "0123456789abcdefghijklmnopqrstuvwxyz"[r] + s
            if not n: return s

    def parse_rule(rule):
        entries = []
        for item in rule.get("description", "")[len(PREFIX):].split():
            if item.count(":") != 3: continue
            i, stage, added, exp = item.split(":")
            entries.append({"id": i, "stage": stage, "added": int(added, 36) * 60, "exp": int(exp, 36) * 60})
        if not entries: return []
        # clauses are joined in description order; a user agent may hold parentheses, so split, then verify
        clauses = ["(" + c + ")" for c in rule.get("expression", "")[1:-1].split(") or (")]
        if len(clauses) != len(entries): raise RuntimeError("reserved rule clauses and entries differ, edited by hand?")
        for x, c in zip(entries, clauses):
            if hashlib.sha1(c.encode()).hexdigest()[:8] != x["id"]: raise RuntimeError(f"rule entry {x['id']} does not match its clause, edited by hand?")
            x["expr"] = c
        return entries

    def render(entries):
        desc = PREFIX + " " + " ".join(f"{x['id']}:{x['stage']}:{b36(int(x['added'] // 60))}:{b36(int(x['exp'] // 60))}" for x in entries)
        expr = " or ".join(x["expr"] for x in entries) or PLACEHOLDER
        # one rule has one action: the set is challenged until every entry has earned a block
        action = "block" if entries and all(x["stage"] == "b" for x in entries) else "managed_challenge"
        return {"description": desc.strip(), "expression": expr, "action": action, "enabled": bool(entries)}

    def reserved_rule():
        rs = cf("GET", "/rulesets/phases/http_request_firewall_custom/entrypoint")
        rule = next((r for r in rs["rules"] if r.get("description", "").startswith(PREFIX)), None)
        if rule: return rs["id"], rule
        body = {"description": PREFIX, "expression": PLACEHOLDER, "action": "managed_challenge", "enabled": False}
        rules = rs["rules"]
        at = next((i for i, r in enumerate(rules) if r.get("description", "").startswith(SESSION_SKIP)), None)
        if at is not None:
            while at + 1 < len(rules) and rules[at + 1].get("action") == "block": at += 1
            body["position"] = {"after": rules[at]["id"]}
        cf("POST", f"/rulesets/{rs['id']}/rules", body)
        rs = cf("GET", "/rulesets/phases/http_request_firewall_custom/entrypoint")
        return rs["id"], next(r for r in rs["rules"] if r.get("description", "").startswith(PREFIX))

    def live_apply(cands, st):
        now = time.time()
        rs_id, rule = reserved_rule()
        if kill_set(st):
            if rule.get("enabled"):
                cf("PATCH", f"/rulesets/{rs_id}/rules/{rule['id']}", {**render([]), "description": rule["description"],
                                                                      "expression": rule["expression"], "enabled": False})
                notify.alert("FingerprintAutobanKilled", "fp-autoban kill switch: reserved rule disabled", severity="warning", ttl=3600)
            return
        entries = [x for x in parse_rule(rule) if x["exp"] > now]
        live = {x["id"]: x for x in entries}
        changes = []
        for x in cands:
            if x["excluded"] or x["authed_hits"]: continue
            if x["id"] in live:
                y = live[x["id"]]
                if y["stage"] == "c" and now - y["added"] >= PROMOTE_AFTER:
                    y["stage"], y["exp"] = "b", now + BLOCK_TTL; changes.append(f"block {x['id']}")
                else:
                    ttl = BLOCK_TTL if y["stage"] == "b" else CHALLENGE_TTL
                    # extend only past half life, or the description changes and gets patched every minute
                    if y["exp"] - now < ttl / 2: y["exp"] = now + ttl
                continue
            st["adds"] = [t for t in st["adds"] if t > now - 3600]
            if len(live) >= MAX_ENTRIES or len(st["adds"]) >= MAX_NEW_PER_HOUR: continue
            live[x["id"]] = {"id": x["id"], "stage": "c", "added": now, "exp": now + CHALLENGE_TTL, "expr": x["expr"]}
            st["adds"].append(now); changes.append(f"challenge {x['id']}")
        new = render(sorted(live.values(), key=lambda y: y["added"]))
        if all(new[k] == rule.get(k) for k in new): return
        if len(new["expression"]) > 4000: raise RuntimeError("reserved rule expression would pass 4000 characters")
        cf("PATCH", f"/rulesets/{rs_id}/rules/{rule['id']}", new)
        expired = len(parse_rule(rule)) - len(entries)
        notify.alert("FingerprintAutobanLive", f"fp-autoban LIVE: {', '.join(changes) or 'refresh'}"
                     f"{f', {expired} expired' if expired else ''}; rule now {new['action']} with {len(live)} entries",
                     severity="info", ttl=3600)

    CODE = hashlib.sha256(open(__file__, "rb").read()).hexdigest()[:12]
    _salt = {"day": -1, "key": b""}

    # Addresses never reach the archive: a keyed hash whose key lives in memory for one UTC day, so
    # minutes of a day still join and nothing older can be turned back into an address.
    def pseudo(ip):
        day = int(time.time() // 86400)
        if _salt["day"] != day: _salt.update(day=day, key=secrets.token_bytes(16))
        return "h:" + hmac.new(_salt["key"], ip.encode(), "sha256").hexdigest()[:10]

    def s3_put(key, body):
        host, path = urllib.parse.urlparse(ARCHIVE).netloc, "/" + ARCHIVE_BUCKET + "/" + urllib.parse.quote(key)
        stamp = time.strftime("%Y%m%dT%H%M%SZ", time.gmtime()); day = stamp[:8]
        digest = hashlib.sha256(body).hexdigest()
        signed = {"host": host, "x-amz-content-sha256": digest, "x-amz-date": stamp}
        names = sorted(signed)
        canonical = "\n".join(["PUT", path, "", *[f"{n}:{signed[n]}" for n in names], "", ";".join(names), digest])
        scope = f"{day}/auto/s3/aws4_request"
        to_sign = "\n".join(["AWS4-HMAC-SHA256", stamp, scope, hashlib.sha256(canonical.encode()).hexdigest()])
        k = ("AWS4" + os.environ["ARCHIVE_SECRET_KEY"]).encode()
        for part in (day, "auto", "s3", "aws4_request"): k = hmac.new(k, part.encode(), "sha256").digest()
        sig = hmac.new(k, to_sign.encode(), "sha256").hexdigest()
        auth = f"AWS4-HMAC-SHA256 Credential={os.environ['ARCHIVE_ACCESS_KEY']}/{scope}, SignedHeaders={';'.join(names)}, Signature={sig}"
        req = urllib.request.Request(ARCHIVE + path, data=body, method="PUT", headers={
            "x-amz-content-sha256": digest, "x-amz-date": stamp, "Authorization": auth, "Content-Type": "application/gzip"})
        with urllib.request.urlopen(req, timeout=60) as r: r.read()

    def gz_lines(items): return gzip.compress("".join(json.dumps(x, separators=(",", ":")) + "\n" for x in items).encode(), 6)

    def utc(t, fmt): return time.strftime(fmt, time.gmtime(t))

    _runs, _wave, _archive_failures = [], {"id": "", "until": 0, "last": 0, "saved": False}, [0]

    def archive_failed(key, e):
        _archive_failures[0] += 1
        log(event="archive_error", key=key, error=str(e)[:300], failures=_archive_failures[0], buffered=len(_runs))
        if _archive_failures[0] == 6:
            notify.alert("FingerprintAutobanArchiveFailing", f"fp-autoban could not write {key} six times in a row: {str(e)[:300]}",
                         severity="warning", ttl=3600)

    def archive_flush():
        if not ARCHIVE or not _runs: return
        key = f"{ARCHIVE_PREFIX}/runs/{utc(_runs[0]['t'] - 60, '%Y/%m/%d/%H%M')}.jsonl.gz"
        try:
            s3_put(key, gz_lines(_runs)); log(event="archived", key=key, runs=len(_runs)); _runs.clear(); _archive_failures[0] = 0
        except Exception as e:
            archive_failed(key, e)
            del _runs[:-120]

    def wave_lines(minutes):
        out = []
        for m in minutes:
            for ts, src, line in m["raw"]:
                p = parse(src, line)
                ip = p[6] if p else ""
                out.append({"ts": ts, "src": src, "line": line.replace(ip, pseudo(ip)) if ip else line})
        return out

    # A wave folder starts with the whole window (the run up matters), then one part per window
    # while it lasts, and closes once a full window passes without a wave.
    def archive_wave(window, record):
        t = window[-1]["t"]
        if record["wave"]:
            _wave["last"] = t
            if not _wave["id"]: _wave.update(id=utc(window[0]["t"] - 60, "%Y%m%dT%H%MZ"), saved=False)
        if not _wave["id"]: return
        pending = [m for m in window if m["t"] > _wave["until"]]
        first, ended = not _wave["saved"], t - _wave["last"] >= WINDOW * 60
        if pending and (first or ended or len(pending) >= WINDOW):
            base = f"{ARCHIVE_PREFIX}/waves/{_wave['id']}/"
            name = "lines.jsonl.gz" if first else f"lines-{utc(pending[0]['t'] - 60, '%H%M')}.jsonl.gz"
            try:
                s3_put(base + name, gz_lines(wave_lines(pending)))
                if first: s3_put(base + "run.json.gz", gz_lines([record]))
                _wave.update(until=pending[-1]["t"], saved=True)
                log(event="wave_archived", key=base + name, minutes=len(pending), reason=record["wave"])
            except Exception as e:
                archive_failed(base + name, e)
        if ended: _wave["id"] = ""

    def minute_record(m, bl):
        return {"t": m["t"], "parsed": m["parsed"], "unparsed": m["skipped"], "truncated": m["truncated"], "groups": [
            {"c": c, "l": l, "e": e, "h": h, "fam": fam, "n": g.n, "authed": g.authed, "shed": g.shed, "lines": g.lines,
             "nips": len(g.ips), "ips": {pseudo(ip): n for ip, n in g.ips.most_common(500)}, "asn": dict(g.asn.most_common(5)),
             "src": dict(g.src), "ua": dict(g.ua.most_common(3)), "paths": sorted(g.paths)[:10], "bl": fpkey(c, l, e) in bl}
            for (c, l, e, h, fam), g in m["groups"].items()]}

    def wave_reason(m, cands):
        anon = max((g.n - g.authed for g in m["groups"].values()), default=0)
        shed = sum(g.shed for g in m["groups"].values())
        if any(not x["excluded"] for x in cands): return "candidate"
        if anon >= WAVE_ANON_PER_MINUTE: return f"one fingerprint sent {anon} anonymous requests in a minute"
        if shed >= WAVE_SHED_PER_MINUTE: return f"{shed} anonymous renders shed in a minute"
        return ""

    def run_record(window, st, groups, cands, top_asn):
        bl, total = st["baseline"], sum(g.n for g in groups.values())
        return {"v": 1, "t": window[-1]["t"], "code": CODE, "live": LIVE, "thresholds": THRESHOLDS,
                "baseline": {"keys": len(bl["k"]), "age_days": round((clock() - bl["since"]) / 86400, 2),
                             "ready": clock() - bl["since"] >= BASELINE_DAYS * 86400},
                "window": {"minutes": len(window), "groups": len(groups), "requests": total,
                           "authed": sum(g.authed for g in groups.values()), "shed": sum(g.shed for g in groups.values())},
                "top_asn": top_asn,
                "candidates": [{"id": x["id"], "tier": x["tier"], "signals": x["signals"], "key": list(x["key"]), "fpkey": x["fpkey"],
                                "n": x["g"].n, "shed": x["g"].shed, "ips": len(x["g"].ips), "asn": dict(x["g"].asn.most_common(5)),
                                "excluded": x["excluded"], "authed_hits": x["authed_hits"], "expr": x["expr"],
                                "evidence": evidence(x, st)} for x in cands[:20]],
                "wave": wave_reason(window[-1], cands),
                "minutes": [minute_record(m, bl["k"]) for m in window if not m.get("archived")]}

    def run_once(window, st):
        groups, cands = score(window, st)
        by_asn = defaultdict(lambda: [0, set(), 0])
        for (c, l, e, h, fam), g in groups.items():
            for a, n in g.asn.items(): by_asn[a][0] += n; by_asn[a][1].add((c, l, e))
            by_asn[a][2] += g.authed
        total = sum(g.n for g in groups.values()) or 1
        top_asn = [{"asn": a, "n": v[0], "share": round(v[0] / total, 4), "fingerprints": len(v[1]), "authed": v[2]}
                   for a, v in sorted(by_asn.items(), key=lambda kv: -kv[1][0])[:8]]
        log(event="run", groups=len(groups), requests=sum(g.n for g in groups.values()),
            parsed=sum(m["parsed"] for m in window), unparsed=sum(m["skipped"] for m in window),
            truncated=sorted({s for m in window for s in m["truncated"]}), minutes=len(window),
            shed=sum(g.shed for g in groups.values()),
            baseline=len(st["baseline"]["k"]), candidates=[{"id": x["id"], "tier": x["tier"], "n": x["g"].n, "ips": len(x["g"].ips),
            "excluded": x["excluded"], "why": x["why"][:80]} for x in cands[:10]], top_asn=top_asn, live=LIVE)
        if ARCHIVE:
            record = run_record(window, st, groups, cands, top_asn)
            for m in window: m["archived"] = True
            _runs.append(record)
            archive_wave(window, record)
            if len(_runs) >= ARCHIVE_FLUSH_RUNS: archive_flush()
        post_dry(cands, st)
        if LIVE: live_apply(cands, st)
        return cands

    def main():
        st = load_state()
        log(event="start", live=LIVE, baseline=len(st["baseline"]["k"]), window=WINDOW, min_requests=MIN_REQ, min_ips=MIN_IPS)
        now = int(time.time()) - LAG; now -= now % 60
        window = [bucket_minute(t) for t in range(now - (WINDOW - 1) * 60, now + 60, 60)]
        for m in window: learn_baseline(st, m)
        last, saved, failures = now, time.time(), 0
        if "--once" in sys.argv:
            for x in run_once(window, st):
                print(evidence(x, st) + (f"\nEXCLUDED: {x['excluded']}" if x["excluded"] else "") + "\n", flush=True)
            save_state(st); archive_flush(); return
        signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
        try:
            loop(window, last, saved, failures, st)
        finally:
            archive_flush()

    def loop(window, last, saved, failures, st):
        while True:
            try:
                t = int(time.time()) - LAG; t -= t % 60
                while last < t:
                    m = bucket_minute(last + 60)
                    last += 60
                    learn_baseline(st, m)
                    window = (window + [m])[-WINDOW:]
                run_once(window, st)
                if time.time() - saved >= 300:
                    save_state(st); saved = time.time()
                failures = 0
            except Exception as e:
                failures += 1
                log(event="error", error=str(e)[:300], failures=failures)
                if failures == 10:
                    notify.alert("FingerprintAutobanFailing", f"fp-autoban failed 10 runs in a row: {str(e)[:300]}", severity="warning", ttl=3600)
            time.sleep(61 - (time.time() - LAG) % 60)

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fp-autoban
  namespace: monitoring
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: fp-autoban }
  template:
    metadata:
      labels: { app: fp-autoban }
    spec:
      serviceAccountName: fp-autoban
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: autoban
          image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          command: ["python3", "-u", "/app/autoban.py"]
          envFrom: [{ secretRef: { name: fp-autoban } }]
          env:
            - name: WATCH_NAME
              value: fp-autoban
            - name: PYTHONPATH
              value: /app/lib
            - name: ALERTMANAGER_URL
              value: http://kps-alertmanager.monitoring.svc:9093
            - name: FP_LIVE
              value: "0"
            - name: FP_KILL
              value: "0"
            - name: ARCHIVE_ENDPOINT
              value: https://s3.unorouter.com
            - name: ARCHIVE_BUCKET
              value: unorouter-sync
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 384Mi }
          volumeMounts: [{ name: app, mountPath: /app }, { name: lib, mountPath: /app/lib }]
      volumes:
        - name: app
          configMap: { name: fp-autoban }
        - name: lib
          configMap: { name: watch-lib }
---
# Dry run reaches only Loki, Alertmanager and the s3-gateway (the API server and DNS come from the clusterwide policies).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fp-autoban-egress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: { app: fp-autoban }
  egress:
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: loki }
      toPorts:
        - ports: [{ port: "3100", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: alertmanager }
      toPorts:
        - ports: [{ port: "9093", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: s3-gateway, app: s3-gateway }
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
