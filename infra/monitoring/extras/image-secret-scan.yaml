# Every 15 minutes: for each public org package, pull every layer of the newest tags
# that were not scanned yet and search every file for secret material: known key
# formats AND the live values of unorouter-env, bot-env and newapi-env (mounted here,
# only key NAMES are ever printed). A hit is posted to Discord. Background: on
# 2026-09-07 the "fixed" frontend image still carried the full .env in the layer that
# copied the standalone build; a later COPY over it hid the file from `cat` inside the
# container but not from anyone who pulls the image, since every layer ships. Checking
# the merged filesystem is not a check. Pattern rules skip vendored code and native
# binaries (sample strings); the live-value needles run on every byte of every file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-secret-scan
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: image-secret-scan
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK
      remoteRef: { key: alertmanager, property: discordWebhook }
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: ghcr-push, property: token }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-secret-scan-unorouter-env
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: image-secret-scan-unorouter-env, creationPolicy: Owner }
  dataFrom:
    - extract: { key: unorouter-env }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-secret-scan-bot-env
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: image-secret-scan-bot-env, creationPolicy: Owner }
  dataFrom:
    - extract: { key: bot-env }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-secret-scan-newapi-env
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: image-secret-scan-newapi-env, creationPolicy: Owner }
  dataFrom:
    - extract: { key: newapi-env }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-secret-scan
  namespace: monitoring
---
# scan state (digests already scanned) lives in a ConfigMap the job creates itself;
# it is deliberately not in git, ArgoCD would reset it on every sync
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-secret-scan
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-secret-scan
  namespace: monitoring
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: image-secret-scan }
subjects:
  - kind: ServiceAccount
    name: image-secret-scan
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-secret-scan
  namespace: monitoring
data:
  scan.py: |
    import fnmatch, hashlib, io, json, os, re, tarfile, time, urllib.error, urllib.request, zlib

    ORG = os.environ.get("GITHUB_ORG", "unorouter")
    PACKAGES = [x for x in os.environ.get("SCAN_PACKAGES", "").split(",") if x]
    WINDOW = int(os.environ.get("SCAN_WINDOW", "5"))
    FILE_MAX = int(os.environ.get("FILE_MAX_BYTES", str(8 << 30)))
    SECRET_DIRS = [x for x in os.environ.get("SECRET_DIRS", "").split(",") if x]
    SKIP_KEYS = [x for x in os.environ.get("SKIP_KEYS", "").split(",") if x]
    STATE_CM = os.environ.get("STATE_CONFIGMAP", "")
    NS = os.environ.get("POD_NAMESPACE", "monitoring")
    WEBHOOK = os.environ.get("DISCORD_WEBHOOK", "")
    GH = os.environ["GITHUB_TOKEN"]
    UA = {"user-agent": "image-secret-scan/1"}
    CHUNK = 4 << 20
    OVERLAP = 512

    PATTERNS = [
        ("openai style key", rb"(?<![A-Za-z0-9_-])sk-(?:(?:ant|proj|or|live|test)-[A-Za-z0-9_-]{32,120}|[A-Za-z0-9]{32,80})(?![A-Za-z0-9])"),
        ("github token", rb"gh[pousr]_[A-Za-z0-9]{36}"),
        ("github fine grained token", rb"github_pat_[A-Za-z0-9_]{80,}"),
        ("cloudflare token", rb"cf[a-z]{2}_[A-Za-z0-9_-]{40,}"),
        ("google api key", rb"AIza[0-9A-Za-z_-]{35}"),
        ("runpod key", rb"rpa_[A-Za-z0-9]{40,}"),
        ("huggingface token", rb"hf_[A-Za-z0-9]{30,}"),
        ("topgg webhook secret", rb"whs_[0-9a-f]{64}"),
        ("slack token", rb"xox[baprs]-[A-Za-z0-9-]{10,}"),
        ("aws access key", rb"(?<![A-Z0-9])AKIA[0-9A-Z]{16}(?![A-Z0-9])"),
        ("private key block", rb"-----BEGIN [A-Z ]*PRIVATE KEY-----\s*[A-Za-z0-9+/=\s]{64,}"),
        ("connection string with password", rb"(?:postgres|postgresql|mysql|redis|rediss|mongodb|amqp)://[^\s:/@]+:[^\s@/]{4,}@"),
        ("jwt", rb"eyJ[A-Za-z0-9_-]{15,}\.eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{20,}"),
        ("discord bot token", rb"[MN][A-Za-z\d]{23,}\.[\w-]{6}\.[\w-]{27,}"),
    ]
    PATTERNS = [(n, re.compile(p)) for n, p in PATTERNS]
    ENV_FILE = re.compile(r"(^|/)\.env(\.[A-Za-z0-9_-]+)?$")
    DOC_NOISE = re.compile(r"/node_modules/|/usr/(lib|lib64|libexec|share|local/lib|local/bin)/|/lib/|/lib64/")
    ENV_FILE_OK = {".env.example", ".env.public", ".env.sample", ".env.template"}

    def http(url, headers=None, method="GET", data=None, timeout=60):
        req = urllib.request.Request(url, data=data, headers={**UA, **(headers or {})}, method=method)
        try:
            return urllib.request.urlopen(req, timeout=timeout)
        except urllib.error.HTTPError as e:
            return e

    def get_json(url, headers=None):
        r = http(url, headers)
        body = r.read()
        return r.status, (json.loads(body) if body else {})

    AM = os.environ.get("ALERTMANAGER_URL", "")

    # A finding is also raised as a critical Alertmanager alert (alertname ImageSecretLeak),
    # which is what rings the phone; the Discord post above carries the detail. endsAt keeps
    # it firing for 40 minutes, every run re-posts it while the version still exists.
    def page(alertname, summary):
        if not AM:
            print("PAGE:", alertname, summary)
            return
        now = time.time()
        fmt = lambda t: time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(t))
        body = json.dumps([{"labels": {"alertname": alertname, "severity": "critical", "source": "image-secret-scan"},
                            "annotations": {"summary": summary[:500]},
                            "startsAt": fmt(now), "endsAt": fmt(now + 2400)}]).encode()
        r = http(AM.rstrip("/") + "/api/v2/alerts", {"content-type": "application/json"}, "POST", body)
        if r.status not in (200, 202):
            print(f"alertmanager post failed HTTP {r.status}", flush=True)

    def post(text):
        if not WEBHOOK:
            print("DISCORD:", text)
            return
        body = json.dumps({"username": "image secret scan", "content": text[:1900]}).encode()
        http(WEBHOOK, {"content-type": "application/json"}, "POST", body).read()

    # needles: every live secret value the images must not contain. Only the key NAME is
    # ever printed. Short, numeric, url-without-credentials and allowlisted keys are skipped
    # because they are configuration, not secrets, and would appear legitimately.
    def load_needles():
        needles, public = {}, set()
        for d in SECRET_DIRS:
            for key in os.listdir(d):
                if key.startswith("."):
                    continue
                with open(os.path.join(d, key), "rb") as f:
                    val = f.read().strip()
                if any(fnmatch.fnmatch(key, g) for g in SKIP_KEYS):
                    public.add(val)
                    continue
                s = val.decode(errors="replace")
                if len(val) < 16 or not re.search(r"[A-Za-z]", s) or re.fullmatch(r"[0-9,\s]+", s):
                    continue
                if re.fullmatch(r"[a-z+]+://[^@]*", s):
                    continue
                needles.setdefault(val, f"{os.path.basename(d)}/{key}")
        return {v: k for v, k in needles.items() if v not in public}

    def low_entropy(m):
        s = m.decode(errors="replace")
        return len(set(s)) < 8 or re.search(r"(.)\1{7,}", s) is not None

    class Scanner:
        def __init__(self, needles):
            self.needles = needles
            self.hits = []          # (where, kind, masked)
            self.seen = set()
            self.files = 0
            self.skipped_big = 0
            self.bytes = 0

        def add(self, where, kind, sample):
            k = (where, kind, sample)
            if k in self.seen:
                return
            self.seen.add(k)
            self.hits.append((where, kind, sample))

        def scan_bytes(self, where, buf, patterns=True):
            for name, rx in (PATTERNS if patterns and not DOC_NOISE.search(where) else []):
                for m in rx.finditer(buf):
                    g = m.group(0)
                    if low_entropy(g):
                        continue
                    self.add(where, name, f"{g[:6].decode(errors='replace')}… ({len(g)} chars)")
            for val, key in self.needles.items():
                if val in buf:
                    self.add(where, "LIVE SECRET VALUE", key)

        def scan_stream(self, where, fobj, size):
            if size > FILE_MAX:
                self.skipped_big += 1
                return
            self.files += 1
            tail = b""
            patterns = True
            while True:
                chunk = fobj.read(CHUNK)
                if not chunk:
                    break
                if not tail:
                    patterns = not chunk.startswith(b"\x7fELF")
                self.bytes += len(chunk)
                self.scan_bytes(where, tail + chunk, patterns)
                tail = chunk[-OVERLAP:]

        def scan_layer(self, where, raw, media_type):
            if media_type.endswith("zstd"):
                from compression import zstd
                fobj = zstd.ZstdFile(raw)
            elif media_type.endswith("gzip") or media_type.endswith("tar+gzip"):
                fobj = io.BufferedReader(GzipStream(raw))
            else:
                fobj = raw
            with tarfile.open(fileobj=fobj, mode="r|") as tar:
                for m in tar:
                    if not m.isfile():
                        continue
                    path = "/" + m.name.lstrip("./")
                    base = path.rsplit("/", 1)[-1]
                    if ENV_FILE.search(path) and base not in ENV_FILE_OK:
                        f = tar.extractfile(m)
                        data = f.read(1 << 20) if f else b""
                        keys = re.findall(rb"^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=", data, re.M)
                        secretish = [k.decode() for k in keys if not k.startswith(b"NEXT_PUBLIC_")]
                        if secretish:
                            self.add(f"{where}:{path}", "env file with non public keys", ", ".join(secretish[:12]) + (" …" if len(secretish) > 12 else ""))
                        self.scan_bytes(f"{where}:{path}", data)
                        continue
                    f = tar.extractfile(m)
                    if f:
                        self.scan_stream(f"{where}:{path}", f, m.size)

    class GzipStream(io.RawIOBase):
        def __init__(self, raw):
            self.raw = raw
            self.d = zlib.decompressobj(16 + zlib.MAX_WBITS)
            self.buf = b""
            self.eof = False
        def readable(self):
            return True
        def readinto(self, b):
            while not self.buf and not self.eof:
                c = self.raw.read(1 << 20)
                if not c:
                    self.eof = True
                    self.buf = self.d.flush()
                    break
                self.buf = self.d.decompress(c)
            n = min(len(b), len(self.buf))
            b[:n] = self.buf[:n]
            self.buf = self.buf[n:]
            return n

    def registry_token(pkg):
        st, j = get_json(f"https://ghcr.io/token?scope=repository:{ORG}/{pkg}:pull&service=ghcr.io",
                         {"authorization": "Basic " + __import__("base64").b64encode(b"x:" + GH.encode()).decode()})
        if st != 200:
            raise RuntimeError(f"registry token for {pkg}: HTTP {st}")
        return j["token"]

    ACCEPT = ("application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, "
              "application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json")

    def scan_image(pkg, ref, tags, needles):
        tok = registry_token(pkg)
        h = {"authorization": "Bearer " + tok}
        st, idx = get_json(f"https://ghcr.io/v2/{ORG}/{pkg}/manifests/{ref}", {**h, "accept": ACCEPT})
        if st != 200:
            return None, f"manifest HTTP {st}"
        manifests = [m for m in idx.get("manifests", []) if m.get("platform", {}).get("os") not in (None, "unknown")] if "manifests" in idx else [{"digest": ref, "platform": {}}]
        sc = Scanner(needles)
        for m in manifests:
            arch = m.get("platform", {}).get("architecture", "")
            st, man = get_json(f"https://ghcr.io/v2/{ORG}/{pkg}/manifests/{m['digest']}", {**h, "accept": ACCEPT})
            if st != 200:
                sc.add(f"{arch}", "manifest fetch failed", f"HTTP {st}")
                continue
            cfg = man.get("config", {})
            if cfg.get("digest"):
                r = http(f"https://ghcr.io/v2/{ORG}/{pkg}/blobs/{cfg['digest']}", h)
                if r.status == 200:
                    c = json.loads(r.read())
                    envs = c.get("config", {}).get("Env") or []
                    sc.scan_bytes(f"{arch}:image config Env", "\n".join(envs).encode())
                    for hist in c.get("history", []):
                        sc.scan_bytes(f"{arch}:image history", (hist.get("created_by") or "").encode())
            for i, layer in enumerate(man.get("layers", [])):
                r = http(f"https://ghcr.io/v2/{ORG}/{pkg}/blobs/{layer['digest']}", h, timeout=300)
                if r.status != 200:
                    sc.add(f"{arch}:layer {i}", "layer fetch failed", f"HTTP {r.status}")
                    continue
                try:
                    sc.scan_layer(f"{arch}:layer{i}", r, layer.get("mediaType", ""))
                except Exception as e:
                    sc.add(f"{arch}:layer {i}", "layer unreadable", type(e).__name__)
        return sc, None

    def k8s(method, path, body=None):
        with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
            tok = f.read()
        import ssl
        ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
        host = os.environ["KUBERNETES_SERVICE_HOST"]
        req = urllib.request.Request(f"https://{host}{path}", data=body, method=method,
                                     headers={**UA, "authorization": "Bearer " + tok, "content-type": "application/merge-patch+json" if method == "PATCH" else "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                return r.status, json.loads(r.read() or b"{}")
        except urllib.error.HTTPError as e:
            return e.code, {}

    def load_state():
        if not STATE_CM:
            p = os.environ.get("STATE_FILE", "state.json")
            return json.load(open(p)) if os.path.exists(p) else {}
        st, cm = k8s("GET", f"/api/v1/namespaces/{NS}/configmaps/{STATE_CM}")
        if st == 404:
            return {}
        return json.loads(cm.get("data", {}).get("state", "{}"))

    def save_state(state):
        if not STATE_CM:
            json.dump(state, open(os.environ.get("STATE_FILE", "state.json"), "w"), indent=1)
            return
        body = json.dumps({"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": STATE_CM, "namespace": NS}, "data": {"state": json.dumps(state)}}).encode()
        st, _ = k8s("PATCH", f"/api/v1/namespaces/{NS}/configmaps/{STATE_CM}", body)
        if st == 404:
            st, _ = k8s("POST", f"/api/v1/namespaces/{NS}/configmaps", body)
        if st not in (200, 201):
            print(f"state save failed HTTP {st}", flush=True)

    def main():
        needles = load_needles()
        print(f"needles={len(needles)} packages={PACKAGES} window={WINDOW}", flush=True)
        state = load_state()
        ghh = {"authorization": "Bearer " + GH, "accept": "application/vnd.github+json"}
        report = []
        scanned = 0
        for pkg in PACKAGES:
            st, versions = get_json(f"https://api.github.com/orgs/{ORG}/packages/container/{pkg}/versions?per_page=100", ghh)
            if st != 200:
                report.append(f"`{ORG}/{pkg}`: cannot list versions (HTTP {st})")
                continue
            tagged = [v for v in versions if v.get("metadata", {}).get("container", {}).get("tags")]
            tagged.sort(key=lambda v: v["created_at"], reverse=True)
            for v in tagged[:WINDOW]:
                digest = v["name"]
                tags = [t for t in v["metadata"]["container"]["tags"] if t not in ("latest", "buildcache")] or v["metadata"]["container"]["tags"]
                key = f"{pkg}@{digest}"
                if key in state:
                    if state[key].get("verdict") == "hit":
                        report.append(f"`{ORG}/{pkg}:{tags[0][:12]}`: STILL PRESENT, scanned {time.strftime('%Y-%m-%d %H:%M', time.gmtime(state[key]['t']))}Z, {state[key]['hits']} findings ({', '.join(state[key].get('what', []))}); delete the version")
                    continue
                t0 = time.time()
                sc, err = scan_image(pkg, digest, tags, needles)
                scanned += 1
                if err:
                    report.append(f"`{ORG}/{pkg}:{tags[0][:12]}`: {err}")
                    continue
                verdict = "hit" if sc.hits else "clean"
                state[key] = {"t": int(time.time()), "tags": tags[:3], "verdict": verdict, "hits": len(sc.hits),
                              "what": sorted({kind for _, kind, _ in sc.hits})[:6]}
                print(f"{pkg}:{tags[0][:12]} {verdict} files={sc.files} bytes={sc.bytes} big_skipped={sc.skipped_big} hits={len(sc.hits)} {time.time()-t0:.0f}s", flush=True)
                if sc.hits:
                    lines = [f"**`{ORG}/{pkg}:{tags[0][:12]}`** ({len(sc.hits)} findings)"]
                    for where, kind, sample in sc.hits[:15]:
                        lines.append(f"  {kind}: {sample} at {where}")
                    if len(sc.hits) > 15:
                        lines.append(f"  … {len(sc.hits) - 15} more")
                    report.append("\n".join(lines))
                save_state(state)
                if not STATE_CM:
                    with open(f"hits-{pkg}-{tags[0][:12]}.txt", "w") as f:
                        f.writelines(f"{kind}\t{sample}\t{where}\n" for where, kind, sample in sc.hits)
        if report:
            page("ImageSecretLeak", f"{len(report)} public image(s) carry secret material: " + "; ".join(r.split("\n")[0].replace("*", "") for r in report)[:400])
            post("**image secret scan: a container image carries secret material**\n" + "\n".join(report)
                 + "\nAction: make the package private NOW (github.com/orgs/" + ORG + "/packages/container/<name>/settings), delete the version, rotate every named key, fix the Dockerfile.")
        print(f"scanned={scanned} findings={len(report)} state={len(state)}", flush=True)

    main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-secret-scan
  namespace: monitoring
spec:
  schedule: "7,22,37,52 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 840
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: image-secret-scan
          containers:
            - name: scan
              image: python:3.14-alpine
              command: ["python3", "-u", "/app/scan.py"]
              env:
                - name: GITHUB_ORG
                  value: unorouter
                # keep in step with ALLOW_PUBLIC of ghcr-visibility-watch, plus unorouter
                # once its images are clean; private packages are not a leak surface
                - name: SCAN_PACKAGES
                  value: unorouter,unorouter-bot,new-api,new-api-sync,uno-import,uno-cards
                # newest tagged versions per package considered each run
                - name: SCAN_WINDOW
                  value: "5"
                - name: SECRET_DIRS
                  value: /secrets/unorouter-env,/secrets/bot-env,/secrets/newapi-env
                # public by design or plain configuration; never treated as a needle
                - name: SKIP_KEYS
                  value: NEXT_PUBLIC_*,INDEXNOW_KEY,WEB_BOT_AUTH_PUBLIC_JWKS,VAPID_PUBLIC_KEY,VAPID_SUBJECT,TRUSTED_*,SMTP_BCC,GRANT_OWNER_IDS,*_ROLES,*_DOLLARS,*_CHANNELS,*_HOST,OAUTH_*,POSTHOG_KEY
                - name: ALERTMANAGER_URL
                  value: http://kps-alertmanager.monitoring.svc:9093
                - name: STATE_CONFIGMAP
                  value: image-secret-scan-state
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
              envFrom: [{ secretRef: { name: image-secret-scan } }]
              resources:
                requests: { cpu: 200m, memory: 128Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - { name: app, mountPath: /app }
                - { name: unorouter-env, mountPath: /secrets/unorouter-env, readOnly: true }
                - { name: bot-env, mountPath: /secrets/bot-env, readOnly: true }
                - { name: newapi-env, mountPath: /secrets/newapi-env, readOnly: true }
          volumes:
            - name: app
              configMap: { name: image-secret-scan }
            - name: unorouter-env
              secret: { secretName: image-secret-scan-unorouter-env }
            - name: bot-env
              secret: { secretName: image-secret-scan-bot-env }
            - name: newapi-env
              secret: { secretName: image-secret-scan-newapi-env }
