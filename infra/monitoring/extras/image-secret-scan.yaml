# Every 15 minutes: for each public org package, pull every layer of the newest tags
# that were not scanned yet and search every file for secret material: known key
# formats AND the live values of unorouter-env, bot-env and newapi-env (mounted here,
# only key NAMES are ever printed). A hit is posted to Discord. Background: on
# 2026-09-07 the "fixed" frontend image still carried the full .env in the layer that
# copied the standalone build; a later COPY over it hid the file from `cat` inside the
# container but not from anyone who pulls the image, since every layer ships. Checking
# the merged filesystem is not a check. Pattern rules skip vendored code and native
# binaries (sample strings); the live-value needles run on every byte of every file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-secret-scan
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: image-secret-scan
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK
      remoteRef: { key: alertmanager, property: discordWebhook }
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: ghcr-push, property: token }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-secret-scan
  namespace: monitoring
---
# scan state (digests already scanned) lives in a ConfigMap the job creates itself;
# it is deliberately not in git, ArgoCD would reset it on every sync
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-secret-scan
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-secret-scan
  namespace: monitoring
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: image-secret-scan }
subjects:
  - kind: ServiceAccount
    name: image-secret-scan
    namespace: monitoring
---
# needles come from every Secret in the application namespace, read at run time
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-secret-scan-needles
  namespace: services
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-secret-scan-needles
  namespace: services
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: image-secret-scan-needles }
subjects:
  - kind: ServiceAccount
    name: image-secret-scan
    namespace: monitoring
---
# packages to scan are discovered from what the cluster runs plus the org listing
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-secret-scan-images
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-secret-scan-images
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: image-secret-scan-images }
subjects:
  - kind: ServiceAccount
    name: image-secret-scan
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-secret-scan
  namespace: monitoring
data:
  scan.py: |
    import fnmatch, hashlib, io, json, os, re, tarfile, time, urllib.error, urllib.request, zlib

    ORG = os.environ.get("GITHUB_ORG", "unorouter")
    WINDOW = int(os.environ.get("SCAN_WINDOW", "5"))
    FILE_MAX = int(os.environ.get("FILE_MAX_BYTES", str(8 << 30)))
    NEEDLE_NS = [x for x in os.environ.get("NEEDLE_NAMESPACES", "services").split(",") if x]
    GENERATION = os.environ.get("SCAN_GENERATION", "1")
    TRUFFLEHOG = os.environ.get("TRUFFLEHOG", "")
    STATE_CM = os.environ.get("STATE_CONFIGMAP", "")
    NS = os.environ.get("POD_NAMESPACE", "monitoring")
    WEBHOOK = os.environ.get("DISCORD_WEBHOOK", "")
    GH = os.environ["GITHUB_TOKEN"]
    UA = {"user-agent": "image-secret-scan/2"}
    CHUNK = 4 << 20
    OVERLAP = 512

    # Structural shapes only; vendor key formats are TruffleHog's job (800+ detectors,
    # verified against the provider). These three are the ones no detector verifies.
    PATTERNS = [
        ("private key block", rb"-----BEGIN [A-Z ]*PRIVATE KEY-----\s*[A-Za-z0-9+/=\s]{64,}"),
        ("connection string with password", rb"(?:postgres|postgresql|mysql|redis|rediss|mongodb|amqp)://[^\s:/@]+:[^\s@/]{4,}@"),
        ("jwt", rb"eyJ[A-Za-z0-9_-]{15,}\.eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{20,}"),
    ]
    PATTERNS = [(n, re.compile(p)) for n, p in PATTERNS]
    ENV_FILE = re.compile(r"(^|/)\.env(\.[A-Za-z0-9_-]+)?$")
    DOC_NOISE = re.compile(r"/node_modules/|/usr/(lib|lib64|libexec|share|local/lib|local/bin)/|/lib/|/lib64/")
    ENV_FILE_OK = {".env.example", ".env.public", ".env.sample", ".env.template"}

    def http(url, headers=None, method="GET", data=None, timeout=60):
        req = urllib.request.Request(url, data=data, headers={**UA, **(headers or {})}, method=method)
        try:
            return urllib.request.urlopen(req, timeout=timeout)
        except urllib.error.HTTPError as e:
            return e

    def get_json(url, headers=None):
        r = http(url, headers)
        body = r.read()
        return r.status, (json.loads(body) if body else {})

    AM = os.environ.get("ALERTMANAGER_URL", "")

    # A finding is also raised as a critical Alertmanager alert (alertname ImageSecretLeak),
    # which is what rings the phone; the Discord post above carries the detail. endsAt keeps
    # it firing for 40 minutes, every run re-posts it while the version still exists.
    def page(alertname, summary):
        if not AM:
            print("PAGE:", alertname, summary)
            return
        now = time.time()
        fmt = lambda t: time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(t))
        body = json.dumps([{"labels": {"alertname": alertname, "severity": "critical", "source": "image-secret-scan"},
                            "annotations": {"summary": summary[:500]},
                            "startsAt": fmt(now), "endsAt": fmt(now + 2400)}]).encode()
        r = http(AM.rstrip("/") + "/api/v2/alerts", {"content-type": "application/json"}, "POST", body)
        if r.status not in (200, 202):
            print(f"alertmanager post failed HTTP {r.status}", flush=True)

    def post(text):
        if not WEBHOOK:
            print("DISCORD:", text)
            return
        body = json.dumps({"username": "image secret scan", "content": text[:1900]}).encode()
        http(WEBHOOK, {"content-type": "application/json"}, "POST", body).read()

    PUBLIC_NAME = re.compile(r"PUBLIC|PUBLISHABLE", re.I)
    KV_LINE = re.compile(r"^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_.-]*)\s*[=:]\s*(.+?)\s*$", re.M)

    def secretish(val):
        s = val.decode(errors="replace")
        if len(val) < 16 or not re.search(r"[A-Za-z]", s) or re.fullmatch(r"[0-9,\s]+", s):
            return False
        if re.fullmatch(r"[a-z+]+://[^@]*", s):
            return False
        return True

    def values_of(name, raw):
        """One needle per secret-looking value; multi-line values (config files, dockerconfig)
        are split into their own lines so an embedded key still matches."""
        raw = raw.strip()
        if b"\n" not in raw and not raw.startswith(b"{"):
            yield name, raw
            return
        for m in KV_LINE.finditer(raw.decode(errors="replace")):
            v = m.group(2).strip().strip("\"'").rstrip(",")
            yield f"{name}#{m.group(1)}", v.encode()
        for v in re.findall(r'"(?:auth|password|token|secret)"\s*:\s*"([^"]+)"', raw.decode(errors="replace")):
            yield f"{name}#json", v.encode()

    # needles: every live secret value the images must not contain, read from the Secrets
    # of the application namespaces. Only the key NAME is ever printed. Public by
    # construction: keys whose name says PUBLIC, values equal to one of those, and any
    # value the owning repo lists in its .env.public.
    def load_needles(public_values):
        import base64
        needles, public = {}, set(public_values)
        for ns in NEEDLE_NS:
            st, lst = k8s("GET", f"/api/v1/namespaces/{ns}/secrets")
            if st != 200:
                raise RuntimeError(f"list secrets in {ns}: HTTP {st}")
            for sec in lst.get("items", []):
                if sec.get("type", "").startswith("kubernetes.io/service-account-token") or sec.get("type", "").startswith("helm.sh/"):
                    continue
                sname = sec["metadata"]["name"]
                for key, b64 in (sec.get("data") or {}).items():
                    raw = base64.b64decode(b64)
                    for label, val in values_of(f"{ns}/{sname}/{key}", raw):
                        if not secretish(val):
                            continue
                        if PUBLIC_NAME.search(label.rsplit("/", 1)[-1]):
                            public.add(val)
                            continue
                        needles.setdefault(val, label)
        return {v: k for v, k in needles.items() if v not in public}

    def repo_public_values(repo):
        """Values a repo declares public in its .env.public (served, inlined or otherwise
        visible by design). No file means nothing is declared."""
        if not repo:
            return set()
        r = http(f"https://api.github.com/repos/{repo}/contents/.env.public",
                 {"authorization": "Bearer " + GH, "accept": "application/vnd.github.raw+json"})
        if r.status != 200:
            return set()
        return {v.strip().strip("\"'").encode() for _, v in KV_LINE.findall(r.read().decode(errors="replace"))}

    def low_entropy(m):
        s = m.decode(errors="replace")
        return len(set(s)) < 8 or re.search(r"(.)\1{7,}", s) is not None

    class Scanner:
        def __init__(self, needles):
            self.needles = needles
            self.hits = []          # (where, kind, masked)
            self.seen = set()
            self.files = 0
            self.skipped_big = 0
            self.bytes = 0

        def add(self, where, kind, sample):
            k = (where, kind, sample)
            if k in self.seen:
                return
            self.seen.add(k)
            self.hits.append((where, kind, sample))

        def scan_bytes(self, where, buf, patterns=True):
            for name, rx in (PATTERNS if patterns and not DOC_NOISE.search(where) else []):
                for m in rx.finditer(buf):
                    g = m.group(0)
                    if low_entropy(g):
                        continue
                    self.add(where, name, f"{g[:6].decode(errors='replace')}… ({len(g)} chars)")
            for val, key in self.needles.items():
                if val in buf:
                    self.add(where, "LIVE SECRET VALUE", key)

        def scan_stream(self, where, fobj, size):
            if size > FILE_MAX:
                self.skipped_big += 1
                return
            self.files += 1
            tail = b""
            patterns = True
            while True:
                chunk = fobj.read(CHUNK)
                if not chunk:
                    break
                if not tail:
                    patterns = not chunk.startswith(b"\x7fELF")
                self.bytes += len(chunk)
                self.scan_bytes(where, tail + chunk, patterns)
                tail = chunk[-OVERLAP:]

        def scan_layer(self, where, raw, media_type):
            if media_type.endswith("zstd"):
                from compression import zstd
                fobj = zstd.ZstdFile(raw)
            elif media_type.endswith("gzip") or media_type.endswith("tar+gzip"):
                fobj = io.BufferedReader(GzipStream(raw))
            else:
                fobj = raw
            with tarfile.open(fileobj=fobj, mode="r|") as tar:
                for m in tar:
                    if not m.isfile():
                        continue
                    path = "/" + m.name.lstrip("./")
                    base = path.rsplit("/", 1)[-1]
                    if ENV_FILE.search(path) and base not in ENV_FILE_OK:
                        f = tar.extractfile(m)
                        data = f.read(1 << 20) if f else b""
                        keys = re.findall(rb"^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=", data, re.M)
                        secretish = [k.decode() for k in keys if not k.startswith(b"NEXT_PUBLIC_")]
                        if secretish:
                            self.add(f"{where}:{path}", "env file with non public keys", ", ".join(secretish[:12]) + (" …" if len(secretish) > 12 else ""))
                        self.scan_bytes(f"{where}:{path}", data)
                        continue
                    f = tar.extractfile(m)
                    if f:
                        self.scan_stream(f"{where}:{path}", f, m.size)

    class GzipStream(io.RawIOBase):
        def __init__(self, raw):
            self.raw = raw
            self.d = zlib.decompressobj(16 + zlib.MAX_WBITS)
            self.buf = b""
            self.eof = False
        def readable(self):
            return True
        def readinto(self, b):
            while not self.buf and not self.eof:
                c = self.raw.read(1 << 20)
                if not c:
                    self.eof = True
                    self.buf = self.d.flush()
                    break
                self.buf = self.d.decompress(c)
            n = min(len(b), len(self.buf))
            b[:n] = self.buf[:n]
            self.buf = self.buf[n:]
            return n

    def registry_token(pkg):
        st, j = get_json(f"https://ghcr.io/token?scope=repository:{ORG}/{pkg}:pull&service=ghcr.io",
                         {"authorization": "Basic " + __import__("base64").b64encode(b"x:" + GH.encode()).decode()})
        if st != 200:
            raise RuntimeError(f"registry token for {pkg}: HTTP {st}")
        return j["token"]

    ACCEPT = ("application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, "
              "application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json")

    def scan_image(pkg, ref, tags, needles):
        tok = registry_token(pkg)
        h = {"authorization": "Bearer " + tok}
        st, idx = get_json(f"https://ghcr.io/v2/{ORG}/{pkg}/manifests/{ref}", {**h, "accept": ACCEPT})
        if st != 200:
            return None, f"manifest HTTP {st}"
        manifests = [m for m in idx.get("manifests", []) if m.get("platform", {}).get("os") not in (None, "unknown")] if "manifests" in idx else [{"digest": ref, "platform": {}}]
        sc = Scanner(needles)
        for m in manifests:
            arch = m.get("platform", {}).get("architecture", "")
            st, man = get_json(f"https://ghcr.io/v2/{ORG}/{pkg}/manifests/{m['digest']}", {**h, "accept": ACCEPT})
            if st != 200:
                sc.add(f"{arch}", "manifest fetch failed", f"HTTP {st}")
                continue
            cfg = man.get("config", {})
            if cfg.get("digest"):
                r = http(f"https://ghcr.io/v2/{ORG}/{pkg}/blobs/{cfg['digest']}", h)
                if r.status == 200:
                    c = json.loads(r.read())
                    envs = c.get("config", {}).get("Env") or []
                    sc.scan_bytes(f"{arch}:image config Env", "\n".join(envs).encode())
                    for hist in c.get("history", []):
                        sc.scan_bytes(f"{arch}:image history", (hist.get("created_by") or "").encode())
            for i, layer in enumerate(man.get("layers", [])):
                r = http(f"https://ghcr.io/v2/{ORG}/{pkg}/blobs/{layer['digest']}", h, timeout=300)
                if r.status != 200:
                    sc.add(f"{arch}:layer {i}", "layer fetch failed", f"HTTP {r.status}")
                    continue
                try:
                    sc.scan_layer(f"{arch}:layer{i}", r, layer.get("mediaType", ""))
                except Exception as e:
                    sc.add(f"{arch}:layer {i}", "layer unreadable", type(e).__name__)
        return sc, None

    def k8s(method, path, body=None):
        with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
            tok = f.read()
        import ssl
        ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
        host = os.environ["KUBERNETES_SERVICE_HOST"]
        req = urllib.request.Request(f"https://{host}{path}", data=body, method=method,
                                     headers={**UA, "authorization": "Bearer " + tok, "content-type": "application/merge-patch+json" if method == "PATCH" else "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                return r.status, json.loads(r.read() or b"{}")
        except urllib.error.HTTPError as e:
            return e.code, {}

    def load_state():
        if not STATE_CM:
            p = os.environ.get("STATE_FILE", "state.json")
            return json.load(open(p)) if os.path.exists(p) else {}
        st, cm = k8s("GET", f"/api/v1/namespaces/{NS}/configmaps/{STATE_CM}")
        if st == 404:
            return {}
        return json.loads(cm.get("data", {}).get("state", "{}"))

    def save_state(state):
        if not STATE_CM:
            json.dump(state, open(os.environ.get("STATE_FILE", "state.json"), "w"), indent=1)
            return
        body = json.dumps({"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": STATE_CM, "namespace": NS}, "data": {"state": json.dumps(state)}}).encode()
        st, _ = k8s("PATCH", f"/api/v1/namespaces/{NS}/configmaps/{STATE_CM}", body)
        if st == 404:
            st, _ = k8s("POST", f"/api/v1/namespaces/{NS}/configmaps", body)
        if st not in (200, 201):
            print(f"state save failed HTTP {st}", flush=True)

    def discover_packages():
        """Union of the org's container packages (API) and every ghcr image the cluster
        runs or schedules; the API omits packages reachable only through repository
        access, the cluster misses packages nothing deploys."""
        ghh = {"authorization": "Bearer " + GH, "accept": "application/vnd.github+json"}
        pkgs = {}
        st, lst = get_json(f"https://api.github.com/orgs/{ORG}/packages?package_type=container&per_page=100", ghh)
        if st == 200:
            for p in lst:
                pkgs[p["name"]] = {"visibility": p.get("visibility"), "repo": (p.get("repository") or {}).get("full_name")}
        else:
            print(f"org package listing HTTP {st}", flush=True)
        images = set()
        st, pods = k8s("GET", "/api/v1/pods")
        for pod in pods.get("items", []) if st == 200 else []:
            for c in (pod["spec"].get("containers") or []) + (pod["spec"].get("initContainers") or []):
                images.add(c["image"])
        st, cjs = k8s("GET", "/apis/batch/v1/cronjobs")
        for cj in cjs.get("items", []) if st == 200 else []:
            for c in cj["spec"]["jobTemplate"]["spec"]["template"]["spec"].get("containers") or []:
                images.add(c["image"])
        prefix = f"ghcr.io/{ORG}/"
        for img in images:
            if img.startswith(prefix):
                name = img[len(prefix):].split("@")[0].split(":")[0]
                if name not in pkgs:
                    st, p = get_json(f"https://api.github.com/orgs/{ORG}/packages/container/{name}", ghh)
                    pkgs[name] = {"visibility": p.get("visibility") if st == 200 else None,
                                  "repo": (p.get("repository") or {}).get("full_name") if st == 200 else None}
        return pkgs

    def trufflehog_scan(pkg, digest):
        """Vendor formats with live verification. Verified findings page; unknown ones
        (provider unreachable) are reported without paging. Runs once per new version."""
        if not TRUFFLEHOG:
            return [], []
        import subprocess
        cmd = [TRUFFLEHOG, "docker", f"--image=ghcr.io/{ORG}/{pkg}@{digest}", "--json", "--no-update",
               "--results=verified,unknown", "--concurrency=1"]
        # Go keeps the whole pulled image around until the GC feels like it (1.3 GiB
        # peak on a 100 MB image); a hard heap target keeps it under the pod limit.
        env = {**os.environ, "GOMEMLIMIT": "600MiB", "GOGC": "50"}
        try:
            out = subprocess.run(cmd, capture_output=True, timeout=600, env=env)
        except subprocess.TimeoutExpired:
            return [], [("trufflehog", "timeout", pkg)]
        verified, unknown = [], []
        for line in out.stdout.decode(errors="replace").splitlines():
            try:
                j = json.loads(line)
            except ValueError:
                continue
            det = j.get("DetectorName") or j.get("DetectorType")
            if not det:
                continue
            where = (j.get("SourceMetadata") or {}).get("Data", {}).get("Docker", {})
            loc = f"{where.get('file', '?')} layer {str(where.get('layer', ''))[:19]}"
            (verified if j.get("Verified") else unknown).append((loc, f"{det} (verified)" if j.get("Verified") else f"{det} (unverified)", (j.get("Redacted") or "")[:24]))
        if out.returncode not in (0, 183):
            unknown.append(("trufflehog", f"exit {out.returncode}", out.stderr.decode(errors="replace")[-160:]))
        return verified, unknown

    def main():
        pkgs = discover_packages()
        public_values = set()
        for meta in pkgs.values():
            public_values |= repo_public_values(meta.get("repo"))
        needles = load_needles(public_values)
        print(f"needles={len(needles)} public_values={len(public_values)} packages={sorted(pkgs)} window={WINDOW} gen={GENERATION}", flush=True)
        state = load_state()
        ghh = {"authorization": "Bearer " + GH, "accept": "application/vnd.github+json"}
        report = []
        scanned = 0
        for pkg in sorted(pkgs):
            st, versions = get_json(f"https://api.github.com/orgs/{ORG}/packages/container/{pkg}/versions?per_page=100", ghh)
            if st != 200:
                report.append(f"`{ORG}/{pkg}`: cannot list versions (HTTP {st})")
                continue
            tagged = [v for v in versions if v.get("metadata", {}).get("container", {}).get("tags")]
            tagged.sort(key=lambda v: v["created_at"], reverse=True)
            for v in tagged[:WINDOW]:
                digest = v["name"]
                tags = [t for t in v["metadata"]["container"]["tags"] if t not in ("latest", "buildcache")] or v["metadata"]["container"]["tags"]
                key = f"{pkg}@{digest}"
                if key in state and state[key].get("gen") == GENERATION:
                    if state[key].get("verdict") == "hit":
                        report.append(f"`{ORG}/{pkg}:{tags[0][:12]}`: STILL PRESENT, scanned {time.strftime('%Y-%m-%d %H:%M', time.gmtime(state[key]['t']))}Z, {state[key]['hits']} findings ({', '.join(state[key].get('what', []))}); delete the version")
                    continue
                t0 = time.time()
                sc, err = scan_image(pkg, digest, tags, needles)
                scanned += 1
                if err:
                    report.append(f"`{ORG}/{pkg}:{tags[0][:12]}`: {err}")
                    continue
                verified, unknown = trufflehog_scan(pkg, digest)
                hits = sc.hits + verified
                verdict = "hit" if hits else "clean"
                state[key] = {"t": int(time.time()), "gen": GENERATION, "tags": tags[:3], "verdict": verdict, "hits": len(hits),
                              "what": sorted({kind for _, kind, _ in hits})[:6]}
                print(f"{pkg}:{tags[0][:12]} {verdict} files={sc.files} bytes={sc.bytes} big_skipped={sc.skipped_big} hits={len(hits)} unverified={len(unknown)} {time.time()-t0:.0f}s", flush=True)
                for where, kind, sample in unknown[:5]:
                    print(f"  unverified: {kind} {sample} at {where}", flush=True)
                if hits:
                    lines = [f"**`{ORG}/{pkg}:{tags[0][:12]}`** ({len(hits)} findings, package {pkgs[pkg].get('visibility')})"]
                    for where, kind, sample in hits[:15]:
                        lines.append(f"  {kind}: {sample} at {where}")
                    if len(hits) > 15:
                        lines.append(f"  … {len(hits) - 15} more")
                    report.append("\n".join(lines))
                save_state(state)
                if not STATE_CM:
                    with open(f"hits-{pkg}-{tags[0][:12]}.txt", "w") as f:
                        f.writelines(f"{kind}\t{sample}\t{where}\n" for where, kind, sample in hits)
        if report:
            page("ImageSecretLeak", f"{len(report)} image(s) carry secret material: " + "; ".join(r.split("\n")[0].replace("*", "") for r in report)[:400])
            post("**image secret scan: a container image carries secret material**\n" + "\n".join(report)
                 + "\nAction: make the package private NOW (github.com/orgs/" + ORG + "/packages/container/<name>/settings), delete the version, rotate every named key, fix the Dockerfile.")
        print(f"scanned={scanned} findings={len(report)} state={len(state)}", flush=True)

    main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-secret-scan
  namespace: monitoring
spec:
  schedule: "7,22,37,52 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 840
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: image-secret-scan
          initContainers:
            # vendor key formats with live verification; the binary is copied out of the
            # upstream image so the scan container stays plain python
            - name: trufflehog
              image: trufflesecurity/trufflehog:3.97.4
              command: ["cp", "/usr/bin/trufflehog", "/tools/trufflehog"]
              volumeMounts: [{ name: tools, mountPath: /tools }]
          containers:
            - name: scan
              image: python:3.14-alpine
              command: ["python3", "-u", "/app/scan.py"]
              env:
                - name: GITHUB_ORG
                  value: unorouter
                # newest tagged versions per package considered each run
                - name: SCAN_WINDOW
                  value: "5"
                # every Secret here is a needle (public ones derived, never listed)
                - name: NEEDLE_NAMESPACES
                  value: services
                # bump to rescan every version already marked clean
                - name: SCAN_GENERATION
                  value: "2"
                - name: TRUFFLEHOG
                  value: /tools/trufflehog
                - name: ALERTMANAGER_URL
                  value: http://kps-alertmanager.monitoring.svc:9093
                - name: STATE_CONFIGMAP
                  value: image-secret-scan-state
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
              envFrom: [{ secretRef: { name: image-secret-scan } }]
              resources:
                requests: { cpu: 200m, memory: 256Mi }
                # trufflehog needs ~900Mi on top of the scanner's ~40Mi
                limits: { memory: 1536Mi }
              volumeMounts:
                - { name: app, mountPath: /app }
                - { name: tools, mountPath: /tools }
          volumes:
            - name: app
              configMap: { name: image-secret-scan }
            - name: tools
              emptyDir: {}
