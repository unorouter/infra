    """Durable, sanitized Kubernetes audit collection with guarded canary containment."""
    import datetime as dt
    import hashlib
    import re
    import gzip
    import hmac
    import http.server
    import json
    import os
    from pathlib import Path
    import sqlite3
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request


    def encode(value):
        return json.dumps(value, sort_keys=True, separators=(',', ':')).encode()


    def sanitize(event):
        # Deliberate allowlist: no URI queries, exec arguments, body, status message,
        # annotations, arbitrary user extras or authorization headers cross this boundary.
        out = {k: event[k] for k in ('auditID', 'stage', 'verb', 'requestReceivedTimestamp',
               'stageTimestamp', 'sourceIPs') if k in event}
        for key in ('user', 'impersonatedUser'):
            value = event.get(key) or {}
            out[key] = {k: value[k] for k in ('username', 'uid', 'groups') if k in value}
            extras = value.get('extra') or {}
            allowed = ('authentication.kubernetes.io/credential-id', 'authentication.kubernetes.io/pod-name',
                       'authentication.kubernetes.io/pod-uid', 'authentication.kubernetes.io/node-name',
                       'authentication.kubernetes.io/node-uid')
            retained = {k: extras[k] for k in allowed if k in extras}
            if retained:
                out[key]['extra'] = retained
        ref = event.get('objectRef') or {}
        out['objectRef'] = {k: ref[k] for k in ('resource', 'namespace', 'name', 'uid',
                            'apiGroup', 'apiVersion', 'resourceVersion', 'subresource') if k in ref}
        out['responseCode'] = (event.get('responseStatus') or {}).get('code')
        return out


    def container_record(raw, source):
        # CRI envelope is retained, payloads use source-specific allowlists.
        parts = raw.decode('utf-8', errors='replace').split(' ', 3)
        if len(parts) != 4 or parts[2] != 'F':
            return {'collectionGap': 'partial_or_invalid_cri_record'}
        stamp, stream, _, payload = parts
        # The gateway writes hundreds of lines a second and only security.* events are
        # kept; a substring test is far cheaper than parsing each line's JSON.
        if source.startswith(('gateway-', 'bot-')) and 'security.' not in payload:
            return None
        result = {'timestamp': stamp, 'stream': stream}
        marker = 'SECURITY_EVIDENCE '
        if marker in payload:
            payload = payload.split(marker, 1)[1]
        try:
            event = json.loads(payload)
        except ValueError:
            return None
        if not isinstance(event, dict):
            return None
        if source.startswith('openbao-'):
            request = event.get('request') or {}
            auth = event.get('auth') or {}
            result.update(type=event.get('type'), time=event.get('time'), error_present=bool(event.get('error')),
                          request={k: request[k] for k in ('id','operation','path','remote_address','remote_port','mount_type') if k in request},
                          auth={k: auth[k] for k in ('display_name','entity_id','policies','token_type','accessor') if k in auth})
            return result if request.get('id') else None
        if source.startswith(('gateway-', 'bot-')):
            if not str(event.get('event', '')).startswith('security.'):
                return None
            fields = ('event','audit_key_version','audit_credential_fingerprint','credential_kind',
                      'fingerprint_status','user_id','role','auth_method','principal_kind','source_ip','trusted_network',
                      'method','route','pod_uid','scope','attempt_id','route_kind','channel_id','message_id','build','outcome','time')
            result.update({k: event[k] for k in fields if k in event})
            return result
        if source.startswith('postgres-'):
            record = event.get('record') or {}
            # CNPG wraps PostgreSQL CSV/JSON logs. Only AUDIT entries with SQL text
            # disabled are accepted; statements and query fields are never copied.
            audit = record.get('audit')
            if isinstance(audit, dict):
                # CNPG emits structured pgaudit records, without a message field.
                result['audit'] = {k: audit[k] for k in ('audit_type', 'statement_id',
                    'substatement_id', 'class', 'command', 'object_type', 'object_name') if k in audit}
            else:
                message = record.get('message', '')
                if not message.startswith('AUDIT: '):
                    return None
                import csv
                fields = next(csv.reader([message[7:]]))
                result['audit'] = fields[:7]
            result['database'] = {k: record[k] for k in ('user_name','database_name','process_id','connection_from','session_id','application_name','transaction_id') if k in record}
            return result
        if source.startswith('teleport-'):
            if not event.get('event'):
                return None
            fields = ('event','code','time','uid','user','login','addr.remote','addr.local','server_id','sid','db.service','db.protocol','db.user','db.name','success')
            result.update({k: event[k] for k in fields if k in event})
            return result
        return None


    def workload_snapshot(event, obj=None):
        ref = event.get('objectRef') or {}
        resource = ref.get('resource')
        if resource not in ('pods', 'deployments', 'daemonsets', 'statefulsets', 'replicasets',
                            'jobs', 'cronjobs', 'externalsecrets', 'secretstores', 'clustersecretstores'):
            return None
        if event.get('verb') not in ('create', 'update', 'patch', 'delete') or not ref.get('name'):
            return None
        if os.environ.get('SNAPSHOTS_ENABLED') != 'true':
            return {'status': 'disabled'}
        import ssl
        observed_in_watch = obj is not None
        base = Path('/var/run/secrets/kubernetes.io/serviceaccount')
        group = ref.get('apiGroup', '')
        version = ref.get('apiVersion', 'v1')
        path = '/apis/' + group + '/' + version if group else '/api/' + version
        if ref.get('namespace'):
            path += '/namespaces/' + urllib.parse.quote(ref['namespace'], safe='')
        path += '/' + resource + '/' + urllib.parse.quote(ref['name'], safe='')
        try:
            if obj is None:
                request = urllib.request.Request('https://kubernetes.default.svc' + path,
                    headers={'Authorization': 'Bearer ' + (base / 'token').read_text().strip()})
                with urllib.request.urlopen(request, context=ssl.create_default_context(cafile=str(base / 'ca.crt')), timeout=3) as response:
                    obj = json.load(response)
            meta = obj.get('metadata', {})
            if ref.get('uid') and meta.get('uid') != ref['uid']:
                return {'status': 'uid_mismatch'}
            result = {'status': 'watch_observed' if observed_in_watch else 'observed_after_event', 'observedAt': time.time(),
                      'uid': meta.get('uid'), 'resourceVersion': meta.get('resourceVersion'),
                      'deletionTimestamp': meta.get('deletionTimestamp'),
                      'owners': [{k: o[k] for k in ('apiVersion','kind','name','uid','controller') if k in o}
                                 for o in meta.get('ownerReferences', [])]}
            spec = obj.get('spec', {})
            if resource == 'cronjobs':
                spec = spec.get('jobTemplate', {}).get('spec', {})
            pod = spec.get('template', {}).get('spec', spec)
            result['serviceAccountName'] = pod.get('serviceAccountName', 'default')
            result['containers'] = []
            for kind in ('containers', 'initContainers', 'ephemeralContainers'):
                for container in pod.get(kind, []):
                    entry = {'kind': kind, 'name': container.get('name'), 'image': container.get('image'),
                             'envSecrets': [], 'envFromSecrets': [],
                             'commandSha256': hashlib.sha256(encode([container.get('command'), container.get('args')])).hexdigest()}
                    for env in container.get('env', []):
                        secret = env.get('valueFrom', {}).get('secretKeyRef')
                        if secret:
                            entry['envSecrets'].append({'env': env.get('name'), 'name': secret.get('name'), 'key': secret.get('key')})
                    entry['envFromSecrets'] = [e['secretRef'].get('name') for e in container.get('envFrom', []) if 'secretRef' in e]
                    result['containers'].append(entry)
            result['volumeSecrets'] = []
            for volume in pod.get('volumes', []):
                if 'secret' in volume:
                    result['volumeSecrets'].append(volume['secret'].get('secretName'))
                for source in volume.get('projected', {}).get('sources', []):
                    if 'secret' in source:
                        result['volumeSecrets'].append(source['secret'].get('name'))
            result['imageIDs'] = [item.get('imageID') for kind in ('containerStatuses', 'initContainerStatuses')
                                  for item in obj.get('status', {}).get(kind, []) if item.get('imageID')]
            if resource == 'externalsecrets':
                result['secretStoreRef'] = spec.get('secretStoreRef')
                result['targetName'] = spec.get('target', {}).get('name', meta.get('name'))
                result['remoteRefs'] = [{k: item.get('remoteRef', {}).get(k) for k in ('key', 'property', 'version')}
                                         for item in spec.get('data', [])]
                result['extractKeys'] = [item.get('extract', {}).get('key') for item in spec.get('dataFrom', [])]
            return result
        except urllib.error.HTTPError as error:
            return {'status': 'unavailable', 'httpStatus': error.code}
        except Exception as error:
            return {'status': 'collection_error', 'errorType': type(error).__name__}


    class Queue:
        def __init__(self, path, limit=256 * 1024 * 1024):
            self.db = sqlite3.connect(path)
            self.db.execute('PRAGMA journal_mode=WAL')
            self.db.execute('PRAGMA synchronous=FULL')
            self.db.execute('PRAGMA temp_store=MEMORY')
            self.db.executescript('''
              CREATE TABLE IF NOT EXISTS state (key TEXT PRIMARY KEY, value TEXT NOT NULL);
              CREATE TABLE IF NOT EXISTS pending (id TEXT PRIMARY KEY, body BLOB NOT NULL,
                created REAL NOT NULL, archived INTEGER NOT NULL DEFAULT 0);
              CREATE TABLE IF NOT EXISTS seen (id TEXT PRIMARY KEY, created REAL NOT NULL);
              CREATE INDEX IF NOT EXISTS pending_delivery ON pending(created,id);
              CREATE INDEX IF NOT EXISTS seen_created ON seen(created);
            ''')
            self.limit = limit
            self.backlog = {}
            self.drained = {}
            with self.db:
                self.db.execute("INSERT OR IGNORE INTO state VALUES ('started', ?)", (str(time.time()),))

        def state(self, key, default=None):
            row = self.db.execute('SELECT value FROM state WHERE key=?', (key,)).fetchone()
            return json.loads(row[0]) if row else default

        def enqueue(self, entries, key=None, checkpoint=None):
            size = self.db.execute('SELECT COALESCE(SUM(length(body)),0) FROM pending').fetchone()[0]
            if size + sum(len(encode(e)) for e in entries) > self.limit:
                raise RuntimeError('queue capacity reached; source checkpoint retained')
            with self.db:
                for entry in entries:
                    eid = entry['id']
                    if self.db.execute('SELECT 1 FROM seen WHERE id=?', (eid,)).fetchone():
                        continue
                    self.db.execute('INSERT OR IGNORE INTO pending(id,body,created) VALUES(?,?,?)',
                                    (eid, encode(entry), time.time()))
                if key is not None:
                    self.db.execute('INSERT OR REPLACE INTO state VALUES (?,?)', (key, json.dumps(checkpoint)))

        def deliver(self, archive, notify, limit=1000):
            rows = self.db.execute(
                'SELECT id,body,archived FROM pending ORDER BY created,id LIMIT ?', (limit,)).fetchall()
            unarchived = [(eid, body) for eid, body, archived in rows if not archived]
            if unarchived:
                events = [json.loads(body) for _, body in unarchived]
                if len(events) == 1:
                    archive(events[0], unarchived[0][1])
                else:
                    body = encode({'schema': 1, 'records': events})
                    batch = {'id': hashlib.sha256(body).hexdigest(), 'source': events[0]['source']}
                    archive(batch, body)
                with self.db:
                    self.db.executemany('UPDATE pending SET archived=1 WHERE id=?',
                                        [(eid,) for eid, _ in unarchived])
            if rows:
                notify([json.loads(body) for _, body, _ in rows])
                with self.db:
                    for eid, _, _ in rows:
                        self.db.execute('INSERT OR IGNORE INTO seen VALUES (?,?)', (eid, time.time()))
                        self.db.execute('DELETE FROM pending WHERE id=?', (eid,))

        def ingest_file(self, path, source, max_lines=10000, container=False, flow=False):
            stat = path.stat()
            key = 'file:' + str(stat.st_dev) + ':' + str(stat.st_ino)
            # A rotated .gz never changes again, and seeking into one inflates it from the
            # start: re-reading every retained archive each second was most of the CPU
            # this DaemonSet used. Once read to its end it is only opened again if the
            # inode was reused for different bytes.
            if path.suffix == '.gz' and self.state(key + ':eof') == [stat.st_size, stat.st_mtime_ns]:
                return 0
            # Most files are idle on any given second. Reopening, seeking and committing a
            # checkpoint for each of them every poll was the bulk of what this loop did.
            if self.drained.get(key) == [stat.st_size, stat.st_mtime_ns]:
                return 0
            pos = self.state(key, 0)
            entries = []
            with (gzip.open(path, 'rb') if path.suffix == '.gz' else path.open('rb')) as stream:
                first = stream.readline()
                if not first.endswith(b'\n'):
                    return 0
                signature = hashlib.sha256(first).hexdigest()
                previous = self.state(key + ':first')
                reset = pos and (previous != signature or (path.suffix != '.gz' and stat.st_size < pos))
                if reset:
                    # Inodes are reused by container log rotation. Replay retained
                    # bytes and deduplicate event IDs, never silently skip a new file.
                    reason = 'file_replaced_or_truncated' if previous else 'legacy_checkpoint_replayed'
                    gap = {'collectionGap': reason, 'previousOffset': pos,
                           'fileName': path.name, 'firstRecordSha256': signature}
                    entries.append({'id': hashlib.sha256(encode([source, key, gap])).hexdigest(),
                                    'source': source, 'historical': True, 'event': gap})
                    pos = 0
                stream.seek(pos)
                # containerd splits a log line over 16 KiB into P records followed by one F
                # record. Join them back into the record they belong to; the checkpoint never
                # advances past an incomplete run, so a poll boundary cannot lose a piece.
                partial, partial_pos = b'', None
                for _ in range(max_lines):
                    raw = stream.readline()
                    if not raw or not raw.endswith(b'\n'):
                        break
                    if container:
                        parts = raw.split(b' ', 3)
                        if len(parts) == 4 and parts[2] == b'P':
                            if partial_pos is None:
                                partial_pos = pos
                            partial += parts[3].rstrip(b'\n')
                            pos = stream.tell()
                            continue
                        if partial and len(parts) == 4:
                            raw = b' '.join(parts[:3]) + b' ' + partial + parts[3]
                        partial, partial_pos = b'', None
                    pos = stream.tell()
                    digest = hashlib.sha256(raw).hexdigest()
                    try:
                        if flow:
                            payload = json.loads(raw)
                            payload = payload.get('flow', payload)
                            safe = {k: payload[k] for k in ('time','verdict','IP','l4','node_name','traffic_direction','drop_reason_desc') if k in payload}
                            for side in ('source','destination'):
                                safe[side] = {k: payload.get(side, {})[k] for k in ('namespace','pod_name','identity') if k in payload.get(side, {})}
                            event = {'auditID': digest, 'stageTimestamp': safe.get('time')}
                        elif container:
                            safe = container_record(raw, source)
                            if safe is None:
                                continue
                            event = {'auditID': digest, 'stageTimestamp': safe.get('timestamp')}
                        else:
                            event = json.loads(raw)
                            safe = sanitize(event)
                        eid = hashlib.sha256(encode([source, event.get('auditID', digest),
                                                    event.get('stage', '')])).hexdigest()
                        stamp = event.get('stageTimestamp') or event.get('requestReceivedTimestamp')
                        historical = not stamp or dt.datetime.fromisoformat(stamp.replace('Z', '+00:00')).timestamp() < self.state('started')
                        if not historical:
                            snapshot = workload_snapshot(event)
                            if snapshot is not None:
                                safe['snapshot'] = snapshot
                    except (ValueError, TypeError, AttributeError):
                        safe = {'collectionGap': 'unparseable_record', 'sha256': digest}
                        eid, historical = digest, True
                    entries.append({'id': eid, 'source': source, 'historical': historical,
                                    'rawSha256': digest, 'event': safe})
                next_line = stream.readline(1048576)
                if next_line:
                    try:
                        if container:
                            stamp = next_line.decode('utf-8', errors='replace').split(' ', 1)[0]
                        else:
                            unread = json.loads(next_line)
                            unread = unread.get('flow', unread) if flow else unread
                            stamp = unread.get('stageTimestamp') or unread.get('requestReceivedTimestamp') or unread.get('time')
                        oldest = dt.datetime.fromisoformat(stamp.replace('Z', '+00:00')).timestamp()
                    except (ValueError, TypeError, AttributeError):
                        oldest = self.backlog.get(key, time.time())
                    self.backlog[key] = oldest
                else:
                    self.backlog.pop(key, None)
            if partial:
                pos = partial_pos
            self.enqueue(entries, key, pos)
            if not next_line and not partial:
                self.drained[key] = [stat.st_size, stat.st_mtime_ns]
                if path.suffix == '.gz':
                    with self.db:
                        self.db.execute('INSERT OR REPLACE INTO state VALUES (?,?)',
                                        (key + ':eof', json.dumps([stat.st_size, stat.st_mtime_ns])))
            for reason in (e['event'].get('collectionGap') for e in entries):
                if reason:
                    METRICS['gaps_total'] += 1
                    METRICS['gaps_' + reason + '_total'] = METRICS.get('gaps_' + reason + '_total', 0) + 1
            # Persist after enqueue. A crash between commits causes safe replay.
            with self.db:
                self.db.execute('INSERT OR REPLACE INTO state VALUES (?,?)',
                                (key + ':first', json.dumps(signature)))
            return len(entries)


    def archive_s3(event, body, prefix="streams"):
        endpoint = os.environ['ARCHIVE_ENDPOINT'].rstrip('/')
        bucket = os.environ['ARCHIVE_BUCKET']
        # Stable object names and byte-identical retries survive a lost PUT response.
        path = '/' + bucket + '/' + prefix + '/' + event['source'] + '/' + event['id'] + '.json'
        now = dt.datetime.now(dt.timezone.utc)
        stamp, day = now.strftime('%Y%m%dT%H%M%SZ'), now.strftime('%Y%m%d')
        scope = day + '/auto/s3/aws4_request'
        digest = hashlib.sha256(body).hexdigest()
        host = urllib.parse.urlsplit(endpoint).netloc
        # Plain SigV4 to the s3-gateway, which encrypts on the way to the locked logs bucket.
        headers = {'host': host, 'x-amz-content-sha256': digest, 'x-amz-date': stamp}
        signed = ';'.join(sorted(headers))
        canonical = '\n'.join(['PUT', path, '', ''.join(k + ':' + headers[k] + '\n' for k in sorted(headers)), signed, digest])
        key = ('AWS4' + os.environ['ARCHIVE_SECRET_KEY']).encode()
        for part in (day, 'auto', 's3', 'aws4_request'):
            key = hmac.new(key, part.encode(), hashlib.sha256).digest()
        string = 'AWS4-HMAC-SHA256\n' + stamp + '\n' + scope + '\n' + hashlib.sha256(canonical.encode()).hexdigest()
        signature = hmac.new(key, string.encode(), hashlib.sha256).hexdigest()
        headers['Authorization'] = ('AWS4-HMAC-SHA256 Credential=' + os.environ['ARCHIVE_ACCESS_KEY'] + '/' + scope
                                    + ', SignedHeaders=' + signed + ', Signature=' + signature)
        headers['Content-Type'] = 'application/json'
        try:
            with urllib.request.urlopen(urllib.request.Request(endpoint + path, data=body, headers=headers, method='PUT'), timeout=20) as response:
                if response.status not in (200, 201):
                    raise RuntimeError('archive did not acknowledge PUT')
        except urllib.error.HTTPError as error:
            # Locked objects reject duplicate PUTs. Verify the existing bytes with a
            # signed GET before acknowledging; a 403 alone is never success.
            if error.code not in (403, 409, 412):
                raise
            digest = hashlib.sha256(b'').hexdigest()
            headers['x-amz-content-sha256'] = digest
            canonical = '\n'.join(['GET', path, '', ''.join(k + ':' + headers[k] + '\n' for k in ('host', 'x-amz-content-sha256', 'x-amz-date')), signed, digest])
            string = 'AWS4-HMAC-SHA256\n' + stamp + '\n' + scope + '\n' + hashlib.sha256(canonical.encode()).hexdigest()
            headers['Authorization'] = ('AWS4-HMAC-SHA256 Credential=' + os.environ['ARCHIVE_ACCESS_KEY'] + '/' + scope
                                        + ', SignedHeaders=' + signed + ', Signature=' + hmac.new(key, string.encode(), hashlib.sha256).hexdigest())
            with urllib.request.urlopen(urllib.request.Request(endpoint + path, headers=headers), timeout=20) as response:
                if response.read() != body:
                    raise RuntimeError('archive retry verification failed')


    def kube_request(path, method='GET', body=None):
        import ssl
        base = Path('/var/run/secrets/kubernetes.io/serviceaccount')
        headers = {'Authorization': 'Bearer ' + (base / 'token').read_text().strip(),
                   'Content-Type': 'application/json-patch+json' if method == 'PATCH' else 'application/json'}
        request = urllib.request.Request('https://kubernetes.default.svc' + path, method=method,
                                         headers=headers, data=encode(body) if body is not None else None)
        try:
            with urllib.request.urlopen(request, context=ssl.create_default_context(cafile=str(base / 'ca.crt')), timeout=5) as response:
                return json.load(response)
        except urllib.error.HTTPError as error:
            if error.code == 404 and method == 'GET':
                return None
            raise


    def quarantine_canary_workload(event):
        ev = event['event']
        ref = ev.get('objectRef') or {}
        snapshot = ev.get('snapshot') or {}
        if event['historical'] or ref.get('namespace') != 'services' or ref.get('resource') != 'pods':
            return None
        if ev.get('responseCode') not in (200, 201) or ev.get('verb') not in ('create','patch','update'):
            return None
        refs = list(snapshot.get('volumeSecrets', []))
        for container in snapshot.get('containers', []):
            refs.extend(container.get('envFromSecrets', []))
            refs.extend(item.get('name') for item in container.get('envSecrets', []))
        if 'credential-canary-v1' not in refs or not snapshot.get('uid'):
            return None
        archive_s3(event, encode(event), prefix='incidents')
        owners = snapshot.get('owners') or []
        if len(owners) != 1 or owners[0].get('kind') != 'Job' or not owners[0].get('uid'):
            return 'manual_review'
        if os.environ.get('AUTO_QUARANTINE') != 'true':
            return 'manual_review'
        path = '/api/v1/namespaces/services/pods/' + urllib.parse.quote(ref['name'], safe='')
        pod = kube_request(path)
        if not pod or pod['metadata']['uid'] != snapshot['uid']:
            return 'target_gone_or_replaced'
        live_owners = pod['metadata'].get('ownerReferences') or []
        if len(live_owners) != 1 or live_owners[0].get('uid') != owners[0]['uid'] or live_owners[0].get('kind') != 'Job':
            return 'manual_review'
        job = kube_request('/apis/batch/v1/namespaces/services/jobs/' + urllib.parse.quote(owners[0]['name'], safe=''))
        if not job or job['metadata']['uid'] != owners[0]['uid']:
            return 'manual_review'
        if any(owner.get('name') in ('new-api-sync', 'new-api-sync-full') for owner in job['metadata'].get('ownerReferences', [])):
            return 'protected_workload'
        spec = pod.get('spec', {})
        containers = spec.get('containers', []) + spec.get('initContainers', []) + spec.get('ephemeralContainers', [])
        live_refs = [v.get('secret', {}).get('secretName') for v in spec.get('volumes', [])]
        for volume in spec.get('volumes', []):
            live_refs.extend(v.get('secret', {}).get('name') for v in volume.get('projected', {}).get('sources', []))
        for container in containers:
            live_refs.extend(v.get('secretRef', {}).get('name') for v in container.get('envFrom', []))
            live_refs.extend(v.get('valueFrom', {}).get('secretKeyRef', {}).get('name') for v in container.get('env', []))
        if 'credential-canary-v1' not in live_refs:
            return 'canary_reference_no_longer_present'
        host_access = any(spec.get(k) for k in ('hostNetwork','hostPID','hostIPC')) or any('hostPath' in v for v in spec.get('volumes', []))
        host_access = host_access or any(c.get('securityContext', {}).get('privileged') or
            set(c.get('securityContext', {}).get('capabilities', {}).get('add', [])) & {'SYS_ADMIN','NET_ADMIN','ALL'} for c in containers)
        if host_access:
            return 'host_access_requires_manual_containment'
        uid = snapshot['uid']
        label = 'security.unorouter.com/quarantine-uid'
        labels = pod['metadata'].get('labels') or {}
        if labels.get(label) != uid:
            # UID and resourceVersion tests prevent acting on a replacement or a
            # concurrently changed pod. A conflict is retried from fresh metadata.
            patch = [{'op':'test','path':'/metadata/uid','value':uid},
                     {'op':'test','path':'/metadata/resourceVersion','value':pod['metadata']['resourceVersion']}]
            if 'labels' not in pod['metadata']:
                patch.append({'op':'add','path':'/metadata/labels','value':{label:uid}})
            else:
                patch.append({'op':'add','path':'/metadata/labels/security.unorouter.com~1quarantine-uid','value':uid})
            kube_request(path, 'PATCH', patch)
        name = 'evidence-' + hashlib.sha256(uid.encode()).hexdigest()[:32]
        policy_path = '/apis/cilium.io/v2/namespaces/services/ciliumnetworkpolicies'
        policy = {'apiVersion':'cilium.io/v2','kind':'CiliumNetworkPolicy',
                  'metadata':{'name':name,'namespace':'services'},
                  'spec':{'endpointSelector':{'matchLabels':{label:uid}},'egressDeny':[{'toEntities':['all']}]}}
        existing = kube_request(policy_path + '/' + name)
        if existing:
            if existing.get('spec') != policy['spec']:
                return 'policy_conflict_requires_manual_review'
        else:
            kube_request(policy_path, 'POST', policy)
        return 'egress_deny_requested'


    # auditIDs already paged. Long-running requests (exec, attach, port-forward) audit twice
    # under one id, ResponseStarted when the stream opens and ResponseComplete when it
    # closes; both stages stay evidence, only the first one pages.
    paged = {}

    def notify(events):
        notifications_enabled = os.environ.get('NOTIFICATIONS_ENABLED', 'false') == 'true'
        now = time.time()
        for audit_id in [k for k, at in paged.items() if now - at > 86400]:
            del paged[audit_id]
        expected = json.loads(os.environ.get('EXPECTED_ACCESSES') or Path('/app/expected.json').read_text())
        EXPECTED_IDENTITIES = {
            'system:serviceaccount:external-secrets:external-secrets',
            'system:serviceaccount:external-secrets:external-secrets-cert-controller',
            'system:serviceaccount:argocd:argocd-application-controller',
            'system:serviceaccount:argocd:argocd-applicationset-controller',
            'system:serviceaccount:argocd:argocd-server',
            'system:serviceaccount:argocd:argocd-repo-server',
            'system:serviceaccount:cnpg-system:cnpg-manager',
            'system:serviceaccount:cert-manager:cert-manager',
            'system:serviceaccount:cert-manager:cert-manager-cainjector',
            'system:serviceaccount:kube-system:generic-garbage-collector',
            'system:serviceaccount:kube-system:job-controller',
            'system:serviceaccount:kube-system:cronjob-controller',
            'system:serviceaccount:databases:newapi-pg',
            'system:serviceaccount:databases:bot-pg',
        }
        lines, pages = [], set()
        for event in events:
            if event['historical']:
                continue
            containment = quarantine_canary_workload(event)
            if containment:
                pages.add('K8sCanaryWorkload')
                lines.append(event['id'][:16] + ' containment=' + containment)
            ev = event['event']
            if ev.get('event') == 'security.discord_correlation' and ev.get('outcome') == 'unmatched_in_this_process':
                archive_s3(event, encode(event), prefix='incidents')
                pages.add('DiscordMessageNeedsReview')
                lines.append(event['id'][:16] + ' Discord message ' + str(ev.get('message_id')) +
                             ' has no matching request in that bot process; check other replicas and coverage')
            if event['source'].startswith('workload-watch-') and ev.get('watchType') in ('ADDED', 'MODIFIED'):
                snapshot = ev.get('snapshot') or {}
                owners = snapshot.get('owners') or []
                refs = set(snapshot.get('volumeSecrets', []))
                for container in snapshot.get('containers', []):
                    refs.update(container.get('envFromSecrets', []))
                    refs.update(item.get('name') for item in container.get('envSecrets', []))
                refs.discard(None)
                if refs and len(owners) == 1 and owners[0].get('kind') == 'Job':
                    job = kube_request('/apis/batch/v1/namespaces/services/jobs/' + urllib.parse.quote(owners[0]['name'], safe=''))
                    expected_sync = job and job['metadata']['uid'] == owners[0]['uid'] and refs == {'sync-env'} and any(
                        o.get('kind') == 'CronJob' and o.get('name') in ('new-api-sync', 'new-api-sync-full')
                        for o in job['metadata'].get('ownerReferences', []))
                    # The cronjob controller prunes finished sync Jobs to the history limit and
                    # the pod gets its deletionTimestamp in the same second, so the Job lookup
                    # returns nothing for a pod that already passed this check while it ran.
                    torn_down = job is None and bool(snapshot.get('deletionTimestamp'))
                    if not expected_sync and not torn_down:
                        archive_s3(event, encode(event), prefix='incidents')
                        pages.add('UnexpectedSecretUsingJob')
                        lines.append(event['id'][:16] + ' Job Pod UID=' + str(snapshot.get('uid')) +
                                     ' uses Secret references outside the expected sync job; review archived snapshot')
            if not event['source'].startswith('k8s-') or ev.get('stage') not in ('ResponseComplete', 'ResponseStarted', 'Panic'):
                continue
            ref = ev.get('objectRef') or {}
            user = (ev.get('impersonatedUser') or {}).get('username') or (ev.get('user') or {}).get('username', '')
            verb, resource, sub = ev.get('verb'), ref.get('resource'), ref.get('subresource', '')
            # watch and list open an informer stream, they do not read one secret's contents:
            # every operator (cert-manager, cnpg, eso, argocd, cilium, kps) and every kubelet
            # holds them permanently, which is 1600+ distinct tuples no allowlist can track.
            # An attacker reading a secret shows up as get, and that still alerts.
            if verb in ('watch', 'list'):
                continue
            if resource not in ('secrets', 'serviceaccounts') and sub not in ('exec','attach','portforward') and verb not in ('create','patch','update','delete','deletecollection'):
                continue
            # Controllers whose whole purpose is this access. ESO reads every secret it
            # syncs and argocd reconciles RBAC on every pass, so naming their objects one
            # by one is a list that grows with the platform and never finishes. A stolen
            # token for either shows up as its own identity, which is what the OpenBao and
            # pgaudit watchers cover.
            if user in EXPECTED_IDENTITIES:
                continue
            access = [user, verb, ref.get('apiGroup', ''), resource, sub,
                      ref.get('namespace', ''), ref.get('name', '')]
            if access in expected:
                continue
            audit_id = ev.get('auditID')
            if audit_id in paged:
                continue
            paged[audit_id] = now
            lines.append(event['id'][:16] + ' ' + json.dumps(access))
            if sub in ('exec', 'attach', 'portforward'):
                pages.add('K8sPodExec')
            elif resource == 'secrets' and (not ref.get('namespace') or ref.get('namespace') in ('services','openbao','databases')):
                pages.add('K8sSecretRead')
            elif resource in ('externalsecrets','secretstores','clustersecretstores','roles','rolebindings','clusterroles','clusterrolebindings'):
                pages.add('K8sSecurityConfigurationChanged')
        if not lines or not notifications_enabled:
            return
        # One evidence line per operation; the Alertmanager templates add the heading once per message.
        text = '\n'.join(lines[:8])[:1600]
        am = os.environ.get('ALERTMANAGER_URL')
        if am and pages:
            now = dt.datetime.now(dt.timezone.utc)
            alerts = [{'labels': {'alertname': name, 'severity': 'critical', 'source': 'k8s-audit-watch',
                                 'node': os.environ.get('NODE_NAME', 'unknown')},
                       'annotations': {'summary': text}, 'startsAt': now.isoformat(),
                       'endsAt': (now + dt.timedelta(minutes=10)).isoformat()} for name in sorted(pages)]
            request = urllib.request.Request(am.rstrip('/') + '/api/v2/alerts', data=encode(alerts),
                                            headers={'Content-Type': 'application/json', 'User-Agent': 'unorouter-evidence/1'}, method='POST')
            with urllib.request.urlopen(request, timeout=10):
                pass


    METRICS = {'errors_total': 0, 'gaps_total': 0, 'source_oldest_unread_timestamp_seconds': 0, 'source_lag_seconds': 0, 'queue_bytes': 0, 'queue_records': 0,
               'oldest_pending_seconds': 0, 'oldest_pending_timestamp_seconds': 0, 'last_poll_timestamp_seconds': 0, 'workload_watch_last_poll_timestamp_seconds': 0}


    class Metrics(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            oldest = METRICS['oldest_pending_timestamp_seconds']
            METRICS['oldest_pending_seconds'] = time.time() - oldest if oldest else 0
            unread = METRICS['source_oldest_unread_timestamp_seconds']
            METRICS['source_lag_seconds'] = max(0, time.time() - unread) if unread else 0
            body = ''.join('evidence_' + k + ' ' + str(v) + '\n' for k, v in METRICS.items()).encode()
            self.send_response(200)
            self.send_header('Content-Type', 'text/plain; version=0.0.4')
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *_):
            pass


    def upload_worker(path):
        queue = Queue(path)
        while True:
            try:
                queue.deliver(archive_s3, notify)
            except Exception as error:
                METRICS['errors_total'] += 1
                print('delivery_error', type(error).__name__, getattr(error, 'sqlite_errorname', ''), getattr(error, 'code', ''), flush=True)
            time.sleep(1)


    def watch_workloads(path):
        # Metadata-only create audits may have no name. The watch provides the
        # actual UID and resourceVersion, without logging workload bodies.
        import ssl
        queue = Queue(path)
        base = Path('/var/run/secrets/kubernetes.io/serviceaccount')
        source = 'workload-watch-' + os.environ.get('NODE_NAME', 'unknown')
        while True:
            try:
                version = queue.state('workload-rv', '')
                if not version:
                    listing = kube_request('/api/v1/namespaces/services/pods')
                    events = [('BASELINE', obj) for obj in listing['items']]
                    version = listing['metadata']['resourceVersion']
                else:
                    url = 'https://kubernetes.default.svc/api/v1/namespaces/services/pods?' + urllib.parse.urlencode({
                        'watch': 'true', 'allowWatchBookmarks': 'true', 'timeoutSeconds': 20, 'resourceVersion': version})
                    request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + (base / 'token').read_text().strip()})
                    events = []
                    with urllib.request.urlopen(request, context=ssl.create_default_context(cafile=str(base / 'ca.crt')), timeout=30) as response:
                        for raw in response:
                            item = json.loads(raw)
                            if item['type'] == 'ERROR':
                                if item['object'].get('code') == 410:
                                    gap = {'id': hashlib.sha256(encode([source, version, 'watch-expired'])).hexdigest(),
                                           'source': source, 'historical': True, 'event': {'collectionGap': 'workload_watch_history_expired'}}
                                    queue.enqueue([gap], 'workload-rv', '')
                                    METRICS['gaps_total'] += 1
                                raise RuntimeError('workload watch error')
                            obj = item['object']
                            version = obj['metadata']['resourceVersion']
                            if item['type'] != 'BOOKMARK':
                                watch_enqueue(queue, source, item['type'], obj, version)
                            else:
                                queue.enqueue([], 'workload-rv', version)
                            METRICS['workload_watch_last_poll_timestamp_seconds'] = time.time()
                    METRICS['workload_watch_last_poll_timestamp_seconds'] = time.time()
                    continue
                for kind, obj in events:
                    watch_enqueue(queue, source, kind, obj, None)
                queue.enqueue([], 'workload-rv', version)
                METRICS['workload_watch_last_poll_timestamp_seconds'] = time.time()
            except urllib.error.HTTPError as error:
                if error.code == 410:
                    gap = {'id': hashlib.sha256(encode([source, queue.state('workload-rv'), 'watch-expired'])).hexdigest(),
                           'source': source, 'historical': True, 'event': {'collectionGap': 'workload_watch_history_expired'}}
                    queue.enqueue([gap], 'workload-rv', '')
                    METRICS['gaps_total'] += 1
                METRICS['errors_total'] += 1
                time.sleep(5)
            except Exception as error:
                METRICS['errors_total'] += 1
                print('workload_watch_error', type(error).__name__, flush=True)
                time.sleep(5)


    def watch_enqueue(queue, source, kind, obj, version):
        meta = obj['metadata']
        event = {'verb': 'delete' if kind == 'DELETED' else 'update', 'responseCode': 200,
                 'objectRef': {'resource': 'pods', 'namespace': 'services', 'name': meta['name'],
                               'uid': meta['uid'], 'apiVersion': 'v1'},
                 'watchType': kind, 'resourceVersion': meta['resourceVersion']}
        event['snapshot'] = workload_snapshot(event, obj)
        record = {'id': hashlib.sha256(encode([source, meta['uid'], meta['resourceVersion'], kind])).hexdigest(),
                  'source': source, 'historical': kind == 'BASELINE', 'event': event}
        queue.enqueue([record], 'workload-rv' if version is not None else None, version)


    CONTAINER_LOG = re.compile(r'^\d+\.log(\.\d{8}-\d{6}(\.gz)?)?$')


    def main():
        os.umask(0o077)
        state = Path(os.environ.get('STATE_DIR', '/state'))
        state.mkdir(parents=True, exist_ok=True)
        q = Queue(state / 'evidence.sqlite')
        threading.Thread(target=upload_worker, args=(state / 'evidence.sqlite',), daemon=True).start()
        threading.Thread(target=watch_workloads, args=(state / 'evidence.sqlite',), daemon=True).start()
        server = http.server.ThreadingHTTPServer(('0.0.0.0', 9090), Metrics)
        threading.Thread(target=server.serve_forever, daemon=True).start()
        pruned = 0
        while True:
            try:
                files = sorted(Path(os.environ.get('AUDIT_DIR', '/audit')).glob('audit*.log*'), key=lambda p: p.stat().st_mtime)
                if not files:
                    raise RuntimeError('audit source missing')
                for path in files:
                    q.ingest_file(path, 'k8s-' + os.environ.get('NODE_NAME', 'unknown'))
                for path in Path('/hubble').glob('evidence*.log*'):
                    q.ingest_file(path, 'hubble-' + os.environ.get('NODE_NAME', 'unknown'), flow=True)
                families = {'openbao_openbao-': 'openbao', 'services_new-api-': 'gateway',
                            'services_unorouter-bot-': 'bot', 'databases_newapi-pg-': 'postgres',
                            'teleport_teleport-': 'teleport'}
                for directory in Path('/podlogs').glob('*'):
                    family = next((v for k, v in families.items() if directory.name.startswith(k)), None)
                    if family:
                        for path in directory.glob('*/*.log*'):
                            # The kubelet gzips a rotated log into <name>.tmp and renames it
                            # when done. Read as text, that half-written gzip is thousands
                            # of "invalid CRI records" per rotation.
                            if not CONTAINER_LOG.match(path.name):
                                continue
                            q.ingest_file(path, family + '-' + directory.name.rsplit('_', 1)[-1], container=True)
                METRICS['last_poll_timestamp_seconds'] = time.time()
            except Exception as error:
                METRICS['errors_total'] += 1
                print('collection_error', type(error).__name__, flush=True)
            METRICS['source_oldest_unread_timestamp_seconds'] = min(q.backlog.values(), default=0)
            n, size, oldest = q.db.execute('SELECT count(*),COALESCE(SUM(length(body)),0),MIN(created) FROM pending').fetchone()
            METRICS.update(queue_records=n, queue_bytes=size, oldest_pending_timestamp_seconds=oldest or 0, oldest_pending_seconds=time.time() - oldest if oldest else 0)
            # 35 days of ids is a few hundred thousand rows; pruning them every second was
            # a full scan per poll and, after the gzip fix, the rest of this loop's CPU.
            if time.time() - pruned > 3600:
                with q.db:
                    q.db.execute('DELETE FROM seen WHERE created < ?', (time.time() - 35 * 86400,))
                pruned = time.time()
            time.sleep(1)


    if __name__ == '__main__':
        main()

