apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-audit-watch
  namespace: monitoring
spec:
  selector:
    matchLabels: { app: k8s-audit-watch }
  template:
    metadata:
      labels: { app: k8s-audit-watch }
      annotations:
        evidence.unorouter.com/code-sha256: "e43d14b422445c452ac8743323cabecb937e1e77eff9cc4cde2584e55a5c0b6f"
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
      serviceAccountName: evidence-collector
      automountServiceAccountToken: true
      containers:
        - name: watch
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/watch.py"]
          env:
            - name: AUTO_QUARANTINE
              value: "true"
            - name: SNAPSHOTS_ENABLED
              value: "true"
            - name: NOTIFICATIONS_ENABLED
              value: "true"
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: ALERTMANAGER_URL
              value: http://kps-alertmanager.monitoring.svc:9093
          envFrom: [{ secretRef: { name: logs-archive } }]
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - { name: metrics, containerPort: 9090 }
          readinessProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/metrics', timeout=2).read()"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: audit, mountPath: /audit, readOnly: true }
            - { name: hubble, mountPath: /hubble, readOnly: true }
            - { name: podlogs, mountPath: /podlogs, readOnly: true }
            - { name: state, mountPath: /state }
      volumes:
        - name: app
          configMap: { name: k8s-audit-watch-e43d14b42244 }
        - name: audit
          hostPath: { path: /var/lib/rancher/k3s/server/logs, type: Directory }
        - name: hubble
          hostPath: { path: /var/run/cilium/hubble, type: DirectoryOrCreate }
        - name: podlogs
          hostPath: { path: /var/log/pods, type: Directory }
        - name: state
          hostPath: { path: /var/lib/unorouter-evidence/k8s, type: DirectoryOrCreate }
