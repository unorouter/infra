# Tails the kube-apiserver audit log on every server (a file under
# /var/lib/rancher/k3s/server/logs, written by the policy in tofu/cloud-init*.tftpl:
# Metadata events for secrets, pods/exec, pods/attach, pods/portforward and
# serviceaccounts/token and workload/configuration changes) and raises an Alertmanager
# alert for every Secret read that is not the routine machinery, every exec, attach or
# port-forward whoever did it, and every RBAC or ExternalSecret change. Alertmanager
# owns the fan-out: Discord for all of them, the phone for Secret reads in services,
# openbao or databases and for any exec. Each server logs only what it served, so one
# tail per server is the whole picture. The pod runs as root because the log is root 0600; it mounts the
# directory read-only, keeps its queue and checkpoints on the node disk, and holds no credential
# for bucket configuration. Containment is separately gated and namespace-scoped.
# Immutable: the name suffix and the DaemonSet annotation are sha256(watch.py + expected.json),
# so a change to either rolls the pods and lets ArgoCD prune the old object.
apiVersion: v1
kind: ConfigMap
immutable: true
metadata:
  name: k8s-audit-watch-e43d14b42244
  namespace: monitoring
