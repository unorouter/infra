# Alertmanager routing. Lives in the CRD (not the chart's inline `config:`) because
# discordConfigs.apiURL accepts a Secret reference -- the webhook URL never enters git.
# The chart's alertmanagerConfiguration.name points here.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: unorouter-alerts
  namespace: monitoring
spec:
  route:
    # DEFAULT IS DROP. Only warning/critical opt in below. Making discord the default
    # receiver spammed the channel with severity=none plumbing alerts (Watchdog,
    # InfoInhibitor) whose own descriptions say they belong in a null receiver.
    receiver: "null"
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # DEAD-MAN SWITCH. Watchdog always fires while Prometheus+Alertmanager are alive, so
      # re-notifying it every 5m is a heartbeat to healthchecks.io. If the cluster, Prometheus
      # or Alertmanager dies the pings stop and healthchecks emails after its grace period --
      # the one failure mode in-cluster alerting can never report itself.
      - receiver: healthchecks
        matchers:
          - name: alertname
            value: Watchdog
        groupWait: 0s
        groupInterval: 5m
        repeatInterval: 5m
      # InfoInhibitor exists only to suppress info alerts; it must never notify.
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
      # critical fans out to BOTH discord (continue: true falls through) and ntfy, which
      # makes the phone ring. Discord alone failed 2026-08-12: the API degraded for 2h
      # during Korea business hours (= our night) before anyone saw the channel.
      - receiver: discord
        matchers:
          - name: severity
            value: critical
        groupWait: 10s
        repeatInterval: 1h
        continue: true
      # Phone pages are for the API path (new-api, db, tunnel, nodes) and full site
      # outages. Frontend pod-level churn (unorouter/mcp/bot OOM, crashloop, replicas)
      # stays Discord-only: the unorouter leak makes those semi-routine and a 3am page
      # must mean revenue is at risk. Endpoint probes carry no pod/deployment label, so
      # PublicEndpointDown still pages even for unorouter.com.
      - receiver: ntfy
        matchers:
          - name: severity
            value: critical
          - name: pod
            matchType: "!~"
            value: "unorouter.*"
          - name: deployment
            matchType: "!~"
            value: "unorouter.*"
        groupWait: 10s
        repeatInterval: 1h
      - receiver: discord
        matchers:
          - name: severity
            value: warning
        groupWait: 5m
        repeatInterval: 12h
  receivers:
    - name: "null"
    # heartbeat target: any POST marks the check alive. sendResolved is off -- a resolved
    # Watchdog would ping too and defeat the point.
    - name: healthchecks
      webhookConfigs:
        - urlSecret:
            name: alertmanager-discord
            key: healthchecks
          sendResolved: false
    # phone paging via the ntfy-bridge Deployment (reformats webhook JSON for ntfy.sh)
    - name: ntfy
      webhookConfigs:
        - url: http://ntfy-bridge.monitoring.svc:8080/alert
          sendResolved: true
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord
            key: webhook
          sendResolved: true
          # default template dumps every label, the full description paragraph, the runbook
          # URL and an unreadable Source: query link -- a screen of text per alert. Keep it
          # to what you act on: what broke, where, and the one-line summary.
          title: '{{ if eq .Status "firing" }}[{{ .CommonLabels.severity | toUpper }}]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
          message: |-
            {{ range .Alerts -}}
            {{ .Annotations.summary }}
            {{ end -}}
  inhibitRules:
    # one root cause must not become an alert storm: a down node explains its pods, and
    # etcd degradation explains the NodeNotReady it causes (incident 2026-07-24).
    - sourceMatch:
        - name: alertname
          value: NodeNotReady
      targetMatch:
        - name: severity
          value: warning
      equal: [node]
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: [alertname, namespace]
