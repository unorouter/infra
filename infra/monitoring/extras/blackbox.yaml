# Probes the PUBLIC urls from INSIDE the cluster -- the hairpin path (pod -> CF edge ->
# tunnel -> back in) that broke in the 2026-07-23 outage. External checks saw nothing (they
# stop at the edge) and in-cluster service checks saw nothing (they skip it). Only this does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels: { app: blackbox-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: blackbox-exporter }
  template:
    metadata:
      labels: { app: blackbox-exporter }
    spec:
      nodeSelector:
        kubernetes.io/hostname: unorouter-node7
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.27.0
          args: ["--config.file=/etc/blackbox/config.yml"]
          ports:
            - name: http
              containerPort: 9115
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            # generous CPU limit: probes are short bursts, a tight limit throttles them
            # into permanent CPUThrottlingHigh noise
            limits: { cpu: 400m, memory: 96Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap: { name: blackbox-exporter }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: monitoring
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200, 204]
          follow_redirects: true
          preferred_ip_protocol: ip4
      # the frontend root answers 307 (locale redirect) -- treat redirects as success
      http_2xx_or_redirect:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200, 204, 301, 302, 307, 308]
          follow_redirects: false
          preferred_ip_protocol: ip4
      # og badges must be actual PNGs: sharp's SVG loader can fail at runtime in an aged
      # process, after which the route serves an SVG fallback (or before 2026-08-12, a
      # silent 500). Either way the content-type stops being image/png, and that was only
      # ever discovered by hand. Detection lags up to the badge's 1h edge cache.
      http_png:
        prober: http
        timeout: 15s
        http:
          valid_status_codes: [200]
          follow_redirects: true
          preferred_ip_protocol: ip4
          fail_if_header_not_matches:
            - header: Content-Type
              regexp: "^image/png"
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels: { app: blackbox-exporter }
spec:
  selector: { app: blackbox-exporter }
  ports:
    - name: http
      port: 9115
      targetPort: 9115
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: public-endpoints
  namespace: monitoring
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://api.unorouter.com/api/status
        - https://teleport.unorouter.com/webapi/ping
        - https://dex.unorouter.com/.well-known/openid-configuration
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: public-frontend
  namespace: monitoring
spec:
  interval: 60s
  module: http_2xx_or_redirect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://unorouter.com
        - https://www.unorouter.com
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: og-badges
  namespace: monitoring
spec:
  interval: 120s
  module: http_png
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://unorouter.com/api/ops/badge/hero?locale=en&size=og&format=png
        - https://unorouter.com/api/ops/badge/model?locale=en&size=og&format=png&model=glm-4.7
