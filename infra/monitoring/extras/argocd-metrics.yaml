# ArgoCD's own metrics (controller, repo-server, api-server expose a `metrics` port and the
# chart's NetworkPolicies admit it from any namespace) plus the one alert that answers
# "did my push actually land": an app that stays OutOfSync or unhealthy for 15 minutes.
# Before 2026-09-07 nothing scraped these, so a stalled or never-converging app was only
# visible by looking. The CNPG Cluster and etcd ScrapeConfig used to sit OutOfSync forever
# (webhook-defaulted keys inside atomic lists); their manifests now state those defaults,
# so this alert means real drift.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argocd
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [argocd-application-controller, argocd-repo-server, argocd-server]
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd
  namespace: monitoring
  labels: { release: kps }
spec:
  groups:
    - name: unorouter.argocd
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "ArgoCD app {{ $labels.name }} OutOfSync for 15m: a push is not live or a resource never converges"
        - alert: ArgoCDAppUnhealthy
          expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is {{ $labels.health_status }} for 15m"
        - alert: ArgoCDSyncFailed
          expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[30m]) > 0
          labels: { severity: warning }
          annotations:
            summary: "ArgoCD sync of {{ $labels.name }} failed ({{ $labels.phase }}) in the last 30m"
        - alert: ArgoCDMetricsMissing
          expr: absent(argocd_app_info)
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "No ArgoCD metrics scraped for 15m, the OutOfSync alert is blind"
