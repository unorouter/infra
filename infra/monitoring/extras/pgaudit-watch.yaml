# Reads the pgaudit records CNPG writes to the postgres pods' stdout and posts every
# access to the audited tables (see infra/databases/options-audit.sql) that did not come
# from the application role. Without this the audit log only answers questions after
# the fact; with it a superuser read from a kubectl exec, a Teleport reader session or
# anything else shows up in Discord within five minutes. Statement text is never posted
# (pgaudit.log_statement is off in the cluster parameters), only who, from where, what
# command and which table.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgaudit-watch
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pgaudit-watch
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK
      remoteRef: { key: alertmanager, property: discordWebhook }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgaudit-watch
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgaudit-watch
  namespace: databases
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgaudit-watch
  namespace: databases
subjects:
  - kind: ServiceAccount
    name: pgaudit-watch
    namespace: monitoring
roleRef:
  kind: Role
  name: pgaudit-watch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgaudit-watch-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgaudit-watch-pods
subjects:
  - kind: ServiceAccount
    name: pgaudit-watch
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: pgaudit-watch-pods
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgaudit-watch
  namespace: monitoring
data:
  watch.py: |
    import json, os, ssl, urllib.request, urllib.parse
    from collections import defaultdict

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    TOKEN = open(f"{SA}/token").read()
    API = "https://kubernetes.default.svc"
    CTX = ssl.create_default_context(cafile=f"{SA}/ca.crt")
    SINCE = int(os.environ.get("SINCE_SECONDS", "330"))
    APP_ROLES = set(os.environ.get("APP_ROLES", "newapi").split(","))
    WEBHOOK = os.environ["DISCORD_WEBHOOK"]

    def k8s(path):
        req = urllib.request.Request(API + path, headers={"Authorization": "Bearer " + TOKEN})
        with urllib.request.urlopen(req, timeout=60, context=CTX) as r:
            return r.read().decode(errors="replace")

    # connection_from is a pod IP for in-cluster clients and [local] for a psql started
    # inside the postgres pod (kubectl exec); name the pod so the line says which workload.
    pod_by_ip = {}
    try:
        for pod in json.loads(k8s("/api/v1/pods?limit=2000"))["items"]:
            for ip in pod.get("status", {}).get("podIPs") or []:
                pod_by_ip[ip["ip"]] = pod["metadata"]["namespace"] + "/" + pod["metadata"]["name"]
    except Exception as e:
        print("pod lookup failed:", e, flush=True)

    def where(src):
        if src == "[local]":
            return "unix socket inside the postgres pod (kubectl exec)"
        host = src.rsplit(":", 1)[0]
        return pod_by_ip.get(host, src)

    pods = json.loads(k8s("/api/v1/namespaces/databases/pods?labelSelector=cnpg.io%2Fcluster%3Dnewapi-pg"))
    sessions = defaultdict(lambda: {"first": None, "last": None, "ops": defaultdict(int), "order": []})
    for pod in pods["items"]:
        name = pod["metadata"]["name"]
        q = urllib.parse.urlencode({"container": "postgres", "sinceSeconds": SINCE})
        for line in k8s(f"/api/v1/namespaces/databases/pods/{name}/log?{q}").splitlines():
            if '"logger":"pgaudit"' not in line:
                continue
            try:
                rec = json.loads(line)["record"]
            except (ValueError, KeyError):
                continue
            user = rec.get("user_name", "?")
            if user in APP_ROLES:
                continue
            audit = rec.get("audit", {})
            t = (rec.get("log_time") or "")[11:19]
            key = (name, user, rec.get("connection_from", "?"), rec.get("session_id", "?"), rec.get("backend_type", "?"), rec.get("session_start_time", "")[11:19])
            s = sessions[key]
            s["first"] = min(s["first"] or t, t)
            s["last"] = max(s["last"] or t, t)
            # command_tag is the statement (COPY for a pg_dump), audit.command the inner
            # class (that same COPY is logged as SELECT); the statement is what a reader wants
            what = f"{rec.get('command_tag') or audit.get('command', '?')} {audit.get('object_name', '')}".strip()
            if what not in s["ops"]:
                s["order"].append(what)
            s["ops"][what] += 1

    if sessions:
        lines = ["**pgaudit: audited table touched by a non-app role** (last %ds; statements are not logged by design, only who, where, what)" % SINCE]
        for (pod, user, src, sid, backend, started), s in sorted(sessions.items(), key=lambda kv: kv[1]["first"] or "")[:15]:
            span = s["first"] if s["first"] == s["last"] else f"{s['first']} to {s['last']}"
            ops = ", ".join(f"{w} x{s['ops'][w]}" if s["ops"][w] > 1 else w for w in s["order"][:8])
            note = "" if backend == "client backend" else f" ({backend})"
            lines.append(f"`{user}` on {pod} from {where(src)}{note}, session {sid} opened {started}, {span} UTC: {ops}")
        print("\n".join(lines), flush=True)
        req = urllib.request.Request(WEBHOOK, data=json.dumps({"username": "pgaudit", "content": "\n".join(lines)[:1900]}).encode(),
                                     headers={"content-type": "application/json", "user-agent": "pgaudit-watch/1"}, method="POST")
        urllib.request.urlopen(req, timeout=30).read()
    print(f"pods={len(pods['items'])} sessions={len(sessions)}", flush=True)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pgaudit-watch
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: pgaudit-watch
          restartPolicy: Never
          containers:
            - name: watch
              image: python:3.12-alpine
              command: ["python3", "-u", "/app/watch.py"]
              envFrom: [{ secretRef: { name: pgaudit-watch } }]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts: [{ name: app, mountPath: /app }]
          volumes:
            - name: app
              configMap: { name: pgaudit-watch }
