apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evidence-archive
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: evidence-archive, creationPolicy: Owner}
  dataFrom:
    - extract: {key: evidence-archive}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: evidence-collector
  namespace: monitoring
  labels: {release: kps}
spec:
  selector:
    matchExpressions:
      - {key: app, operator: In, values: [k8s-audit-watch, evidence-validation]}
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: evidence-collection
  namespace: monitoring
  labels: {release: kps}
spec:
  groups:
    - name: evidence-collection
      rules:
        - alert: PATArchiveLag
          expr: cnpg_newapi_pat_archive_oldest_seconds > 300
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Committed PAT changes have not reached the archive for five minutes
        - alert: PATArchiveUnavailable
          expr: absent(cnpg_newapi_pat_archive_pending)
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: PAT archive queue monitoring is missing
        - alert: EvidenceCollectionErrors
          expr: increase(evidence_errors_total[5m]) > 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Evidence collector errors on {{ $labels.pod }}
        - alert: EvidenceCollectionGaps
          # Log rotation reuses inodes and yields one replaced-file gap per file; a real
          # problem is hundreds at once. The per reason counters name which one.
          expr: increase(evidence_gaps_total[30m]) > 10
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Evidence source reported malformed, replaced or truncated records
        - alert: EvidenceSourceBacklog
          expr: evidence_source_lag_seconds > 300
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Unread source records are more than five minutes old
        - alert: EvidenceArchiveLag
          expr: evidence_oldest_pending_seconds > 300
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Evidence has waited over five minutes for archive or notification delivery
        - alert: EvidenceQueueCapacity
          expr: evidence_queue_bytes > 201326592
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Evidence queue is above 75 percent capacity
        - alert: EvidenceWorkloadWatchStalled
          expr: time() - evidence_workload_watch_last_poll_timestamp_seconds > 300
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Live workload snapshots have not been collected for five minutes
        - alert: EvidenceSourceStalled
          expr: time() - evidence_last_poll_timestamp_seconds > 300
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: Evidence source has not been polled successfully for five minutes
        - alert: EvidenceCollectorUnavailable
          expr: up{pod=~"(k8s-audit-watch|evidence-validation)-.+"} == 0 or absent(up{pod=~"(k8s-audit-watch|evidence-validation)-.+"})
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Evidence collector scrape is unavailable
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evidence-collector
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: evidence-collector
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores, clustersecretstores]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: evidence-collector
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: evidence-collector}
subjects:
  - {kind: ServiceAccount, name: evidence-collector, namespace: monitoring}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: evidence-collector
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: {io.cilium.k8s.policy.serviceaccount: evidence-collector}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/name: alertmanager}
      toPorts:
        - ports: [{port: "9093", protocol: TCP}]
    - toEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports: [{port: "6443", protocol: TCP}, {port: "443", protocol: TCP}]
    # Match the existing watcher policies: transparent DNS proxy drops queries
    # on this cluster, so FQDN/L7 policies cannot be used here.
    - toEntities: [world]
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
---
# Containment is gated off in the collector until the isolated drill passes.
# The controller limits Pod patches to metadata. RBAC permits Pod patches and
# namespaced policy creation, never pod deletion,
# exec, Secret reads, RBAC changes or cluster-wide policy changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evidence-containment
  namespace: services
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, patch]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evidence-containment
  namespace: services
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: evidence-containment}
subjects:
  - {kind: ServiceAccount, name: evidence-collector, namespace: monitoring}
---
# Both ends of a scrape need permission under the monitoring default deny.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-evidence-scrape
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  egress:
    - toEndpoints:
        - matchLabels: {io.cilium.k8s.policy.serviceaccount: evidence-collector}
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evidence-workload-watch
  namespace: services
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evidence-workload-watch
  namespace: services
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: evidence-workload-watch}
subjects:
  - {kind: ServiceAccount, name: evidence-collector, namespace: monitoring}

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager-evidence-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: alertmanager}
  ingress:
    - fromEndpoints:
        - matchLabels: {io.cilium.k8s.policy.serviceaccount: evidence-collector}
      toPorts:
        - ports: [{port: "9093", protocol: TCP}]
