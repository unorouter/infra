# Reads the OpenBao audit device (file audit to stdout, see infra/openbao/values.yaml)
# from the pod log every five minutes and posts to Discord everything that is not the
# routine machinery: any caller other than external-secrets, the snapshot job and the
# CI JWT role; every root-token use; and any change to policies, auth methods, mounts,
# audit devices, seal state or token creation, whoever did it. The pod log rotates
# within a day, so the Discord copy is also the only durable trail. Secret values never
# appear in the audit log (HMAC'd by OpenBao), only paths and identities are posted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-audit-watch
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openbao-audit-watch
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK
      remoteRef: { key: alertmanager, property: discordWebhook }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-audit-watch
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-audit-watch
  namespace: openbao
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-audit-watch
  namespace: openbao
subjects:
  - kind: ServiceAccount
    name: openbao-audit-watch
    namespace: monitoring
roleRef:
  kind: Role
  name: openbao-audit-watch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-audit-watch-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-audit-watch-pods
subjects:
  - kind: ServiceAccount
    name: openbao-audit-watch
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: openbao-audit-watch-pods
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-audit-watch
  namespace: monitoring
data:
  watch.py: |
    import json, os, re, ssl, urllib.request, urllib.parse
    from collections import defaultdict

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    TOKEN = open(f"{SA}/token").read()
    API = "https://kubernetes.default.svc"
    CTX = ssl.create_default_context(cafile=f"{SA}/ca.crt")
    SINCE = int(os.environ.get("SINCE_SECONDS", "330"))
    ROUTINE = set(os.environ.get("ROUTINE_IDENTITIES",
        "kubernetes-external-secrets-external-secrets,kubernetes-openbao-openbao-snapshot,jwt-github-GHCR Image").split(","))
    SENSITIVE = re.compile(r"^(sys/(policies|policy|auth|mounts|audit|seal|unseal|rekey|generate-root|raft|rotate|internal/counters)|auth/token/(create|revoke$|revoke-accessor|roles)|auth/[^/]+/(config|role|roles)|identity/)")
    WEBHOOK = os.environ["DISCORD_WEBHOOK"]

    def k8s(path):
        req = urllib.request.Request(API + path, headers={"Authorization": "Bearer " + TOKEN})
        with urllib.request.urlopen(req, timeout=60, context=CTX) as r:
            return r.read().decode(errors="replace")

    def short(path):
        for pre in ("sys/internal/ui/mounts/", "secret/data/", "secret/metadata/", "secret/"):
            if path.startswith(pre):
                return path[len(pre):] or path
        return path

    # remote_address is a pod IP: name the pod so a token use is tied to a workload
    pod_by_ip = {}
    try:
        for pod in json.loads(k8s("/api/v1/pods?limit=2000"))["items"]:
            for ip in pod.get("status", {}).get("podIPs") or []:
                pod_by_ip[ip["ip"]] = pod["metadata"]["namespace"] + "/" + pod["metadata"]["name"]
    except Exception as e:
        print("pod lookup failed:", e, flush=True)

    def where(remote):
        if remote in ("127.0.0.1", "::1"):
            return "inside the openbao pod (kubectl exec)"
        return pod_by_ip.get(remote, remote)

    pods = json.loads(k8s("/api/v1/namespaces/openbao/pods?labelSelector=app.kubernetes.io%2Fname%3Dopenbao"))
    callers = defaultdict(lambda: {"first": None, "last": None, "reads": defaultdict(int), "mounts": 0, "ops": []})
    for pod in pods["items"]:
        name = pod["metadata"]["name"]
        q = urllib.parse.urlencode({"sinceSeconds": SINCE})
        for line in k8s(f"/api/v1/namespaces/openbao/pods/{name}/log?{q}").splitlines():
            if '"type":"response"' not in line:
                continue
            try:
                d = json.loads(line)
            except ValueError:
                continue
            req = d.get("request") or {}
            auth = d.get("auth") or {}
            path = req.get("path", "")
            op = req.get("operation", "?")
            ident = auth.get("display_name") or "unauthenticated"
            policies = ",".join(auth.get("policies") or [])
            remote = (req.get("remote_address") or "?").rsplit(":", 1)[0]
            is_root = "root" in (auth.get("policies") or [])
            is_login = path.endswith("/login")
            sensitive = bool(SENSITIVE.match(path))
            # UI plumbing: every page load reads these, logged-in or not. The login itself
            # (auth/*/callback, auth/*/login) and anything sensitive still get reported.
            plumbing = path.startswith(("sys/internal/ui/", "sys/health", "sys/seal-status", "sys/capabilities-self", "auth/token/lookup-self", "auth/token/revoke-self")) or path.endswith("/auth_url")
            routine = ident in ROUTINE or plumbing or (ident == "unauthenticated" and is_login)
            if routine and not sensitive and not is_root:
                continue
            t = d.get("time", "")[11:19]
            c = callers[(ident or "?", "root" if is_root else policies[:40], remote)]
            c["first"] = min(c["first"] or t, t)
            c["last"] = max(c["last"] or t, t)
            err = " ERR" if d.get("error") else ""
            if path.startswith("sys/internal/ui/mounts/") and not err:
                c["mounts"] += 1   # the mount lookup a kv get does before the real read
                continue
            if op in ("read", "list") and not sensitive and not err:
                c["reads"][short(path)] += 1
                continue
            data = req.get("data") or {}
            keys = list((data.get("data") or {}).keys()) if isinstance(data.get("data"), dict) else [k for k in data.keys() if k != "options"]
            ver = (d.get("response") or {}).get("data") or {}
            detail = ""
            if keys:
                detail += " keys=" + ",".join(sorted(keys)[:10])
            if isinstance(ver, dict) and ver.get("version"):
                detail += f" (now v{ver['version']})"
            c["ops"].append(f"{op} {short(path)}{detail}{err} at {t}")

    if callers:
        lines = ["**openbao audit: non-routine activity** (last %ds)" % SINCE]
        for (ident, pol, remote), c in sorted(callers.items(), key=lambda kv: -(sum(kv[1]["reads"].values()) + len(kv[1]["ops"]))):
            span = c["first"] if c["first"] == c["last"] else f"{c['first']} to {c['last']}"
            parts = []
            if c["reads"]:
                paths = sorted(c["reads"])
                parts.append("%d reads: %s%s" % (sum(c["reads"].values()), ", ".join(f"{p} x{n}" if n > 1 else p for p, n in sorted(c["reads"].items())[:8]), ", ..." if len(paths) > 8 else ""))
            parts += c["ops"][:8]
            if len(c["ops"]) > 8:
                parts.append(f"and {len(c['ops']) - 8} more")
            lines.append(f"`{ident}` [{pol}] from {where(remote)}, {span} UTC: " + "; ".join(parts))
        print("\n".join(lines), flush=True)
        body = json.dumps({"username": "openbao audit", "content": "\n".join(lines[:20])[:1900]}).encode()
        req = urllib.request.Request(WEBHOOK, data=body, headers={"content-type": "application/json", "user-agent": "openbao-audit-watch/1"}, method="POST")
        urllib.request.urlopen(req, timeout=30).read()
    print(f"pods={len(pods['items'])} callers={len(callers)}", flush=True)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-audit-watch
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: openbao-audit-watch
          restartPolicy: Never
          containers:
            - name: watch
              image: python:3.12-alpine
              command: ["python3", "-u", "/app/watch.py"]
              envFrom: [{ secretRef: { name: openbao-audit-watch } }]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts: [{ name: app, mountPath: /app }]
          volumes:
            - name: app
              configMap: { name: openbao-audit-watch }
