# Reports every failed Teleport login within five minutes: GitHub SSO logins
# refused by the org gate (with the GitHub username as a profile link when Teleport
# knows it), local-auth attempts (root/admin guesses against a cluster with local auth
# off), plus successful SSO logins so the two are side by side. Reads the audit events
# the auth pod mirrors to stdout (audit_events_uri stdout:// in infra/teleport/values.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-login-watch
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-login-watch
  namespace: teleport
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-login-watch
  namespace: teleport
subjects:
  - kind: ServiceAccount
    name: teleport-login-watch
    namespace: monitoring
roleRef:
  kind: Role
  name: teleport-login-watch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-login-watch
  namespace: dex
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-login-watch
  namespace: dex
subjects:
  - kind: ServiceAccount
    name: teleport-login-watch
    namespace: monitoring
roleRef:
  kind: Role
  name: teleport-login-watch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-login-watch
  namespace: monitoring
data:
  watch.py: |
    import json, os, re, ssl, urllib.request, urllib.parse
    import notify

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    TOKEN = open(f"{SA}/token").read()
    API = "https://kubernetes.default.svc"
    CTX = ssl.create_default_context(cafile=f"{SA}/ca.crt")
    SINCE = int(os.environ.get("SINCE_SECONDS", "330"))
    WANT = {"user.login", "auth"}
    # Privilege changes inside Teleport: a role, a connector mapping or a user's role set
    # is how a stolen editor session escalates, and it is silent otherwise. Always paged.
    PRIV = {"role.created", "role.updated", "role.deleted", "github.created", "github.updated", "github.deleted",
            "saml.created", "saml.updated", "saml.deleted", "oidc.created", "oidc.updated", "oidc.deleted",
            "user.create", "user.update", "user.delete", "trusted_cluster.create", "trusted_cluster.delete"}
    # Write-capable DB sessions: pgaudit only sees the role, this line names the person.
    DB_ADMIN_USERS = set(os.environ.get("DB_ADMIN_USERS", "dbadmin,postgres").split(","))
    def k8s(path):
        req = urllib.request.Request(API + path, headers={"Authorization": "Bearer " + TOKEN})
        with urllib.request.urlopen(req, timeout=60, context=CTX) as r:
            return r.read().decode(errors="replace")

    def github_login(ev):
        # the username sits in different places depending on how far the login got
        for key in ("user", "login"):
            v = ev.get(key)
            if v and v != "undefined":
                return v
        attrs = ev.get("attributes") or {}
        for key in ("login", "username", "preferred_username"):
            if attrs.get(key):
                return attrs[key] if isinstance(attrs[key], str) else attrs[key][0]
        return ""

    pods = json.loads(k8s("/api/v1/namespaces/teleport/pods?labelSelector=app.kubernetes.io%2Fcomponent%3Dauth"))
    lines = []
    priv = []
    for pod in pods["items"]:
        name = pod["metadata"]["name"]
        q = urllib.parse.urlencode({"sinceSeconds": SINCE})
        for line in k8s(f"/api/v1/namespaces/teleport/pods/{name}/log?{q}").splitlines():
            if '"event":' not in line:
                continue
            try:
                ev = json.loads(line[line.index("{"):])
            except ValueError:
                continue
            e = ev.get("event")
            if e in PRIV:
                who = ev.get("user", "?")
                what = f"{e} `{ev.get('name', '')}`" + (f" roles {ev.get('roles')}" if ev.get("roles") else "")
                lines.append(f"**PRIVILEGE CHANGE** by `{who}` from `{ev.get('addr.remote', '?')}`: {what}")
                priv.append(f"{who}: {what}")
                continue
            if e == "db.session.start" and ev.get("db_user") in DB_ADMIN_USERS:
                lines.append(f"**db admin session** `{ev.get('user', '?')}` as `{ev.get('db_user')}` on {ev.get('db_service')}/{ev.get('db_name')} ({ev.get('user_agent', '')[:30]})")
                continue
            if e not in WANT:
                continue
            ok = ev.get("success", True)
            method = ev.get("method", "local")
            who = github_login(ev)
            addr = ev.get("addr.remote") or (ev.get("addr") or {}).get("remote") or "?"
            if ok and ev.get("event") == "user.login":
                lines.append(f"login ok `{who}` via {method} from `{addr}`")
                continue
            if ok:
                continue
            link = f"<https://github.com/{who}>" if method == "github" and who else (f"`{who}`" if who else "(no username)")
            ua = (ev.get("user_agent") or "")[:80]
            lines.append(f"**login FAILED** {link} via {method} from `{addr}`: {ev.get('error','')[:120]}" + (f"  ua `{ua}`" if ua else ""))
            # GitHub refusing our client credentials means the connector lost its secret
            # (a `tctl create --force` from `tctl get` output does that); every SSO login
            # is dead until it is rebuilt from the repo file plus OpenBao teleport-github.
            if "incorrect_client_credentials" in (ev.get("error") or ""):
                notify.alert("TeleportSSOBroken", f"GitHub rejects the Teleport connector credentials ({method} login from {addr}); rebuild the connector from infra/teleport/resources/github-connector.yaml plus OpenBao secret/teleport-github")

    # Dex fronts ArgoCD, OpenBao and Grafana with the same GitHub org gate, and unlike
    # Teleport it names the refused user, which is the whole point of this watcher.
    dpods = json.loads(k8s("/api/v1/namespaces/dex/pods?labelSelector=app%3Ddex"))
    DEX_OK = re.compile(r'msg="login successful".*?preferred_username=(\S+).*?groups=\[([^\]]*)\]')
    DEX_NO = re.compile(r'github: user "([^"]+)" not in required orgs')
    for pod in dpods["items"]:
        name = pod["metadata"]["name"]
        q = urllib.parse.urlencode({"sinceSeconds": SINCE})
        for line in k8s(f"/api/v1/namespaces/dex/pods/{name}/log?{q}").splitlines():
            m = DEX_NO.search(line)
            if m:
                lines.append(f"**dex REFUSED** <https://github.com/{m.group(1)}> (not in the org)")
                continue
            m = DEX_OK.search(line)
            if m:
                lines.append(f"dex login ok <https://github.com/{m.group(1)}> groups [{m.group(2)}]")

    counted = []
    for l in dict.fromkeys(lines):
        n = lines.count(l)
        counted.append(l + (f" x{n}" if n > 1 else ""))
    lines = counted

    if lines:
        notify.digest("TeleportLogins", "teleport / dex logins (last %ds)" % SINCE, lines[:20])
    if priv:
        notify.alert("TeleportPrivilegeChange", f"{len(priv)} change(s): " + "; ".join(priv[:5]))
    print(f"pods={len(pods['items'])} events={len(lines)} priv={len(priv)}", flush=True)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: teleport-login-watch
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: teleport-login-watch
          restartPolicy: Never
          containers:
            - name: watch
              image: python:3.12-alpine
              command: ["python3", "-u", "/app/watch.py"]
              env:
                - name: WATCH_NAME
                  value: teleport-login-watch
                - name: PYTHONPATH
                  value: /app/lib
                - name: ALERTMANAGER_URL
                  value: http://kps-alertmanager.monitoring.svc:9093
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts: [{ name: app, mountPath: /app }, { name: lib, mountPath: /app/lib }]
          volumes:
            - name: app
              configMap: { name: teleport-login-watch }
            - name: lib
              configMap: { name: watch-lib }
