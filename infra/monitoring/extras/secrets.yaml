# Grafana's dex client secret. Mounted as a FILE and read via $__file{} in grafana.ini so the
# value never lands in a configmap or in the pod env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-dex-sso
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-dex-sso
    creationPolicy: Owner
  data:
    - secretKey: grafanaClientSecret
      remoteRef: { key: dex-sso, property: grafanaClientSecret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: adminUser
      remoteRef: { key: grafana, property: adminUser }
    - secretKey: adminPassword
      remoteRef: { key: grafana, property: adminPassword }
---
# Discord webhook for Alertmanager. Key name `webhook` becomes the filename under
# /etc/alertmanager/secrets/alertmanager-discord/, referenced by webhook_url_file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook
      remoteRef: { key: alertmanager, property: discordWebhook }
