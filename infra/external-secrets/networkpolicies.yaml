# Pod isolation for External Secrets. The controller reads OpenBao and writes Secrets through
# the API server; the webhook is called BY the API server (host, remote-node or kube-apiserver
# identity depending on which node serves the request), and blocking that stalls every
# ExternalSecret and SecretStore change; the cert-controller only talks to the API server.
# Kubelet probes arrive as host on the ready port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: external-secrets }
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
            - { port: "8081", protocol: TCP }
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus }
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: openbao
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports: [{ port: "8200", protocol: TCP }]
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webhook
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: external-secrets-webhook }
  ingress:
    - fromEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports:
            - { port: "10250", protocol: TCP }
            - { port: "8081", protocol: TCP }
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus }
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-controller
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: external-secrets-cert-controller }
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
            - { port: "8081", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
