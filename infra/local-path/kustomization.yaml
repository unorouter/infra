apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# local-path-provisioner: every PVC on this cluster is a directory on the node's user volume
# (talos/patches/volumes.yaml mounts it at /var/mnt/local-path-provisioner). The
# StorageClass is the default so manifests may omit storageClassName. Installed by
# scripts/dr.sh bootstrap before ArgoCD exists, owned by ArgoCD afterwards. Pinned.
resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/49b2be8e26d6d34c9afaa21fa33108d2e82f8955/deploy/local-path-storage.yaml # v0.0.37
patches:
  - path: config.yaml
  - target: { kind: Deployment, name: local-path-provisioner }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 10m, memory: 32Mi } }
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
          # local, not hostPath: Velero's file-level backup refuses hostPath-backed PVs
          # (2026-09-14, silent skip). Only PVCs created after this are local.
          defaultVolumeType: local
