apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# local-path-provisioner: every PVC on this cluster is a directory on the node's user volume
# (bootstrap/talos/patches/volumes.yaml mounts it at /var/mnt/local-path-provisioner). The
# StorageClass is the default so manifests may omit storageClassName. Installed by
# scripts/dr.sh bootstrap before ArgoCD exists, owned by ArgoCD afterwards. Pinned.
resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
patches:
  - path: config.yaml
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
