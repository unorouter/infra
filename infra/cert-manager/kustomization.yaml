apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# cert-manager: required by the CNPG Barman Cloud plugin (TLS between plugin and operator)
# and later for any non-CF-proxied cert issuance. Verified latest 2026-09-03.
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.1/cert-manager.yaml # sha256:5f6a499b8c1857d57f560f536e0dcc830914b45c420899fe7ad0692c8624e408
  - issuer.yaml
  - networkpolicies.yaml
patches:
  - target: { kind: Deployment, name: cert-manager }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 10m, memory: 64Mi } }
  - target: { kind: Deployment, name: cert-manager-cainjector }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 10m, memory: 64Mi } }
  - target: { kind: Deployment, name: cert-manager-webhook }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 10m, memory: 32Mi } }
