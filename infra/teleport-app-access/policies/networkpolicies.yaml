# Pod isolation for the Teleport app/db/kube agent. It dials the proxy (reverse tunnel) and the
# auth service, and it is the ONLY pod allowed to reach the internal UIs and the database on
# behalf of an SSO user: ArgoCD 8080, OpenBao 8200, Grafana 3000, newapi-pg 5432, plus the API
# server for kube access. Nothing comes in except the kubelet probe.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: teleport-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: teleport-app-access
  namespace: teleport-agent
spec:
  endpointSelector:
    matchLabels: { app: teleport-app-access }
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: teleport, app.kubernetes.io/name: teleport-cluster, app.kubernetes.io/component: proxy }
      toPorts:
        - ports: [{ port: "3080", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: teleport, app.kubernetes.io/name: teleport-cluster, app.kubernetes.io/component: auth }
      toPorts:
        - ports:
            - { port: "3025", protocol: TCP }
            - { port: "3026", protocol: TCP }
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: argocd, app.kubernetes.io/name: argocd-server }
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: openbao, app.kubernetes.io/name: openbao, component: server }
      toPorts:
        - ports: [{ port: "8200", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: databases, cnpg.io/cluster: newapi-pg, cnpg.io/podRole: instance }
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
