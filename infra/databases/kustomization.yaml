apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared DB plumbing (ClusterSecretStore + pg-s3 ExternalSecrets), the monthly restore drill and
# teleport-pg (infra owns Teleport, so its cluster lives here). The other CNPG
# Cluster/ObjectStore/ScheduledBackup manifests live in the app repos (new-api,
# unorouter-bot k8s/pg.yaml), deployed via the services ApplicationSet.
resources:
  - networkpolicies.yaml
  - eso-pg-s3.yaml
  - app-scope.yaml
  - postgres/dr-drill.yaml
  - postgres/ip-retention.yaml
  - postgres/teleport-pg.yaml
  - clickhouse/clickhouse.yaml
  - clickhouse/keeper.yaml
  - clickhouse/security-exporter.yaml
