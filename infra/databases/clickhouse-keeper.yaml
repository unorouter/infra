# ClickHouse Keeper: the Raft ensemble the replicated log tables coordinate through (which
# replica holds which part, the replication queue, insert deduplication). Three members, one
# per node, so one node can be down; without a majority every replicated table turns read only
# and inserts land in the gateway's Postgres spool until it is back. It holds metadata only,
# never log rows. Server id is the pod ordinal plus one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-keeper
  namespace: databases
data:
  keeper_config.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>1</console>
      </logger>
      <listen_host>0.0.0.0</listen_host>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id from_env="KEEPER_ID"/>
        <log_storage_path>/var/lib/clickhouse-keeper/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse-keeper/coordination/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
          <raft_logs_level>warning</raft_logs_level>
        </coordination_settings>
        <raft_configuration>
          <server><id>1</id><hostname>clickhouse-keeper-0.clickhouse-keeper.databases.svc.cluster.local</hostname><port>9234</port></server>
          <server><id>2</id><hostname>clickhouse-keeper-1.clickhouse-keeper.databases.svc.cluster.local</hostname><port>9234</port></server>
          <server><id>3</id><hostname>clickhouse-keeper-2.clickhouse-keeper.databases.svc.cluster.local</hostname><port>9234</port></server>
        </raft_configuration>
      </keeper_server>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>9363</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
      </prometheus>
    </clickhouse>
---
# Headless: the Raft members address each other by pod name, also before they are Ready.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-keeper
  namespace: databases
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: clickhouse-keeper }
  ports:
    - { name: client, port: 9181 }
    - { name: raft, port: 9234 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse-keeper
  namespace: databases
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: clickhouse-keeper }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-keeper
  namespace: databases
spec:
  serviceName: clickhouse-keeper
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: clickhouse-keeper }
  template:
    metadata:
      labels: { app: clickhouse-keeper }
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: clickhouse-keeper }
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keeper
          image: clickhouse/clickhouse-keeper:25.8.33.6
          command:
            - bash
            - -c
            - export KEEPER_ID=$(( ${HOSTNAME##*-} + 1 )); exec clickhouse-keeper --config-file=/etc/clickhouse-keeper/keeper_config.xml
          ports:
            - { name: client, containerPort: 9181 }
            - { name: raft, containerPort: 9234 }
            - { name: metrics, containerPort: 9363 }
          readinessProbe:
            tcpSocket: { port: 9181 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9181 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse-keeper }
            - { name: config, mountPath: /etc/clickhouse-keeper/keeper_config.xml, subPath: keeper_config.xml }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: clickhouse-keeper }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 5Gi }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clickhouse-keeper
  namespace: databases
spec:
  endpointSelector:
    matchLabels: { app: clickhouse-keeper }
  ingress:
    - fromEndpoints:
        - matchLabels: { app: clickhouse }
      toPorts:
        - ports: [{ port: "9181", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { app: clickhouse-keeper }
      toPorts:
        - ports: [{ port: "9234", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus }
      toPorts:
        - ports: [{ port: "9363", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "9181", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { app: clickhouse-keeper }
      toPorts:
        - ports: [{ port: "9234", protocol: TCP }]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: clickhouse-keeper
  namespace: databases
spec:
  selector:
    matchLabels: { app: clickhouse-keeper }
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
