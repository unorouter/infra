# Daily retention for newapi-pg: users.register_ip.
#
# An address is personal data (CJEU C-582/14 Breyer). 30 days is the forensic buffer and
# the period declared in the Datenschutzerklärung. Art. 5(1)(e) GDPR: no longer than the
# purpose needs.
#
# logs.ip is no longer handled here: the gateway logs live in ClickHouse, where the ip
# column carries a 30-day TTL that resets it to '' during merges. Until the Postgres
# `logs` table is dropped, rows it still holds from before the cutover keep their
# addresses for at most 30 days after it, so drop or blank it by then.
#
# It blanks one column and never deletes a row. The role it runs as
# (ip-retention-least-privilege.sql, hand-applied) has UPDATE on register_ip only and no
# DELETE anywhere, so a bug here cannot lose a row.
#
# First rollout, dependency before caller:
#   1. OpenBao secret/newapi-pg-ip-retention {username: ip_retention, password: ...}, and the
#      path in loki/logql-rules.yaml's ESO allowlist (or the first sync raises an alert)
#   2. this file: ESO materialises Secret newapi-pg-ip-retention in databases
#   3. new-api/k8s/pg.yaml managed.roles ip_retention: CNPG creates the login
#   4. as dbadmin: infra/databases/ip-retention-least-privilege.sql
#   5. kubectl -n databases create job --from=cronjob/ip-retention ip-retention-manual,
#      then read its privacy.ip_retention line: usersRemaining must be 0
#
# register_ip is guarded on register_ip_hash being present (new-api writes both, common/register_ip_hash.go), so an
# address is never cleared before the marker the abuse caps compare on exists. Deploy
# order there was: HMAC key into OpenBao, new-api backfills every row, only then this.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newapi-pg-ip-retention
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-platform, kind: ClusterSecretStore}
  target: {name: newapi-pg-ip-retention, creationPolicy: Owner}
  dataFrom:
    - extract: {key: newapi-pg-ip-retention}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ip-retention
  namespace: databases
data:
  retention.ts: |
    import { SQL } from "bun";
    import { readFileSync } from "node:fs";

    const RETENTION_DAYS = 30;
    const BATCH = 10_000;
    const MAX_BATCHES = 300; // A ceiling that surfaces as usersRemaining > 0.

    const cutoff = Math.floor(Date.now() / 1000) - RETENTION_DAYS * 86_400;

    const db = new SQL({
      hostname: "newapi-pg-rw.databases.svc",
      port: 5432,
      database: "newapi",
      username: "ip_retention",
      password: process.env.PGPASSWORD!,
      tls: { ca: readFileSync("/pg-ca/ca.crt", "utf8") },
      max: 1,
      connectionTimeout: 10,
    });

    // The per-IP registration cap and the Discord reward check compare register_ip_hash,
    // so the address itself is no longer needed once it is past the window.
    //
    // The hash guard is the safety interlock, not a filter. A row whose marker is not
    // written yet keeps its address, so a half-finished backfill can never cost the
    // caps their history. It also means this is safe to deploy before the backfill has
    // caught every row: those rows simply wait for the next run.
    async function blankRegisterIps(): Promise<number> {
      let total = 0;
      for (let i = 0; i < MAX_BATCHES; i++) {
        const r = await db`UPDATE public.users SET register_ip = '' WHERE id IN (
             SELECT id FROM public.users
             WHERE register_ip <> '' AND COALESCE(register_ip_hash, '') <> ''
               AND created_at < ${cutoff}
             ORDER BY id LIMIT ${BATCH})`;
        total += r.count;
        if (r.count < BATCH) break;
      }
      return total;
    }

    try {
      const users = await blankRegisterIps();
      // Counted separately: rows waiting on a marker are not a failure, they are the
      // interlock doing its job, and they should not make the job exit non-zero.
      const [{ n: usersRemaining }] = await db`SELECT count(*)::int AS n FROM public.users
                                               WHERE register_ip <> '' AND COALESCE(register_ip_hash, '') <> ''
                                                 AND created_at < ${cutoff}`;
      const [{ n: usersAwaitingHash }] = await db`SELECT count(*)::int AS n FROM public.users
                                                  WHERE register_ip <> '' AND COALESCE(register_ip_hash, '') = ''`;
      console.log(JSON.stringify({
        event: "privacy.ip_retention", cutoff, users, usersRemaining, usersAwaitingHash,
      }));
      if (usersRemaining > 0) process.exitCode = 1;
    } catch (err) {
      console.error("ip retention failed; no rows deleted, nothing touched beyond users.register_ip", err);
      process.exitCode = 1;
    } finally {
      await db.close();
    }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ip-retention
  namespace: databases
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels: {app: ip-retention}
        spec:
          priorityClassName: batch
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: retention
              image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
              command: [bun, /app/retention.ts]
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: newapi-pg-ip-retention, key: password}}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: app, mountPath: /app, readOnly: true}
                - {name: pg-ca, mountPath: /pg-ca, readOnly: true}
          volumes:
            - name: app
              configMap: {name: ip-retention}
            # ca.crt only: the secret also carries ca.key, which the job must never see
            - name: pg-ca
              secret:
                secretName: newapi-pg-ca
                items: [{key: ca.crt, path: ca.crt}]
---
# job -> DNS and the newapi-pg instances, nothing else
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ip-retention
  namespace: databases
spec:
  endpointSelector:
    matchLabels: {app: ip-retention}
  egress:
    - toEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
    - toEndpoints:
        - matchLabels: {cnpg.io/cluster: newapi-pg, cnpg.io/podRole: instance}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
---
# newapi-pg instances <- the job. Its own object, like pat-audit-archive, so the main
# newapi-pg policy in networkpolicies.yaml stays untouched.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ip-retention-ingress
  namespace: databases
spec:
  endpointSelector:
    matchLabels: {cnpg.io/cluster: newapi-pg, cnpg.io/podRole: instance}
  ingress:
    - fromEndpoints:
        - matchLabels: {app: ip-retention}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
