# Teleport's cluster state and audit events, so auth runs two replicas on different nodes
# (on 2026-11-04 the single auth pod sat on node11's SQLite volume and its OOM took all access
# down). Its own cluster, not a database in newapi-pg: the backend needs wal2json logical
# decoding and a REPLICATION role, and Teleport must not wait on a newapi-pg restore.
# Change feed slots are temporary, so a failover only makes auth reconnect and recreate one.
# Archived like bot-pg (barman through the s3-gateway, serverName teleport-pg-v1); a DR create
# recovers from v1 and archives to v2.
# Hetzner Object Storage through the in-cluster s3-gateway (client side encryption). The bucket
# is Object Locked: no retentionPolicy, its lifecycle expires objects.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: teleport-pg-hz
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  configuration:
    destinationPath: s3://unorouter-backups/
    endpointURL: https://s3.unorouter.com
    s3Credentials:
      accessKeyId:
        name: s3gw
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3gw
        key: ACCESS_SECRET_KEY
      region:
        name: s3gw
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: teleport-pg
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: pgdata,scratch-data,shm
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-bookworm@sha256:045f843b885679b7f1265c2961f3fa66c2d374e9ebe1dfcc4aa7fb3b8e58bd1f
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  resources:
    requests: { cpu: 50m, memory: 256Mi }
  storage:
    size: 2Gi
    storageClass: local-path
  probes:
    liveness:
      isolationCheck:
        enabled: true
  postgresql:
    parameters:
      wal_level: logical
      # PostgreSQL 18.6 only decodes through plugins on this list
      output_plugin_libraries: "pgoutput, test_decoding, wal2json"
      # a stalled change feed slot must not fill the volume
      max_slot_wal_keep_size: 512MB
      shared_buffers: 64MB
    extensions:
      - name: wal2json
        image:
          reference: ghcr.io/cloudnative-pg/wal2json:2.7-202610292025-18-bookworm@sha256:39d966ea8bc1266daa066bd24e27fadb28c5a86e8f42762bd4307ad133890e1a
  bootstrap:
    initdb:
      database: teleport_backend
      owner: teleport
  # the initdb owner keeps the password CNPG generated (teleport-pg-app); this only adds
  # REPLICATION, which the change feed needs
  managed:
    roles:
      - name: teleport
        ensure: present
        login: true
        replication: true
        inherit: true
        connectionLimit: -1
        inRoles: []
  # webhook defaults written out: plugins is an atomic list, ArgoCD would stay OutOfSync
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: teleport-pg-hz
        serverName: teleport-pg-v1
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: teleport-pg-daily
  namespace: databases
spec:
  schedule: "0 45 3 * * *" # 03:45 UTC daily, offset from the other clusters
  backupOwnerReference: self
  immediate: true
  cluster:
    name: teleport-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: teleport-pg-audit
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  name: teleport_audit
  owner: teleport
  cluster:
    name: teleport-pg
  databaseReclaimPolicy: retain
---
# The External Secrets kubernetes provider in the teleport namespace mirrors the password and
# the server CA certificate (verify-full) into the auth pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-teleport-pg
  namespace: databases
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [teleport-pg-app, teleport-pg-ca]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-teleport-pg-reader
  namespace: databases
subjects:
  - kind: ServiceAccount
    name: eso-teleport-pg-reader
    namespace: teleport
roleRef:
  kind: Role
  name: read-teleport-pg
  apiGroup: rbac.authorization.k8s.io
