# Pod isolation for the Postgres clusters. Default-deny for every pod here; each CNPG cluster
# gets its own allow set so bot-pg and newapi-pg cannot even talk to each other. Ingress:
# 5432 from the application pods that own the database (plus Teleport database access for
# newapi-pg), 8000 (instance manager) from the kubelet probes and the CNPG operator, 9187
# from Prometheus, and the cluster's own instances on 5432 (replication) and 8000 (status).
# Egress: DNS, the API server (the instance manager watches its own resources; the local
# node's API server shows up as the host identity, hence both entities), the cluster's
# own instances, and the s3-gateway on 8443 for the backup archive.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: databases
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: newapi-pg
  namespace: databases
spec:
  endpointSelector:
    matchLabels: { cnpg.io/cluster: newapi-pg, cnpg.io/podRole: instance }
  ingress:
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: services, app: new-api }
        - matchLabels: { io.kubernetes.pod.namespace: teleport-agent, app: teleport-app-access }
        - matchLabels: { cnpg.io/cluster: newapi-pg, cnpg.io/podRole: instance }
        # Grafana reads the pre-aggregated tables (quota_data, model_status_pings,
        # perf_metrics, channel_diagnostics) as the column-masked `reader` role. Its
        # datasource points at the -ro service, so dashboards never touch the primary.
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: cnpg-system, app.kubernetes.io/name: cloudnative-pg }
        - matchLabels: { cnpg.io/cluster: newapi-pg, cnpg.io/podRole: instance }
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus }
      toPorts:
        - ports: [{ port: "9187", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEndpoints:
        - matchLabels: { cnpg.io/cluster: newapi-pg, cnpg.io/podRole: instance }
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
            - { port: "8000", protocol: TCP }
    - toEntities: [kube-apiserver, host]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: s3-gateway, app: s3-gateway }
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bot-pg
  namespace: databases
spec:
  endpointSelector:
    matchLabels: { cnpg.io/cluster: bot-pg, cnpg.io/podRole: instance }
  ingress:
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: services, app: unorouter-bot }
        - matchLabels: { cnpg.io/cluster: bot-pg, cnpg.io/podRole: instance }
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: cnpg-system, app.kubernetes.io/name: cloudnative-pg }
        - matchLabels: { cnpg.io/cluster: bot-pg, cnpg.io/podRole: instance }
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus }
      toPorts:
        - ports: [{ port: "9187", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEndpoints:
        - matchLabels: { cnpg.io/cluster: bot-pg, cnpg.io/podRole: instance }
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
            - { port: "8000", protocol: TCP }
    - toEntities: [kube-apiserver, host]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: s3-gateway, app: s3-gateway }
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
---
# CNPG bootstrap Jobs (initdb, full-recovery) carry cnpg.io/jobRole instead of podRole and sat
# under default deny until 2026-09-09: a DR recovery needs the API server, DNS and the
# s3-gateway from the job pod, before any instance pod exists.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-jobs
  namespace: databases
spec:
  endpointSelector:
    matchExpressions:
      - { key: cnpg.io/jobRole, operator: Exists }
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver, host]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: s3-gateway, app: s3-gateway }
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
