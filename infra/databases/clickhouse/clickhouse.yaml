# ClickHouse: the gateway's log store (new-api LOG_SQL_DSN). Postgres keeps every other table.
# Recent parts sit on the local volume; parts older than the gateway's move window go to the
# unorouter-clickhouse bucket through an `encrypted` disk (AES-256-CTR, key in OpenBao
# secret/clickhouse cold_key_hex), so Hetzner only ever holds ciphertext. That key is the only
# way to read the cold tier: losing it loses every moved part, the backups below do not need it.
#
# The cold tier talks to Hetzner directly, not through the s3-gateway: merges and TTL moves make
# many small reads, writes and deletes that the gateway's write cache is not built for. The
# bucket is unlocked and unversioned because ClickHouse deletes replaced parts itself.
#
# Users: admin (entrypoint, access management), gateway (new-api: create, insert, alter on
# new_api_logs) and reader (read only). default is removed. Backups: see the CronJob below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-platform
    kind: ClusterSecretStore
  target:
    name: clickhouse
    creationPolicy: Owner
  data:
    - { secretKey: CLICKHOUSE_PASSWORD, remoteRef: { key: clickhouse, property: admin_password } }
    - { secretKey: CH_GATEWAY_PASSWORD, remoteRef: { key: clickhouse, property: gateway_password } }
    - { secretKey: CH_READER_PASSWORD, remoteRef: { key: clickhouse, property: reader_password } }
    - { secretKey: CH_COLD_KEY, remoteRef: { key: clickhouse, property: cold_key_hex } }
    - { secretKey: CH_COLD_ACCESS_KEY_ID, remoteRef: { key: pg-s3, property: ACCESS_KEY_ID } }
    - { secretKey: CH_COLD_SECRET_ACCESS_KEY, remoteRef: { key: pg-s3, property: ACCESS_SECRET_KEY } }
    - { secretKey: CH_BACKUP_ACCESS_KEY_ID, remoteRef: { key: s3gw, property: ACCESS_KEY_ID } }
    - { secretKey: CH_BACKUP_SECRET_ACCESS_KEY, remoteRef: { key: s3gw, property: ACCESS_SECRET_KEY } }
    - { secretKey: NEWAPI_PG_DICT_PASSWORD, remoteRef: { key: newapi-pg-clickhouse-dict, property: password } }
    - { secretKey: CH_INTERSERVER_PASSWORD, remoteRef: { key: clickhouse, property: interserver_password } }
---
# Password of the clickhouse_dict Postgres role (new-api/k8s/pg.yaml managed.roles).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newapi-pg-clickhouse-dict
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-platform
    kind: ClusterSecretStore
  target:
    name: newapi-pg-clickhouse-dict
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract:
        key: newapi-pg-clickhouse-dict
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse
  namespace: databases
data:
  storage.xml: |
    <clickhouse>
      <storage_configuration>
        <disks>
          <s3cold>
            <type>s3</type>
            <endpoint>https://fsn1.your-objectstorage.com/unorouter-clickhouse/prod/</endpoint>
            <access_key_id from_env="CH_COLD_ACCESS_KEY_ID"/>
            <secret_access_key from_env="CH_COLD_SECRET_ACCESS_KEY"/>
            <region>fsn1</region>
            <metadata_path>/var/lib/clickhouse/disks/s3cold/</metadata_path>
          </s3cold>
          <s3cache>
            <type>cache</type>
            <disk>s3cold</disk>
            <path>/var/lib/clickhouse/s3cache/</path>
            <max_size>4Gi</max_size>
          </s3cache>
          <cold>
            <type>encrypted</type>
            <disk>s3cache</disk>
            <path>data/</path>
            <algorithm>AES_256_CTR</algorithm>
            <key_hex from_env="CH_COLD_KEY"/>
          </cold>
          <!-- s3_plain keeps real object names, so a backup restores without this pod's metadata -->
          <backups>
            <type>s3_plain</type>
            <endpoint>https://s3.unorouter.com/unorouter-backups/clickhouse/</endpoint>
            <access_key_id from_env="CH_BACKUP_ACCESS_KEY_ID"/>
            <secret_access_key from_env="CH_BACKUP_SECRET_ACCESS_KEY"/>
            <region>fsn1</region>
          </backups>
        </disks>
        <policies>
          <!-- the first volume must be called default to switch an existing table onto this policy -->
          <tiered>
            <volumes>
              <default><disk>default</disk></default>
              <cold><disk>cold</disk></cold>
            </volumes>
          </tiered>
        </policies>
      </storage_configuration>
      <backups>
        <allowed_disk>backups</allowed_disk>
      </backups>
    </clickhouse>
  server.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>1</console>
      </logger>
      <max_server_memory_usage_to_ram_ratio>0.75</max_server_memory_usage_to_ram_ratio>
      <!-- the cgroup figure counts reclaimable page cache: 2.2 GiB of it pushed the tracker past
           the cap and inserts were refused (2026-10-04); jemalloc's own figure is the real usage -->
      <memory_worker_use_cgroup>0</memory_worker_use_cgroup>
      <!-- defaults are 5 GiB each, sized for a big host: the gateway's token lookups filled them
           past the server cap and the overcommit tracker stopped inserts (2026-10-04) -->
      <mark_cache_size>536870912</mark_cache_size>
      <index_mark_cache_size>134217728</index_mark_cache_size>
      <uncompressed_cache_size>0</uncompressed_cache_size>
      <!-- Altinity's low memory profile (kb.altinity.com, configure_clickhouse_for_low_mem_envs):
           the defaults assume 32 GiB and up. Fetch and schedule pools stay above its single node
           values because every insert is fetched by two other replicas. -->
      <mysql_port remove="1"/>
      <postgresql_port remove="1"/>
      <!-- the gateway holds every insert open up to 2 s for the async flush, 11 to 16 per replica:
           a cap of 16 refused about 190 of them in an hour; only SELECTs carry real memory -->
      <max_concurrent_queries>200</max_concurrent_queries>
      <max_concurrent_select_queries>16</max_concurrent_select_queries>
      <max_connections>128</max_connections>
      <background_pool_size>4</background_pool_size>
      <background_merges_mutations_concurrency_ratio>2</background_merges_mutations_concurrency_ratio>
      <background_merges_mutations_scheduling_policy>round_robin</background_merges_mutations_scheduling_policy>
      <background_fetches_pool_size>2</background_fetches_pool_size>
      <background_move_pool_size>1</background_move_pool_size>
      <background_common_pool_size>4</background_common_pool_size>
      <background_schedule_pool_size>16</background_schedule_pool_size>
      <background_buffer_flush_schedule_pool_size>1</background_buffer_flush_schedule_pool_size>
      <background_message_broker_schedule_pool_size>1</background_message_broker_schedule_pool_size>
      <background_distributed_schedule_pool_size>1</background_distributed_schedule_pool_size>
      <!-- one replica only: an acknowledged insert must be on disk, not in the page cache -->
      <merge_tree>
        <fsync_after_insert>1</fsync_after_insert>
        <fsync_part_directory>1</fsync_part_directory>
        <!-- wide parts only from 128 MiB and those always merge vertically: a horizontal merge
             opens a buffer pair per column at once, 2.3 GiB for query_metric_log (Altinity) -->
        <min_bytes_for_wide_part>134217728</min_bytes_for_wide_part>
        <vertical_merge_algorithm_min_bytes_to_activate>134217728</vertical_merge_algorithm_min_bytes_to_activate>
        <merge_max_block_size>1024</merge_max_block_size>
        <max_bytes_to_merge_at_max_space_in_pool>1073741824</max_bytes_to_merge_at_max_space_in_pool>
        <!-- the defaults (8) assume a pool of 16: with 8 slots every merge would count as starved -->
        <number_of_free_entries_in_pool_to_lower_max_size_of_merge>2</number_of_free_entries_in_pool_to_lower_max_size_of_merge>
        <number_of_free_entries_in_pool_to_execute_mutation>2</number_of_free_entries_in_pool_to_execute_mutation>
        <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>2</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
      </merge_tree>
      <!-- ZSTD over the default LZ4: the log text compresses about 11x instead of 7x -->
      <compression>
        <case>
          <method>zstd</method>
          <level>3</level>
        </case>
      </compression>
      <!-- newapi-pg replicas through the column-scoped clickhouse_dict role; password stays out of DDL -->
      <named_collections>
        <newapi_pg>
          <host>newapi-pg-ro.databases.svc.cluster.local</host>
          <port>5432</port>
          <database>newapi</database>
          <user>clickhouse_dict</user>
          <password from_env="NEWAPI_PG_DICT_PASSWORD"/>
        </newapi_pg>
      </named_collections>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>9363</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
      </prometheus>
      <!-- system logs have no TTL by default and would outgrow the log data itself -->
      <query_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_log>
      <query_thread_log remove="remove"/>
      <query_views_log remove="remove"/>
      <part_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></part_log>
      <trace_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></trace_log>
      <!-- 1,435 columns on 25.8: each merge reserves ~2 MiB per column twice, ~5 GiB spikes that
           made the overcommit tracker stop inserts (2026-10-04). Prometheus scrapes these. -->
      <metric_log remove="remove"/>
      <!-- the per query twin, 1,021 columns: its merges into wide parts held 2.3 GiB of stream
           buffers outside the tracker and stopped inserts for hours (heap profiles, 2026-10-05) -->
      <query_metric_log remove="remove"/>
      <asynchronous_metric_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></asynchronous_metric_log>
      <text_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></text_log>
      <error_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></error_log>
      <processors_profile_log remove="remove"/>
      <opentelemetry_span_log remove="remove"/>
      <latency_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></latency_log>
      <backup_log><ttl>event_date + INTERVAL 90 DAY DELETE</ttl></backup_log>
    </clickhouse>
  replication.xml: |
    <clickhouse>
      <zookeeper>
        <node><host>clickhouse-keeper-0.clickhouse-keeper.databases.svc.cluster.local</host><port>9181</port></node>
        <node><host>clickhouse-keeper-1.clickhouse-keeper.databases.svc.cluster.local</host><port>9181</port></node>
        <node><host>clickhouse-keeper-2.clickhouse-keeper.databases.svc.cluster.local</host><port>9181</port></node>
        <session_timeout_ms>30000</session_timeout_ms>
      </zookeeper>
      <macros>
        <shard>1</shard>
        <replica from_env="HOSTNAME"/>
      </macros>
      <default_replica_path>/clickhouse/tables/{database}/{table}</default_replica_path>
      <default_replica_name>{replica}</default_replica_name>
      <!-- replicas fetch parts from each other here, by pod name through the headless Service -->
      <interserver_http_host from_env="CH_INTERSERVER_HOST"/>
      <interserver_http_port>9009</interserver_http_port>
      <interserver_http_credentials>
        <user>interserver</user>
        <password from_env="CH_INTERSERVER_PASSWORD"/>
      </interserver_http_credentials>
      <!-- for clusterAllReplicas (the backup chain lookup) and ON CLUSTER DDL -->
      <remote_servers>
        <logs>
          <shard>
            <internal_replication>true</internal_replication>
            <replica><host>clickhouse-0.clickhouse-headless.databases.svc.cluster.local</host><port>9000</port><user>admin</user><password from_env="CLICKHOUSE_PASSWORD"/></replica>
            <replica><host>clickhouse-1.clickhouse-headless.databases.svc.cluster.local</host><port>9000</port><user>admin</user><password from_env="CLICKHOUSE_PASSWORD"/></replica>
            <replica><host>clickhouse-2.clickhouse-headless.databases.svc.cluster.local</host><port>9000</port><user>admin</user><password from_env="CLICKHOUSE_PASSWORD"/></replica>
          </shard>
        </logs>
      </remote_servers>
    </clickhouse>
  users.xml: |
    <clickhouse>
      <profiles>
        <!-- every user inherits this; spill to disk well under the 3 GiB server cap -->
        <default>
          <max_threads>2</max_threads>
          <max_block_size>8192</max_block_size>
          <queue_max_wait_ms>1000</queue_max_wait_ms>
          <input_format_parallel_parsing>0</input_format_parallel_parsing>
          <output_format_parallel_formatting>0</output_format_parallel_formatting>
          <max_bytes_before_external_group_by>1073741824</max_bytes_before_external_group_by>
          <max_bytes_before_external_sort>1073741824</max_bytes_before_external_sort>
        </default>
        <!-- one part every 2 s instead of every 200 ms: about 4 parts a second kept 1,000+
             merges running every 5 minutes; 2 s fits in the gateway's 10 s write timeout -->
        <gateway>
          <profile>default</profile>
          <async_insert_use_adaptive_busy_timeout>0</async_insert_use_adaptive_busy_timeout>
          <async_insert_busy_timeout_max_ms>2000</async_insert_busy_timeout_max_ms>
        </gateway>
        <reader>
          <profile>default</profile>
          <readonly>2</readonly>
          <max_execution_time>120</max_execution_time>
          <max_memory_usage>2000000000</max_memory_usage>
        </reader>
      </profiles>
      <users>
        <default remove="remove"/>
        <!-- merges into the entrypoint's admin: the newapi_pg named collection is config defined -->
        <admin>
          <named_collection_control>1</named_collection_control>
          <show_named_collections>1</show_named_collections>
        </admin>
        <gateway>
          <password from_env="CH_GATEWAY_PASSWORD"/>
          <networks><ip>::/0</ip></networks>
          <profile>gateway</profile>
          <quota>default</quota>
          <!-- append-only like the Postgres audit_logs guard (protect-audit-logs.sql): no ALTER,
               so no DELETE, UPDATE, TTL or partition drop on either table. The tables already
               match the gateway's DDL, so its startup migration issues no ALTER; TTL or policy
               changes are made by admin. -->
          <grants>
            <query>GRANT SELECT, INSERT, CREATE TABLE ON new_api_logs.logs</query>
            <query>GRANT SELECT, INSERT, CREATE TABLE ON new_api_logs.audit_logs</query>
          </grants>
        </gateway>
        <reader>
          <password from_env="CH_READER_PASSWORD"/>
          <networks><ip>::/0</ip></networks>
          <profile>reader</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT SELECT ON new_api_logs.*</query>
          </grants>
        </reader>
      </users>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: databases
spec:
  selector: { app: clickhouse }
  ports:
    - { name: native, port: 9000, targetPort: 9000 }
    - { name: http, port: 8123, targetPort: 8123 }
    - { name: metrics, port: 9363, targetPort: 9363 }
---
# Governing Service: stable pod names for the interserver fetches and the cluster definition.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  namespace: databases
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: clickhouse }
  ports:
    - { name: native, port: 9000 }
    - { name: interserver, port: 9009 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse
  namespace: databases
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: clickhouse }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: databases
spec:
  serviceName: clickhouse-headless
  replicas: 3
  selector:
    matchLabels: { app: clickhouse }
  template:
    metadata:
      labels: { app: clickhouse }
      annotations:
        # the local volume is restorable from the nightly ClickHouse backup; Velero would copy it twice
        backup.velero.io/backup-volumes-excludes: data
        # pool sizes are read once at start: bump with every config change so the replicas roll
        config-rev: "3"
    spec:
      automountServiceAccountToken: false
      # one replica per node; each local-path volume pins its pod to the node it was made on
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: clickhouse }
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8.33.6@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
          command:
            - bash
            - -c
            - export CH_INTERSERVER_HOST="$HOSTNAME.clickhouse-headless.databases.svc.cluster.local"; exec /entrypoint.sh
          env:
            - { name: CLICKHOUSE_USER, value: admin }
            - { name: CLICKHOUSE_DB, value: new_api_logs }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          envFrom:
            - secretRef: { name: clickhouse }
          ports:
            - { name: native, containerPort: 9000 }
            - { name: http, containerPort: 8123 }
            - { name: metrics, containerPort: 9363 }
            - { name: interserver, containerPort: 9009 }
          # ready = both replicated tables exist, Keeper reachable, under 5 minutes behind: a
          # replica that lost Keeper still answers /ping but refuses every insert, and a new one
          # would serve a half fetched history
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - clickhouse-client --user admin --password "$CLICKHOUSE_PASSWORD" -q "SELECT (SELECT count() FROM system.replicas WHERE database = 'new_api_logs' AND table IN ('logs', 'audit_logs') AND NOT is_readonly AND NOT is_session_expired AND absolute_delay < 300) = 2" | grep -qx 1
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            # peak 2.3 GiB on the replica that runs the backups once metric_log was gone; the
            # server caps itself at 75 % (3 GiB) and a refused insert goes to the spool
            requests: { cpu: 250m, memory: 1536Mi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/storage.xml, subPath: storage.xml }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/server.xml, subPath: server.xml }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/replication.xml, subPath: replication.xml }
            - { name: config, mountPath: /etc/clickhouse-server/users.d/users.xml, subPath: users.xml }
      volumes:
        - name: config
          configMap: { name: clickhouse }
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 30Gi }
---
# Hourly backup through the s3-gateway into the locked unorouter-backups bucket (crypt there,
# 30 day lock, 31 day expiry). The first run of each ISO week writes a full backup, every other
# run is incremental on the previous one of that week (system.backup_log), so an hour of rows is
# the most a lost volume costs and no chain outlives the bucket's expiry. RESTORE follows the
# chain by itself: RESTORE DATABASE new_api_logs FROM Disk('backups', 'new_api_logs/<week>/<newest>').
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-backup
  namespace: databases
spec:
  # after the newapi-pg base backup (03:00, about 90 min) has left the gateway
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels: { app: clickhouse-backup }
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: clickhouse/clickhouse-server:25.8.33.6@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
              env:
                - name: CLICKHOUSE_PASSWORD
                  valueFrom: { secretKeyRef: { name: clickhouse, key: CLICKHOUSE_PASSWORD } }
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  q() { clickhouse-client --host clickhouse --user admin --password "$CLICKHOUSE_PASSWORD" --query "$1"; }
                  week=new_api_logs/$(date -u +%G-W%V); hour=$(date -u +%FT%H%M)
                  # cold parts are stored decrypted: a restore must not depend on the cold tier key
                  plain="decrypt_files_from_encrypted_disks = 1"
                  base=$(q "SELECT name FROM clusterAllReplicas('logs', system.backup_log) WHERE status = 'BACKUP_CREATED' AND startsWith(name, 'Disk(''backups'', ''$week/') ORDER BY event_time_microseconds DESC LIMIT 1 SETTINGS skip_unavailable_shards = 1 FORMAT TSVRaw")
                  if [ -n "$base" ]; then
                    q "BACKUP DATABASE new_api_logs TO Disk('backups', '$week/$hour') SETTINGS $plain, base_backup = $base"
                    echo "incremental $week/$hour on $base done"
                  else
                    q "BACKUP DATABASE new_api_logs TO Disk('backups', '$week/$hour') SETTINGS $plain"
                    echo "full $week/$hour done"
                  fi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { memory: 256Mi }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clickhouse
  namespace: databases
spec:
  endpointSelector:
    matchLabels: { app: clickhouse }
  ingress:
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: services, app: new-api }
        - matchLabels: { io.kubernetes.pod.namespace: databases, app: clickhouse-backup }
        - matchLabels: { io.kubernetes.pod.namespace: databases, app: clickhouse }
      toPorts:
        - ports: [{ port: "9000", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: databases, app: clickhouse }
      toPorts:
        - ports: [{ port: "9009", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus }
      toPorts:
        - ports: [{ port: "9363", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8123", protocol: TCP }]
    # Teleport app `clickhouse`: operators and the laptop reconcile, as ClickHouse's reader
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: teleport-agent, app: teleport-app-access }
      toPorts:
        - ports: [{ port: "8123", protocol: TCP }]
  egress:
    # Hetzner Object Storage for the cold tier; no FQDN rules on this cluster (DNS proxy)
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: s3-gateway, app: s3-gateway }
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { cnpg.io/cluster: newapi-pg, cnpg.io/podRole: instance }
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: clickhouse }
      toPorts:
        - ports:
            - { port: "9000", protocol: TCP }
            - { port: "9009", protocol: TCP }
    - toEndpoints:
        - matchLabels: { app: clickhouse-keeper }
      toPorts:
        - ports: [{ port: "9181", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clickhouse-backup
  namespace: databases
spec:
  endpointSelector:
    matchLabels: { app: clickhouse-backup }
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: databases, app: clickhouse }
      toPorts:
        - ports: [{ port: "9000", protocol: TCP }]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: clickhouse
  namespace: databases
spec:
  selector:
    matchLabels: { app: clickhouse }
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
