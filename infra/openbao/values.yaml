# OpenBao (Vault fork, MPL-2.0). Drop-in for the hashicorp/vault chart.
# Shamir manual unseal: every restart needs `dr.sh unseal`. Auto-unseal via softhsm is
# possible without Enterprise if the manual step ever becomes a problem.
server:
  image:
    registry: quay.io
    repository: openbao/openbao
    tag: "2.6.0"
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable     = 1
        }

        storage "raft" {
          path = "/openbao/data"
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 5Gi
    mountPath: /openbao/data

  updateStrategyType: OnDelete

ui:
  enabled: true

injector:
  # ESO is the sync path; injector not needed
  enabled: false
