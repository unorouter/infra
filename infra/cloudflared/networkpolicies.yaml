# Pod isolation for the tunnel namespace. The plain NetworkPolicy denies everything for any
# pod here that no Cilium policy selects; the Cilium policies below carry the allows, because
# two of them need Cilium features: the tunnel edge and PostHog are hostnames (toFQDNs, which
# needs the DNS rule so the proxy sees the answers), and the restarter talks to the API server
# (kube-apiserver entity). Ports are the pods' container ports, policy is evaluated after
# service translation (teleport Service 443 is pod 3080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cloudflared
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  endpointSelector:
    matchLabels: { app: cloudflared }
  ingress:
    # Prometheus scrapes and the kubelet probes the metrics port; nothing else comes in,
    # the tunnel is outbound only.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{ port: "2000", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "2000", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    # Every origin named in cloudflared-config ingress rules.
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: services, app: new-api }
        - matchLabels: { io.kubernetes.pod.namespace: services, app: unorouter }
        - matchLabels: { io.kubernetes.pod.namespace: services, app: unorouter-mcp }
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: services, app: unorouter-bot }
        - matchLabels: { io.kubernetes.pod.namespace: services, app: uno-import }
      toPorts:
        - ports: [{ port: "4000", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: teleport
            app.kubernetes.io/name: teleport-cluster
            app.kubernetes.io/component: proxy
      toPorts:
        - ports: [{ port: "3080", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: openbao
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports: [{ port: "8200", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: dex, app: dex }
      toPorts:
        - ports: [{ port: "5556", protocol: TCP }]
    # Cloudflare edge (region1/region2.v2.argotunnel.com) and the two PostHog origins the
    # ph.unorouter.com route proxies to. Nothing else leaves the cluster from here.
    - toFQDNs:
        - matchPattern: "*.argotunnel.com"
      toPorts:
        - ports:
            - { port: "7844", protocol: TCP }
            - { port: "7844", protocol: UDP }
            - { port: "443", protocol: TCP }
    - toFQDNs:
        - matchName: eu.i.posthog.com
        - matchName: eu-assets.i.posthog.com
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared-restarter
  namespace: cloudflared
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: cloudflared-restarter
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - { port: "6443", protocol: TCP }
            - { port: "443", protocol: TCP }
