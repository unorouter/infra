# Pod isolation for the tunnel namespace. The plain NetworkPolicy denies everything for any
# pod here that no Cilium policy selects; the Cilium policies carry the allows because the
# restarter needs the kube-apiserver entity. Ports are container ports: policy is evaluated
# after service translation (teleport Service 443 is pod 3080).
#
# No toFQDNs and no DNS L7 rule anywhere on this cluster: with socket-LB, vxlan and legacy
# host routing the transparent DNS proxy redirect drops every query before it reaches the
# proxy socket (cilium/cilium#46284), which took mcp, bot and the Teleport-routed hosts down
# for 90 seconds on 2026-09-07. The tunnel edge is therefore its two documented /24s and the
# PostHog origins of the ph.unorouter.com route are "world on 443" from this pod only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cloudflared
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  endpointSelector:
    matchLabels: { app: cloudflared }
  ingress:
    # Prometheus scrapes and the kubelet probes the metrics port; nothing else comes in,
    # the tunnel is outbound only.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{ port: "2000", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "2000", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Every origin named in cloudflared-config ingress rules.
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: services, app: new-api }
        - matchLabels: { io.kubernetes.pod.namespace: services, app: unorouter }
        - matchLabels: { io.kubernetes.pod.namespace: services, app: unorouter-mcp }
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: services, app: unorouter-bot }
        - matchLabels: { io.kubernetes.pod.namespace: services, app: uno-import }
      toPorts:
        - ports: [{ port: "4000", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: teleport
            app.kubernetes.io/name: teleport-cluster
            app.kubernetes.io/component: proxy
      toPorts:
        - ports: [{ port: "3080", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: dex, app: dex }
      toPorts:
        - ports: [{ port: "5556", protocol: TCP }]
    # Cloudflare edge: region1 and region2.v2.argotunnel.com live in these two ranges.
    - toCIDR: [198.41.192.0/24, 198.41.200.0/24]
      toPorts:
        - ports:
            - { port: "7844", protocol: TCP }
            - { port: "7844", protocol: UDP }
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared-restarter
  namespace: cloudflared
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: cloudflared-restarter
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - { port: "6443", protocol: TCP }
            - { port: "443", protocol: TCP }
