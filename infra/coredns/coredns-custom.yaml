# Imported by the Corefile (import /etc/coredns/custom/*.override). In-cluster clients, above
# all the Teleport agent, reach the proxy directly instead of through Cloudflare: the reverse
# tunnel needs end-to-end TLS with ALPN, which an L7 edge cannot pass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  teleport.override: |
    rewrite stop {
      name exact teleport.unorouter.com teleport.teleport.svc.cluster.local
      answer auto
    }
  # The encrypting S3 gateway for the backup writers. The name only exists inside the cluster;
  # the Let's Encrypt certificate is what makes barman and Teleport trust it.
  s3.override: |
    rewrite stop {
      name exact s3.unorouter.com s3-gateway.s3-gateway.svc.cluster.local
      answer auto
    }
