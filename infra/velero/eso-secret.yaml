# ESO -> Velero's S3 credentials (aws-cli ini format) from OpenBao r2-backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-s3
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .ACCESS_KEY_ID }}
          aws_secret_access_key={{ .ACCESS_SECRET_KEY }}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: r2-backups, property: ACCESS_KEY_ID }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: r2-backups, property: ACCESS_SECRET_KEY }
---
# Kopia repository password. Must exist BEFORE a repository is initialised, otherwise
# Velero falls back to its public default ("static-passw0rd"), which is what the
# Hetzner-era repositories used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
  data:
    - secretKey: repository-password
      remoteRef: { key: velero, property: repository_password }
