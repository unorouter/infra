# ESO -> Velero's S3 credentials (aws-cli ini format) from OpenBao pg-s3 (Hetzner project key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-s3
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .ACCESS_KEY_ID }}
          aws_secret_access_key={{ .ACCESS_SECRET_KEY }}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: pg-s3, property: ACCESS_KEY_ID }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: pg-s3, property: ACCESS_SECRET_KEY }
---
# Kopia repository password. Must exist BEFORE a repository is initialised, otherwise
# Velero falls back to its public default ("static-passw0rd"), which is what the
# Hetzner-era repositories used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
  data:
    - secretKey: repository-password
      remoteRef: { key: velero, property: repository_password }
---
# SSE-C key for the velero-plugin-for-aws (customerKeyEncryptionFile): the mounted file must
# hold the raw 32 bytes, so the base64 value from OpenBao is decoded here. Kopia has no SSE-C
# and encrypts PV data itself with the repository password above; this key covers the resource
# tarballs, which carry every cluster Secret in the clear.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-sse-c
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-sse-c
    creationPolicy: Owner
    template:
      data:
        customer-key: "{{ .k | b64dec }}"
  data:
    - secretKey: k
      remoteRef: { key: backup-encryption, property: sse_c_key_b64 }
