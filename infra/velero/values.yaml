# Velero: catch-all cluster backup (PVCs + k8s resource state) -> Hetzner Object Storage.
# Fills the gap GitOps + CNPG/OpenBao snapshots don't cover (arbitrary PVC data, namespace
# state, dynamically-created resources). node-agent (Kopia) does file-level PV backup.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.12.1
    volumeMounts:
      - mountPath: /target
        name: plugins

# S3 creds come from the ESO-synced velero-s3 secret (key 'cloud')
credentials:
  existingSecret: velero-s3

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      # Hetzner Object Storage has no at-rest encryption: the resource tarballs go up with
      # SSE-C (customerKeyEncryptionFile, key from OpenBao secret/backup-encryption) and PV
      # data is encrypted by Kopia with the velero-repo-credentials password. Own bucket
      # because Kopia must delete and rewrite; versioning plus a 14 day noncurrent expiry
      # is its protection instead of Object Lock. Fresh repositories from 2026-09-09.
      bucket: unorouter-velero
      prefix: velero
      config:
        region: fsn1
        s3ForcePathStyle: "true"
        s3Url: https://fsn1.your-objectstorage.com
        checksumAlgorithm: ""
        customerKeyEncryptionFile: /credentials/sse-c/customer-key
  volumeSnapshotLocation: []       # local-path has no CSI snapshots; use file-level (Kopia) instead

extraVolumes:
  - name: sse-c
    secret: {secretName: velero-sse-c}
extraVolumeMounts:
  - name: sse-c
    mountPath: /credentials/sse-c
    readOnly: true

# node-agent = Kopia file-level PV backup (local-path has no CSI snapshots)
deployNodeAgent: true

# daily backup of everything, keep 14 days; Kopia for PV data
schedules:
  daily:
    schedule: "0 2 * * *"
    template:
      ttl: 336h  # 14 days
      defaultVolumesToFsBackup: true  # Kopia file-level for all PVCs
      storageLocation: default
      # Velero's own kopia-maintain jobs are short-lived and hold nothing worth
      # restoring, but defaultVolumesToFsBackup makes it try their emptyDirs anyway.
      # A job that finishes mid-backup has its host volume paths torn down before the
      # node-agent reads them ("expected one matching path ... got 0"), which is an
      # ERROR, so one racing pod flips the whole run to PartiallyFailed and stalls
      # velero_backup_last_successful_timestamp -> VeleroBackupStale fires on a backup
      # that captured all 2163 items and all 10 PVCs (2026-08-19).
      #
      # Excluded by NAMESPACE, not a labelSelector: a template labelSelector is applied
      # to every item in the backup, so requiring/excluding a label silently drops the
      # unlabeled CRDs, Deployments and cluster objects that make up most of the 2163.
      # Nothing in the velero namespace needs restoring -- the Helm release recreates it
      # and the backup data itself lives in object storage.
      excludedNamespaces:
        - velero
