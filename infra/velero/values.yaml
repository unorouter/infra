# Velero: catch-all cluster backup (PVCs + k8s resource state) -> Hetzner Object Storage.
# Fills the gap GitOps + CNPG/OpenBao snapshots don't cover (arbitrary PVC data, namespace
# state, dynamically-created resources). node-agent (Kopia) does file-level PV backup.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.12.1
    volumeMounts:
      - mountPath: /target
        name: plugins

# S3 creds come from the ESO-synced velero-s3 secret (key 'cloud')
credentials:
  existingSecret: velero-s3

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      # Direct to Hetzner, no encryption layer of its own: PV data is encrypted by Kopia with
      # the velero-repo-credentials password, and the resource tarballs carry no Secrets
      # (excluded below; they come from OpenBao, cert-manager and CNPG on restore). Own bucket
      # because Kopia must delete and rewrite; versioning plus a 14 day noncurrent expiry is
      # its protection instead of Object Lock. Fresh repositories from 2026-09-09.
      bucket: unorouter-velero
      prefix: velero
      config:
        region: fsn1
        s3ForcePathStyle: "true"
        s3Url: https://fsn1.your-objectstorage.com
        checksumAlgorithm: ""
  volumeSnapshotLocation: []       # local-path has no CSI snapshots; use file-level (Kopia) instead

# node-agent = Kopia file-level PV backup (local-path has no CSI snapshots)
deployNodeAgent: true

# Daily backup of the resource state, keep 14 days. PV data is opt in: only volumes carrying
# backup.velero.io/backup-volumes are read by Kopia (Teleport auth data, Grafana storage, the
# services PVCs). The old opt out mode uploaded every emptyDir on the cluster daily (request
# logs, ArgoCD caches, OpenBao raft that the snapshots already cover) and raced with short
# lived pods into PartiallyFailed. Secrets are not backed up: ESO, cert-manager and CNPG
# recreate them, the canaries have a sops copy in secrets/canaries.sops.yaml.
schedules:
  daily:
    schedule: "0 2 * * *"
    template:
      ttl: 336h  # 14 days
      defaultVolumesToFsBackup: false
      storageLocation: default
      excludedResources:
        - secrets
      # Excluded by NAMESPACE, not a labelSelector: a template labelSelector is applied
      # to every item in the backup, so requiring/excluding a label silently drops the
      # unlabeled CRDs, Deployments and cluster objects that make up most of the items.
      # Nothing in the velero namespace needs restoring, the Helm release recreates it.
      excludedNamespaces:
        - velero
