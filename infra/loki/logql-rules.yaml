# LogQL alert rules for Loki's ruler (the sidecar copies ConfigMaps labelled loki_rule=1 into
# /rules/<tenant>; the tenant is "fake" because auth is off). Alerts go to the same
# Alertmanager as Prometheus and follow its routes: severity info is the Discord digest.
# Each group here replaced a log-tailing Python watcher; the pollers left in
# monitoring/extras/pollers read HTTP APIs and SQL, not logs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: monitoring
  labels: { loki_rule: "1" }
  annotations: { k8s-sidecar-target-directory: /rules/fake }
data:
  security.yaml: |
    groups:
      - name: pgaudit
        interval: 1m
        rules:
          # Replaces pgaudit-watch. CNPG writes pgaudit records to the postgres pods' stdout;
          # Alloy ships them with the JSON intact. Exempt: the app role, the metrics exporter
          # reading over the instance socket, the archiver reading its one table from the pod
          # network, and the reader role from the pod network (the Teleport database agent is
          # the only pod the databases network policy lets reach 5432 with that role; Teleport's
          # own db.session events name the person). Parallel workers repeat their leader's row.
          - alert: PgauditNonAppRole
            expr: >-
              sum by (pod, record_user_name, src, record_audit_class, record_audit_object_name) (
                count_over_time(
                  {namespace="databases", container="postgres"}
                    | json
                    | logger="pgaudit"
                    | record_user_name!="newapi"
                    | record_backend_type!="parallel worker"
                    | (record_user_name!="cnpg_metrics_exporter" or record_audit_class!="READ" or record_connection_from!="[local]")
                    | (record_user_name!="reader" or record_connection_from!~"10\\.42\\..*")
                    | (record_user_name!="evidence_archiver" or record_audit_class!="READ" or record_audit_object_name!="public.pat_change_audit" or record_connection_from!~"10\\.42\\..*")
                    | label_format src=`{{ regexReplaceAll ":[0-9]+$" .record_connection_from "" }}`
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: loki }
            annotations:
              summary: "pgaudit: {{ $labels.record_user_name }} on {{ $labels.pod }} from {{ $labels.src }} {{ $labels.record_audit_class }} {{ $labels.record_audit_object_name }} x{{ $value }} (5m)"
          # The audit guards (databases/*-audit*.sql) refused a statement: someone tried to drop,
          # disable or redefine an evidence trigger, take TRUNCATE back, rewrite an audit table
          # or delete or update audit rows. The app never does any of that.
          - alert: AuditGuardRefused
            expr: >-
              sum by (pod, record_user_name, src) (
                count_over_time(
                  {namespace="databases", container="postgres"} |= "audit guard:"
                    | json
                    | logger="postgres"
                    | record_error_severity="ERROR"
                    | label_format src=`{{ regexReplaceAll ":[0-9]+$" .record_connection_from "" }}`
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: loki, burn_in: "until-2026-10-11" }
            annotations:
              summary: "audit guard refused {{ $labels.record_user_name }} from {{ $labels.src }} on {{ $labels.pod }} x{{ $value }} (5m)"

      # Replaces openbao-audit-watch. The audit device writes to stdout. Silent: UI plumbing,
      # logins, and read/list by the two identities whose purpose is reading (ESO for the
      # committed key inventory, the snapshot job for the raft snapshot). Anything on a sensitive
      # path posts regardless. No standing root token exists since 2026-09-08 (dr.sh mints one
      # from the unseal keys for DR), so root policy in use is break-glass or a breach.
      - name: openbao
        interval: 1m
        rules:
          - alert: OpenBaoRootUsed
            expr: >-
              sum by (auth_display_name, src) (
                count_over_time(
                  {namespace="openbao", container="openbao"}
                    |= `"type":"response"`
                    |~ `"policies":\[[^\]]*"root"`
                    | json
                    | label_format src=`{{ regexReplaceAll ":[0-9]+$" .request_remote_address "" }}`
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: loki }
            annotations:
              summary: "openbao root policy used by {{ $labels.auth_display_name }} from {{ $labels.src }}: {{ $value }} requests in 5m"
          - alert: OpenBaoNonRoutineActivity
            expr: >-
              sum by (auth_display_name, request_operation, src) (
                count_over_time(
                  {namespace="openbao", container="openbao"}
                    |= `"type":"response"`
                    | json
                    | (request_path=~"(sys/(policies|policy|auth|mounts|audit|seal|unseal|rekey|generate-root|raft|rotate|internal/counters)|auth/token/(create|revoke-accessor|roles)|auth/[^/]+/(config|role|roles)|identity/).*|auth/token/revoke"
                       or (request_path!~"(sys/internal/ui/|sys/health|sys/seal-status|sys/capabilities-self|auth/token/lookup-self|auth/token/revoke-self).*"
                           and request_path!~".*/(login|auth_url)"
                           and (auth_display_name!="kubernetes-external-secrets-external-secrets" or request_operation!~"read|list" or request_path!~"secret/data/(alertmanager|argocd-scm|backup-encryption|bot-env|clickhouse|clickhouse-security-exporter|cloudflare-edge|cloudflared|dex-sso|evidence-pg|ghcr-pull|github-watch|grafana|hetzner-watch|newapi-env|newapi-pg-ca|newapi-pg-client-ca|newapi-pg-clickhouse-dict|newapi-pg-grafana-reader|newapi-pg-ip-retention|newapi-pg-reader|ntfy|pg-s3|s3gw|sync-env|tailscale-watch|teleport-github|uno-import-env|uno-import-pull|unorouter-env|velero)")
                           and (auth_display_name!="kubernetes-openbao-openbao-snapshot" or request_operation!="read" or request_path!="sys/storage/raft/snapshot")))
                    | label_format src=`{{ regexReplaceAll ":[0-9]+$" .request_remote_address "" }}`
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: loki }
            annotations:
              summary: "openbao: {{ $labels.auth_display_name }} from {{ $labels.src }}: {{ $value }} {{ $labels.request_operation }} in 5m"

      # Replaces teleport-login-watch. The auth pods print every audit event as JSON. A role,
      # connector or user change is how a stolen editor session escalates, always paged; a GitHub
      # refusal of the connector's own credentials means every SSO login is dead.
      - name: teleport
        interval: 1m
        rules:
          # The auth audit stream goes at most about 30 minutes without an event; 3h of nothing
          # means the auth pod's log is not reaching Loki and the alerts below are blind.
          - alert: TeleportAuditSilent
            expr: absent_over_time({namespace="teleport", container="teleport", pod=~"teleport-auth.*"} |= `"event":` [3h])
            labels: { severity: warning, source: loki }
            annotations:
              summary: "no Teleport audit event for 3h: logins, role and connector changes are unwatched"
          - alert: TeleportPrivilegeChange
            expr: >-
              sum by (user, event, name, addr_remote) (
                count_over_time(
                  {namespace="teleport", container="teleport", pod=~"teleport-auth.*"}
                    |= `"event":`
                    | json
                    | event=~"role\\.(created|updated|deleted)|(github|saml|oidc)\\.(created|updated|deleted)|user\\.(create|update|delete)|trusted_cluster\\.(create|delete)"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: loki }
            annotations:
              summary: "teleport privilege change by {{ $labels.user }} from {{ $labels.addr_remote }}: {{ $labels.event }} {{ $labels.name }}"
          # Every successful Teleport login, to Discord. Teleport only sees the proxy and
          # cloudflared pod addresses, so the line names the user and method, not a source IP.
          - alert: TeleportLogin
            expr: >-
              sum by (user, method) (
                count_over_time(
                  {namespace="teleport", container="teleport", pod=~"teleport-auth.*"}
                    |= `"event":"user.login"`
                    | json
                    | success="true"
                  [5m]
                )
              ) > 0
            labels: { severity: warning, source: loki }
            annotations:
              summary: "Teleport login: {{ $labels.user }} via {{ $labels.method }}"
          - alert: TeleportSSOBroken
            expr: >-
              sum by (method, addr_remote) (
                count_over_time(
                  {namespace="teleport", container="teleport", pod=~"teleport-auth.*"}
                    |= `"event":"user.login"`
                    |= "incorrect_client_credentials"
                    | json
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: loki }
            annotations:
              summary: "GitHub rejects the Teleport connector credentials ({{ $labels.method }} login from {{ $labels.addr_remote }}); rebuild the connector from infra/teleport/resources/github-connector.yaml plus OpenBao secret/teleport-github"
          - alert: TeleportLogins
            expr: >-
              sum by (user, method, src) (
                count_over_time(
                  {namespace="teleport", container="teleport", pod=~"teleport-auth.*"}
                    |= `"event":"user.login"`
                    | json
                    | success="true"
                    | label_format src=`{{ regexReplaceAll ":[0-9]+$" .addr_remote "" }}`
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: loki }
            annotations:
              summary: "teleport login ok {{ $labels.user }} via {{ $labels.method }} from {{ $labels.src }}"
          # Every agent, proxy and the operator bot join with their ServiceAccount token through
          # one of these provision tokens; any other successful join is a new token or a rogue agent.
          - alert: TeleportUnexpectedJoin
            expr: >-
              sum by (event, method, token_name, node_name) (
                count_over_time(
                  {namespace="teleport", container="teleport", pod=~"teleport-auth.*"}
                    |~ `"event":"(bot|instance)\.join"`
                    | json
                    | success="true"
                    | (method!="kubernetes" or token_name!~"teleport-proxy|kube-agent|teleport-operator")
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: loki, burn_in: "until-2026-10-11" }
            annotations:
              summary: "Teleport {{ $labels.event }} by {{ $labels.node_name }} with token {{ $labels.token_name }} ({{ $labels.method }})"
          - alert: TeleportLoginFailed
            expr: >-
              sum by (who, method, src, reason) (
                count_over_time(
                  {namespace="teleport", container="teleport", pod=~"teleport-auth.*"}
                    |= `"event":"user.login"`
                    | json
                    | success="false"
                    | label_format who=`{{ or .user .login .attributes_login .attributes_username }}`, src=`{{ regexReplaceAll ":[0-9]+$" .addr_remote "" }}`, reason=`{{ .error | trunc 100 }}`
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: loki }
            annotations:
              summary: "teleport login FAILED {{ $labels.who }} via {{ $labels.method }} from {{ $labels.src }}: {{ $labels.reason }} x{{ $value }}"
          # pgaudit sees only the role; this line names the person behind a write-capable session
          - alert: TeleportDbAdminSession
            expr: >-
              sum by (user, db_user, db_service, db_name) (
                count_over_time(
                  {namespace="teleport", container="teleport", pod=~"teleport-auth.*"}
                    |= `"event":"db.session.start"`
                    | json
                    | db_user=~"dbadmin|postgres"
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: loki }
            annotations:
              summary: "db admin session {{ $labels.user }} as {{ $labels.db_user }} on {{ $labels.db_service }}/{{ $labels.db_name }} x{{ $value }}"

      # Dex fronts ArgoCD, OpenBao and Grafana with the same GitHub org gate and, unlike
      # Teleport, names the refused user.
      - name: dex
        interval: 1m
        rules:
          - alert: DexLoginRefused
            expr: >-
              sum by (who) (
                count_over_time(
                  {namespace="dex"}
                    |= "not in required orgs"
                    | regexp `user "(?P<who>[^"]+)" not in required orgs`
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: loki }
            annotations:
              summary: "dex REFUSED https://github.com/{{ $labels.who }} (not in the org) x{{ $value }}"
          - alert: DexLogin
            expr: >-
              sum by (who, groups) (
                count_over_time(
                  {namespace="dex"}
                    |= `msg="login successful"`
                    | regexp `preferred_username=(?P<who>\S+).*groups=\[(?P<groups>[^\]]*)\]`
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: loki }
            annotations:
              summary: "dex login ok https://github.com/{{ $labels.who }} groups [{{ $labels.groups }}]"

      # All k8s audit alerting. Human and unknown actors first, then system identities: a
      # kubelet is bounded by the apiserver's NodeRestriction (only Secrets of pods on its node),
      # so the signal is a workload identity reading a Secret outside its own namespace, or a
      # token minted by something that is not a node or a controller. Same names and the same
      # source label as the retired DaemonSet, so the routes are unchanged: exec and secret reads
      # by anyone but the owner's own Teleport identity page the phone. The archive is Vector's.
      # The owner's laptop keeps two tunnels open (tsh-newapi, tsh-s3) and reopens them on every
      # drop, dozens of times a day, so his port-forwards into those pods are not reported; an
      # exec there, or a port-forward anywhere else, still is.
      - name: k8s-audit
        interval: 1m
        rules:
          # The apiserver audit stream never drops below about 10,000 lines per 10 minutes.
          # Silence means every K8s* rule here is blind.
          - alert: K8sAuditLogSilent
            expr: absent_over_time({job="k8s-audit"}[15m])
            labels: { severity: critical, source: loki, burn_in: "until-2026-10-11" }
            annotations:
              summary: "no Kubernetes audit lines for 15m: every K8s* alert is blind"
          - alert: K8sPodExec
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb!~"watch|list"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:.*"
                    | actor="0-don"
                    | objectRef_subresource=~"exec|attach|portforward"
                    | (objectRef_subresource!="portforward" or objectRef_name!~"new-api-(master|slave)-.+|s3-gateway-[0-9]+")
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.objectRef_subresource }} into {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          - alert: K8sPodExec
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb!~"watch|list"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:.*"
                    | actor!="0-don"
                    | objectRef_subresource=~"exec|attach|portforward"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.objectRef_subresource }} into {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          - alert: K8sSecretRead
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb!~"watch|list"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:.*"
                    | actor="0-don"
                    | objectRef_resource="secrets"
                    | objectRef_namespace=~"|services|openbao|databases"
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.verb }} secret {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          - alert: K8sSecretRead
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb!~"watch|list"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:.*"
                    | actor!="0-don"
                    | objectRef_resource="secrets"
                    | objectRef_namespace=~"|services|openbao|databases"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.verb }} secret {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          - alert: K8sSecurityConfigurationChanged
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb!~"watch|list"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:.*"
                    | actor="0-don"
                    | objectRef_resource=~"externalsecrets|secretstores|clustersecretstores|roles|rolebindings|clusterroles|clusterrolebindings"
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.verb }} {{ $labels.objectRef_resource }} {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          - alert: K8sSecurityConfigurationChanged
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb!~"watch|list"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:.*"
                    | actor!="0-don"
                    | objectRef_resource=~"externalsecrets|secretstores|clustersecretstores|roles|rolebindings|clusterroles|clusterrolebindings"
                  [5m]
                )
              ) > 0
            labels: { severity: critical, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.verb }} {{ $labels.objectRef_resource }} {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          - alert: K8sUnexpectedAccess
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb!~"watch|list"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:.*"
                    | actor="0-don"
                    | objectRef_subresource!~"exec|attach|portforward"
                    | (objectRef_resource!="secrets" or objectRef_namespace!~"|services|openbao|databases")
                    | objectRef_resource!~"externalsecrets|secretstores|clustersecretstores|roles|rolebindings|clusterroles|clusterrolebindings"
                    | (objectRef_resource=~"secrets|serviceaccounts" or verb=~"create|patch|update|delete|deletecollection")
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.verb }} {{ $labels.objectRef_resource }}{{ if $labels.objectRef_subresource }}/{{ $labels.objectRef_subresource }}{{ end }} {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          - alert: K8sUnexpectedAccess
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb!~"watch|list"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:.*"
                    | actor!="0-don"
                    | objectRef_subresource!~"exec|attach|portforward"
                    | (objectRef_resource!="secrets" or objectRef_namespace!~"|services|openbao|databases")
                    | objectRef_resource!~"externalsecrets|secretstores|clustersecretstores|roles|rolebindings|clusterroles|clusterrolebindings"
                    | (objectRef_resource=~"secrets|serviceaccounts" or verb=~"create|patch|update|delete|deletecollection")
                  [5m]
                )
              ) > 0
            labels: { severity: warning, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.verb }} {{ $labels.objectRef_resource }}{{ if $labels.objectRef_subresource }}/{{ $labels.objectRef_subresource }}{{ end }} {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          # Client certificates are minted only by Talos (control plane, kubelets, talos:admin)
          # and by `talosctl kubeconfig` (admin). Any other name means someone else holds the
          # Kubernetes CA key.
          - alert: K8sUnknownClientCert
            expr: >-
              sum by (actor, src) (
                count_over_time(
                  {job="k8s-audit"} |= "X509SHA256"
                    | json
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ .user_username }}`
                    | actor!~"admin|talos:admin|system:kube-controller-manager|system:kube-scheduler|system:node:unorouter-node[0-9]+"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch }
            annotations:
              summary: "client certificate {{ $labels.actor }} used the kube API from {{ $labels.src }} x{{ $value }}"
          # A service account changing RBAC, webhooks or admission policies, or exec, attach,
          # port-forward or an ephemeral container into a pod. The rules above skip system:
          # actors, so a stolen service account token was invisible to them. The allowlist pairs
          # each controller with the objects it touches in normal operation (7-day replay clean).
          - alert: K8sServiceAccountPrivilegedChange
            expr: >-
              sum by (actor, verb, objectRef_resource, objectRef_subresource, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"} |= "system:serviceaccount:"
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor=~"system:serviceaccount:.*"
                    | verb=~"create|update|patch|delete|deletecollection"
                    | objectRef_resource=~"^(roles|rolebindings|clusterroles|clusterrolebindings|mutatingwebhookconfigurations|validatingwebhookconfigurations|validatingadmissionpolicies|validatingadmissionpolicybindings)$" or objectRef_subresource=~"^(exec|attach|ephemeralcontainers|portforward)$"
                    | actor!~"system:serviceaccount:(argocd:argocd-application-controller|kube-system:.*)"
                    | label_format pair=`{{ .actor }} {{ .objectRef_resource }}`
                    | pair!~"system:serviceaccount:cnpg-system:(cnpg-manager|plugin-barman-cloud) (roles|rolebindings)|system:serviceaccount:(monitoring:kps-admission|cert-manager:cert-manager-cainjector) (mutating|validating)webhookconfigurations|system:serviceaccount:teleport-agent:teleport-app-access (roles|rolebindings|clusterroles|clusterrolebindings)"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch, burn_in: "until-2026-10-11" }
            annotations:
              summary: "{{ $labels.actor }} {{ $labels.verb }} {{ $labels.objectRef_resource }}/{{ $labels.objectRef_subresource }} {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          # Listing secrets returns every value at once; the get-based rules above skip list.
          # Controllers that list as part of their job are allowlisted (7-day replay); the owner
          # gets an info line, anyone else (break-glass admin included) is critical.
          - alert: K8sSecretList
            expr: >-
              sum by (actor, ns, src) (
                count_over_time(
                  {job="k8s-audit"} |= "\"secrets\"" |= "\"list\""
                    | json
                    | stage="ResponseComplete"
                    | verb="list"
                    | objectRef_resource="secrets"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`, ns=`{{ or .objectRef_namespace "all namespaces" }}`
                    | actor!~"system:serviceaccount:(external-secrets:external-secrets|argocd:.*|monitoring:(image-secret-scan|monitoring-grafana|monitoring-kube-state-metrics)|velero:velero-server|kube-system:.*)|system:node:.*|system:kube-controller-manager"
                    | actor!="0-don"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch, burn_in: "until-2026-10-11" }
            annotations:
              summary: "{{ $labels.actor }} listed every secret in {{ $labels.ns }} from {{ $labels.src }} x{{ $value }}"
          - alert: K8sSecretList
            expr: >-
              sum by (actor, ns, src) (
                count_over_time(
                  {job="k8s-audit"} |= "\"secrets\"" |= "\"list\""
                    | json
                    | stage="ResponseComplete"
                    | verb="list"
                    | objectRef_resource="secrets"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`, ns=`{{ or .objectRef_namespace "all namespaces" }}`
                    | actor!~"system:serviceaccount:(external-secrets:external-secrets|argocd:.*|monitoring:(image-secret-scan|monitoring-grafana|monitoring-kube-state-metrics)|velero:velero-server|kube-system:.*)|system:node:.*|system:kube-controller-manager"
                    | actor="0-don"
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} listed every secret in {{ $labels.ns }} from {{ $labels.src }} x{{ $value }}"
          # In-cluster clients and kubectl identify as client-go or kubectl; a curl, python or wget
          # user agent on the kube API was seen only once in 7 days: the 2026-09-29 intruder.
          - alert: K8sScriptingClient
            expr: >-
              sum by (actor, ua, src) (
                count_over_time(
                  {job="k8s-audit"} |~ `"userAgent":"(curl|[Pp]ython|[Ww]get|httpie|PostmanRuntime)`
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`, ua=`{{ .userAgent }}`
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch, burn_in: "until-2026-10-11" }
            annotations:
              summary: "{{ $labels.actor }} used the kube API with {{ $labels.ua }} from {{ $labels.src }} x{{ $value }}"
          # A system:masters client cert from anywhere but the node mesh, the nodes themselves
          # (Hetzner prefixes, loopback) or the operator laptop. Also catches a cert that
          # borrows a known name. Teleport traffic carries no client cert and is not matched.
          - alert: K8sMastersFromUnknownSource
            expr: >-
              sum by (actor, src) (
                count_over_time(
                  {job="k8s-audit"} |= "X509SHA256" |= "system:masters"
                    | json
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ .user_username }}`
                    | src!=ip("10.200.0.0/24") | src!=ip("127.0.0.0/8") | src!="::1"
                    | src!=ip("167.233.0.0/16") | src!=ip("2a01:4f8::/32") | src!="100.89.57.70"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch }
            annotations:
              summary: "system:masters client cert {{ $labels.actor }} from {{ $labels.src }} x{{ $value }}"
          # Teleport maps kube-admin to the teleport-admins group. An impersonated request in
          # system:masters means a role in Teleport was changed to grant it.
          - alert: K8sImpersonatedMasters
            expr: >-
              sum by (actor) (
                count_over_time(
                  {job="k8s-audit"} |= "impersonatedUser" |= "system:masters"
                    | regexp `"impersonatedUser":\{"username":"(?P<actor>[^"]*)","groups":\[(?P<igroups>[^\]]*)\]`
                    | igroups=~".*system:masters.*"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch, burn_in: "until-2026-10-11" }
            annotations:
              summary: "Teleport impersonated system:masters for {{ $labels.actor }} x{{ $value }}"
          # A service account reading a Secret in another namespace. Platform controllers and the
          # ESO reader that mirrors the CNPG CA into teleport-agent are the routine.
          - alert: K8sSecretRead
            expr: >-
              sum by (actor, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb="get"
                    | objectRef_resource="secrets"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor=~"system:serviceaccount:.*"
                    | actor!~"system:serviceaccount:(external-secrets|argocd|cnpg-system|cert-manager|kube-system|velero):.*"
                    | actor!="system:serviceaccount:monitoring:kps-operator"
                    | actor!="system:serviceaccount:teleport-agent:eso-db-ca-reader"
                    | label_format actor_ns=`{{ regexReplaceAll "^system:serviceaccount:([^:]+):.*$" .actor "${1}" }}`
                    | label_format own=`{{ if eq .actor_ns .objectRef_namespace }}1{{ else }}0{{ end }}`
                    | own="0"
                    | objectRef_namespace=~"services|openbao|databases"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} read secret {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} outside its namespace from {{ $labels.src }} x{{ $value }}"
          - alert: K8sSecretRead
            expr: >-
              sum by (actor, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage=~"ResponseComplete|ResponseStarted|Panic"
                    | verb="get"
                    | objectRef_resource="secrets"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor=~"system:serviceaccount:.*"
                    | actor!~"system:serviceaccount:(external-secrets|argocd|cnpg-system|cert-manager|kube-system|velero):.*"
                    | actor!="system:serviceaccount:monitoring:kps-operator"
                    | actor!="system:serviceaccount:teleport-agent:eso-db-ca-reader"
                    | label_format actor_ns=`{{ regexReplaceAll "^system:serviceaccount:([^:]+):.*$" .actor "${1}" }}`
                    | label_format own=`{{ if eq .actor_ns .objectRef_namespace }}1{{ else }}0{{ end }}`
                    | own="0"
                    | objectRef_namespace!~"services|openbao|databases"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: warning, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} read secret {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} outside its namespace from {{ $labels.src }} x{{ $value }}"
          # A token minted for a service account by something other than a kubelet or the
          # controllers (ESO mints one for eso-db-ca-reader).
          - alert: K8sTokenMinted
            expr: >-
              sum by (actor, objectRef_namespace, objectRef_name, src) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage="ResponseComplete"
                    | verb="create"
                    | objectRef_resource="serviceaccounts"
                    | objectRef_subresource="token"
                    | regexp `"sourceIPs":\["(?P<src>[^"]+)"`
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                    | actor!~"system:node:.*"
                    | actor!~"system:serviceaccount:(kube-system|external-secrets):.*"
                    | actor!="system:kube-controller-manager" or objectRef_namespace!="kube-system"
                  [5m]
                )
              ) > 0
            labels: { severity: warning, source: k8s-audit-watch }
            annotations:
              summary: "{{ $labels.actor }} minted a token for {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }} from {{ $labels.src }} x{{ $value }}"
          # A Job in services created by anything but the CronJob controller. Pods are
          # useless for this: the job-controller creates them by generateName, so the
          # metadata-level audit event carries no name to tell cron pods from others.
          - alert: K8sUnexpectedJob
            expr: >-
              sum by (objectRef_name, actor) (
                count_over_time(
                  {job="k8s-audit"}
                    | json
                    | stage="ResponseComplete"
                    | verb="create"
                    | objectRef_resource="jobs"
                    | objectRef_subresource=""
                    | objectRef_namespace="services"
                    | user_username!="system:serviceaccount:kube-system:cronjob-controller"
                    | label_format actor=`{{ or .impersonatedUser_username .user_username }}`
                  [5m]
                )
              ) > 0
            labels: { severity: critical, source: k8s-audit-watch }
            annotations:
              summary: "Job {{ $labels.objectRef_name }} created in services by {{ $labels.actor }}"

      - name: hubble
        interval: 1m
        rules:
          # Hubble exports drops and internet egress; the longest normal gap is about 2.5h.
          # The ruler read 0 bytes for 5 minutes on 2026-10-04 while lines existed.
          - alert: HubbleExportSilent
            expr: absent_over_time({job="hubble"}[6h])
            for: 15m
            labels: { severity: warning, source: loki }
            annotations:
              summary: "no Hubble flow lines for 6h: metadata and egress alerts are blind"
          # A pod asking the Hetzner metadata service for anything: it serves the node's
          # machine config. metadata-egress-deny drops the packet; the attempt itself means
          # something in that pod is looking for credentials.
          - alert: PodMetadataServiceAccess
            expr: >-
              sum by (ns, pod, verdict) (
                count_over_time(
                  {job="hubble"} |= "169.254.169.254"
                    | json ns="flow.source.namespace", pod="flow.source.pod_name", verdict="flow.verdict"
                    | ns!~"teleport|teleport-agent" or verdict!="DROPPED"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: hubble }
            annotations:
              summary: "{{ $labels.ns }}/{{ $labels.pod }} tried the metadata service ({{ $labels.verdict }}) x{{ $value }}"
          # Teleport (auth, proxy and agent) probes the AWS, GCP and Azure metadata services on every
          # start to detect its cloud (lib/inventory/metadata, no switch to turn it off). Dropped, so
          # a Discord line instead of a page; a forwarded attempt still pages above.
          - alert: TeleportAgentMetadataProbe
            expr: >-
              sum by (pod) (
                count_over_time(
                  {job="hubble"} |= "169.254.169.254" |= "teleport"
                    | json ns="flow.source.namespace", pod="flow.source.pod_name", verdict="flow.verdict"
                    | ns=~"teleport|teleport-agent" and verdict="DROPPED"
                  [5m]
                )
              ) > 0
            labels: { severity: warning, source: hubble }
            annotations:
              summary: "{{ $labels.pod }} probed the metadata service at start (dropped) x{{ $value }}"

      # Talos API calls as apid logs them (kube-system/talos-apid-log, infra/talos/apid-log.yaml).
      # Each call is logged twice, once per proxy hop; the hop with talos-role carries the role.
      - name: talos
        interval: 1m
        rules:
          # Calls that change a node, mint credentials or read files. The nightly etcd-backup
          # (os:etcd:backup, EtcdSnapshot only) is routine; planned node work pages too.
          - alert: TalosAPIPrivilegedCall
            expr: >-
              sum by (method, role, talos_node) (
                count_over_time(
                  {namespace="kube-system", app="talos-apid-log"} |= "talos-role="
                    |~ `\[/[a-z]+\.[A-Za-z]+Service/(ApplyConfiguration|Reset|Upgrade|Reboot|Shutdown|Rollback|Bootstrap|GenerateClientConfiguration|GenerateConfiguration|EtcdRemoveMember|EtcdRemoveMemberByID|EtcdLeaveCluster|EtcdForfeitLeadership|EtcdRecover|Copy|Read|ImageImport|ImageRemove|MetaWrite|MetaDelete|DiskUsage|Rotate[A-Za-z]*)\]`
                    | regexp `^(?P<talos_node>[^:]+): .*\[/[a-z]+\.[A-Za-z]+Service/(?P<method>[A-Za-z]+)\].*talos-role=(?P<role>[^;)]+)`
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: talos-apid }
            annotations:
              summary: "Talos API {{ $labels.method }} as {{ $labels.role }} on {{ $labels.talos_node }} x{{ $value }}"
          # The follower stopped: no apid line for 26h. The nightly etcd-backup calls apid at
          # 02:30 on every node, so a working follower never goes a day without a line.
          - alert: TalosAPILogSilent
            expr: absent_over_time({namespace="kube-system", app="talos-apid-log"}[26h])
            # one empty evaluation during index compaction fired it on 2026-10-03 with lines in range
            for: 10m
            labels: { severity: warning, source: talos-apid }
            annotations:
              summary: "no apid lines from talos-apid-log for 26h: the follower or its talosconfig is broken"

      # Tetragon's export (kube-system/tetragon, container export-stdout; infra/tetragon).
      - name: tetragon
        interval: 1m
        rules:
          # A container process opened Talos machine secrets or state, etcd data, kubelet PKI or
          # kubernetes config on the host (TracingPolicy sensitive-host-files): it reached the
          # host filesystem, the way the 2026-09-29 pods did through hostPID and /proc/1/root.
          - alert: TetragonHostSecretAccess
            expr: >-
              sum by (node, t_ns, t_pod, t_bin, t_path) (
                count_over_time(
                  {namespace="kube-system", container="export-stdout"} |= "security_file_permission"
                    | json t_ns="process_kprobe.process.pod.namespace", t_pod="process_kprobe.process.pod.name",
                           t_bin="process_kprobe.process.binary", t_path="process_kprobe.args[0].file_arg.path"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: tetragon }
            annotations:
              summary: "{{ $labels.t_ns }}/{{ $labels.t_pod }} ({{ $labels.t_bin }}) read host {{ $labels.t_path }} on {{ $labels.node }} x{{ $value }}"
          # apid or trustd accepted a connection from outside loopback, the mesh, the pod network
          # and the tailnet (TracingPolicy talos-api-callers). The node firewall admits nothing
          # else to 50000 and 50001, so a hit means it was bypassed or changed.
          - alert: TalosAPIForeignCaller
            expr: >-
              sum by (node, t_bin, t_peer) (
                count_over_time(
                  {namespace="kube-system", container="export-stdout"} |= "talos-api-callers"
                    | json t_bin="process_kprobe.process.binary", t_peer="process_kprobe.return.sock_arg.daddr"
                    | t_peer != "" and t_peer != "invalid IP"
                    | t_peer !~ `(::ffff:)?(127\.[0-9.]+|10\.200\.0\.[0-9]+|10\.42\.[0-9.]+|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9.]+)|::1`
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: tetragon }
            annotations:
              summary: "{{ $labels.t_bin }} on {{ $labels.node }} accepted a connection from {{ $labels.t_peer }} x{{ $value }}"
          # The export stopped: cron pollers start processes every few minutes, so an hour
          # without a single exec event means the agent or its export sidecar is down.
          - alert: TetragonExportSilent
            expr: absent_over_time({namespace="kube-system", container="export-stdout"} |= "process_exec" [1h])
            labels: { severity: warning, source: tetragon }
            annotations:
              summary: "no Tetragon process_exec events for 1h: agent or export sidecar down"

      # netcup's journal, pulled off the box by monitoring/netcup-journal (pollers/netcup-journal.yaml).
      - name: netcup
        interval: 1m
        rules:
          # The puller follows docker-events, which never goes quiet (healthcheck execs every
          # minute). Silence means the gateway, the tailnet path or netcup itself is gone, or
          # someone stopped the record.
          - alert: NetcupLogsSilent
            expr: absent_over_time({namespace="monitoring", app="netcup-journal"} |= `"ident":"docker-events"` [10m])
            labels: { page: "true", severity: critical, source: netcup-watch }
            annotations:
              summary: "no journal lines from netcup for 10 minutes (puller, tailnet or the box)"
          # Source: /usr/local/bin/cluster-secret-scan on netcup, hourly systemd timer. It logs the
          # path of any file holding a Talos machine config, talsecret, admin kubeconfig or
          # Tailscale auth key. The match stays in the 2h window, so a find keeps firing for 2h.
          - alert: NetcupClusterSecretOnDisk
            expr: >-
              sum by (path) (
                count_over_time(
                  {namespace="monitoring", app="netcup-journal"} |= `"ident":"cluster-secret-scan"`
                    |= "FOUND cluster secret on disk"
                    | regexp `on disk: (?P<path>[^"]+)`
                  [2h]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: netcup-watch, burn_in: "until-2026-10-11" }
            annotations:
              summary: "cluster secret on netcup disk: {{ $labels.path }} (shred it, then rotate what it held)"
          - alert: NetcupSecretScanSilent
            expr: absent_over_time({namespace="monitoring", app="netcup-journal"} |= `"ident":"cluster-secret-scan"` |= "scan done" [3h])
            labels: { severity: warning, source: netcup-watch }
            annotations:
              summary: "netcup cluster secret scan has not reported for 3h (timer stopped or removed)"
          # A shell on netcup from anyone but the operator: Tailscale SSH is the only way in
          # (no authorized_keys, port 22 closed upstream), so any sshd login is foreign too.
          - alert: NetcupShellLogin
            expr: >-
              sum by (who) (
                count_over_time(
                  {namespace="monitoring", app="netcup-journal"} |= "handling new SSH connection from"
                    | regexp `from (?P<who>[^ ]+) \(`
                    | who!="2-don@github"
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: netcup-watch }
            annotations:
              summary: "Tailscale SSH on netcup from {{ $labels.who }} x{{ $value }}"
          - alert: NetcupShellLogin
            expr: >-
              sum by (ident) (
                count_over_time({namespace="monitoring", app="netcup-journal"} |~ `"ident":"sshd[^"]*"` |= "Accepted " [5m])
              ) > 0
            labels: { page: "true", severity: critical, source: netcup-watch }
            annotations:
              summary: "sshd accepted a login on netcup x{{ $value }}"
          # auditd file watches on netcup: keys, sudoers, account files and the audit rules
          # themselves are read or changed only during deliberate operator work. The one
          # exception is the daily systemd-tmpfiles-clean run, which checks /root/.ssh for
          # Debian's provision.conf: excluded only as systemd's own child with no login session.
          - alert: NetcupSensitiveFileAccess
            expr: >-
              sum by (key, comm) (
                count_over_time(
                  {namespace="monitoring", app="netcup-journal"} |= `"ident":"audisp-syslog"` |~ `type=SYSCALL`
                    |~ `key=\\?"(secrets|ssh_keys|sudoers|accounts|audit_config)`
                    !~ `ppid=1 pid=[0-9]+ auid=4294967295 .*exe=\\?"/usr/bin/systemd-tmpfiles\\?"`
                    | regexp `comm=\\?"(?P<comm>[^"\\]+)`
                    | regexp `key=\\?"(?P<key>[a-z_]+)`
                  [5m]
                )
              ) > 0
            labels: { page: "true", severity: critical, source: netcup-watch }
            annotations:
              summary: "netcup {{ $labels.key }} touched by {{ $labels.comm }} x{{ $value }}"
          - alert: NetcupConfigChange
            expr: >-
              sum by (key) (
                count_over_time(
                  {namespace="monitoring", app="netcup-journal"} |= `"ident":"audisp-syslog"` |~ `type=SYSCALL`
                    |~ `key=\\?"(persistence|komodo|docker|sshd)`
                    | regexp `key=\\?"(?P<key>[a-z_]+)`
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: netcup-watch }
            annotations:
              summary: "netcup {{ $labels.key }} files changed x{{ $value }}"
          - alert: NetcupKomodoAction
            expr: >-
              sum by (op, actor) (
                count_over_time(
                  {namespace="monitoring", app="netcup-journal"} |= `"ident":"komodo-updates"`
                    | regexp `\\"op\\": \\"(?P<op>[A-Za-z]+)\\", \\"by\\": \\"(?P<actor>[^\\"]+)`
                    | op!=""
                    | op!~"RunProcedure|RotateAllServerKeys|BackupCoreDatabase|GlobalAutoUpdate"
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: netcup-watch }
            annotations:
              summary: "Komodo {{ $labels.op }} by {{ $labels.actor }} x{{ $value }}"
          # Context for the Discord digest: the operator's own sessions, sudo, admin UI logins
          # (both behind Cloudflare Access, so a login got past GitHub first).
          - alert: NetcupActivity
            expr: >-
              sum by (kind) (
                count_over_time(
                  {namespace="monitoring", app="netcup-journal"}
                    != `"ident":"komodo-updates"`
                    |~ `handling new SSH connection|"ident":"sudo"|"ident":"su"|/auth/login|/api/auth|"ident":"(useradd|usermod|passwd|chpasswd|crontab)"`
                    | regexp `"ident":"(?P<kind>[^"]+)"`
                  [5m]
                )
              ) > 0
            labels: { severity: info, source: netcup-watch }
            annotations:
              summary: "netcup {{ $labels.kind }} activity x{{ $value }} (Loki: {namespace=\"monitoring\", app=\"netcup-journal\"})"

      # Application security events the bot and the responder log as JSON lines.
      - name: apps
        interval: 1m
        rules:
          # A review lead, not proof: any send whose response carries no message id
          # lands here too. warning, because the responder has to go look rather
          # than act. The bot asks Discord for with_response on interaction
          # callbacks so the ordinary reply path no longer trips this.
          - alert: DiscordMessageNeedsReview
            expr: >-
              sum by (pod, message_id) (
                count_over_time(
                  {namespace="services", app="unorouter-bot"}
                    |= "security.discord_correlation"
                    |= "unmatched_in_this_process"
                    | json
                  [5m]
                )
              ) > 0
            labels: { severity: warning, source: loki }
            annotations:
              summary: "Discord message {{ $labels.message_id }} has no matching request in {{ $labels.pod }}; confirm the bot account sent it"
          # The gateway writes log and audit rows to ClickHouse off the request path with no
          # retry: every one of these lines is a row that will never exist (restart, memory cap).
          - alert: GatewayLogRowsLost
            expr: >-
              sum by (table) (
                count_over_time(
                  {namespace="services", app="new-api"}
                    |= "failed to write"
                    | regexp `failed to write (?P<table>logs|audit_logs) row`
                    | table != ""
                  [5m]
                )
              ) > 0
            labels: { severity: warning, source: loki }
            annotations:
              summary: "{{ $value }} gateway {{ $labels.table }} rows failed to reach ClickHouse in 5 minutes and are lost; the error is in the new-api log line"
          # Rows ClickHouse refused wait in Postgres log_spool; the master logs the depth once a
          # minute while it is not empty. A quarter hour of it means ClickHouse keeps refusing.
          - alert: GatewayLogSpoolBacklog
            expr: >-
              sum(
                count_over_time(
                  {namespace="services", app="new-api"}
                    |= "log spool depth:"
                  [15m]
                )
              ) >= 12
            labels: { severity: warning, source: loki }
            annotations:
              summary: "gateway log rows have waited in Postgres log_spool for 15 minutes: ClickHouse is down or refusing inserts (nothing lost yet, they drain when it recovers)"
          # Free lanes answering 429 keep this at 500 to 1,500 an hour (Sep 28 to 30: median
          # 815, max 1,527), so only a jump well past that means something broke.
          - alert: GatewayDisableStorm
            expr: >-
              sum(
                count_over_time(
                  {namespace="services", app="new-api"}
                    |= "preparing to disable"
                  [1h]
                )
              ) > 2000
            labels: { severity: warning, source: loki }
            annotations:
              summary: "gateway auto-disabled {{ $value }} lanes in the last hour"
          # Share of relay attempts that ended in an upstream channel error over 15
          # minutes, gateway-wide (the log carries the channel id, not the provider). Free
          # lane failover keeps it at 20 to 45% (Sep 28 to 30: median 28%, max 54%).
          - alert: GatewayChannelErrorRate
            expr: >-
              (
                sum(count_over_time({namespace="services", app="new-api"} |= "channel error (channel #" [15m]))
                /
                (
                  sum(count_over_time({namespace="services", app="new-api"} |= "channel error (channel #" [15m]))
                  + sum(count_over_time({namespace="services", app="new-api"} |= "record consume log" [15m]))
                )
              ) > 0.6
            labels: { severity: warning, source: loki }
            annotations:
              summary: "{{ $value | humanizePercentage }} of relay attempts hit an upstream channel error in the last 15 minutes"
