# The one gateway credential (secret/s3gw), as the AWS_* names Loki's S3 client reads. Loki 3.6
# is on aws-sdk-go-v2, whose default request checksums (aws-chunked CRC32 trailers) hang against
# Hetzner's RadosGW; when_required keeps the classic SigV4 PUT, the same fix CNPG needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: loki-s3
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .ak }}"
        AWS_SECRET_ACCESS_KEY: "{{ .sk }}"
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  data:
    - secretKey: ak
      remoteRef: { key: s3gw, property: ACCESS_KEY_ID }
    - secretKey: sk
      remoteRef: { key: s3gw, property: ACCESS_SECRET_KEY }
